<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Grayscale antialiasing for every program, before KDE's own settings apply (see
     /etc/xdg/kdeglobals): after Ubuntu's 10-sub-pixel-rgb.conf, so RGB subpixel rendering and its
     colour fringes on OLED panels are off. A user's fonts.conf (Settings > Fonts) still wins. -->
<fontconfig>
  <description>Rungic: grayscale antialiasing on phone panels</description>
  <match target="pattern">
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>
  <match target="font">
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>
</fontconfig>
