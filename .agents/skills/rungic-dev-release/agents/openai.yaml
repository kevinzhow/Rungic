interface:
  display_name: "Rungic Development Overlays and Releases"
  short_description: "Test changes as phone overlays, then create accepted releases"
  default_prompt: >-
    Use $rungic-dev-release to choose development overlays, dev releases, or formal releases.
    Check the local machine, build machine, and phone before execution.
    Report APT, integrity, and acceptance results.
