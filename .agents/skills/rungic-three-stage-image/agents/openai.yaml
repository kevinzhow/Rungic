interface:
  display_name: "Rungic Three-Stage Builds and Installation"
  short_description: "Prepare a device base, build RungicOS, and install or upgrade"
  default_prompt: >-
    Use $rungic-three-stage-image to check the specified device base and build an independent RungicOS image.
    Prepare installation or upgrade within the requested scope.
    State which tools exist and which parts still need implementation.
