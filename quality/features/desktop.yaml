    code: []
    docs: [docs/44-plasma-user-account.md]

  - id: desktop.design-system
    title: Rungic 应用的统一外观
    scenario: desktop.manage
    status: live
    platform: linux
    interfaces: []
    summary: 设计系统 com.rungic.design：深浅色跟随系统，控件按状态有明确反馈，底部选择面板和页面横滑返回。
    experience:
      - id: E1
        text: 应用和 Home 浮层的深浅色跟随系统配色变化，也可在应用里固定为浅色或深色，重启后保留。
        evidence:
          - {doc: docs/87-agent-app-redesign.md, date: 2026-09-29, note: "实测：主题切到深色时应用、状态栏、导航栏同时变化"}
      - id: E2
        text: 点选项行、开关行、列表行时有按下反馈，快速一点也至少显示 150 ms。
        evidence:
          - {doc: docs/102-design-system-choices-and-swipe-back.md, date: 2026-10-01, note: "用户实测"}
      - id: E3
        text: 底部选择面板点一项后先显示选中再收起；点遮罩、下拖或返回键关闭且不做选择。
        evidence:
          - {doc: docs/102-design-system-choices-and-swipe-back.md, date: 2026-10-01, note: "用户实测"}
      - id: E4
        text: 在页面任意位置向右横滑返回上一页，跟手、按松手方向判断；纵向滚动不受影响，手指下的控件不会被当成一次点击。
        evidence:
          - {doc: docs/102-design-system-choices-and-swipe-back.md, date: 2026-10-01, note: "用户实测"}
      - id: E5
        text: 各控件的全部状态（关、开、按下、禁用、聚焦）在浅色和深色下颜色对比达标，状态总览可离线和在手机上渲染核对。
        evidence:
          - {doc: docs/87-agent-app-redesign.md, date: 2026-09-30, note: "设计系统状态总览浅色、深色全部核对"}
