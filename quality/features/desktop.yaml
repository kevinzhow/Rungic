  # ---------------------------------------------------------------- desktop.manage
  - id: desktop.power
    title: 亮屏、息屏与电池
    scenario: desktop.manage
    status: live
    platform: linux
    interfaces: [platform-bridge, kwin-android-host]
    summary: 播放视频等请求保持亮屏时手机屏幕不灭；Plasma 的息屏时间就是安卓的息屏时间；电池来自真实 UPower，锁屏和休眠交给安卓。
    experience:
      - id: E1
        text: 视频播放时（PowerDevil/ScreenSaver 请求）安卓窗口保持亮屏，暂停后租约释放；请求方退出或断开时租约自动回收，别的客户端不能替它释放。
        evidence:
          - {doc: docs/42-plasma-runtime-acceptance.md, date: 2026-09-23, note: "power-showtime-final.log"}
      - id: E2
        text: 显示出来的 Wayland 窗口请求空闲抑制时，经 KWin 到宿主保持亮屏，释放后恢复正常息屏。
        evidence:
          - {doc: docs/72-kwin-android-host-isolation.md, date: 2026-09-26, note: "idle.inhibit 通过"}
        device: Wayland 窗口的空闲抑制由 KWin 的 Android 后端在宿主的输出面上建抑制器，经 Rungic 应用的原生宿主（idle_inhibit.rs，单元测试只能在手机上跑：android/test-native-core.sh）设置 FLAG_KEEP_SCREEN_ON；无头 KWin 没有 Android 后端，系统测试走不到这条路。
      - id: E3
        text: Plasma 移动电源页的“关闭屏幕”时间与安卓 screen_off_timeout 双向同步；页面只显示真能发生的动作（不显示调暗和挂起）。
        evidence:
          - {doc: docs/73-reduce-upstream-changes.md, date: 2026-09-27, note: "第四阶段：电源"}
      - id: E4
        text: Rungic 离开前台后不强制亮屏，不创建 CPU 唤醒锁；Linux 桥意外退出后亮屏租约 12 秒内过期。
      - id: E5
        text: ScreenSaver.Lock 让安卓息屏，D-Bus 调用先返回成功；没有 Linux 锁屏密码，唤醒后回到桌面。
        evidence:
          - {doc: docs/42-plasma-runtime-acceptance.md, date: 2026-09-23, note: "电源行为：设备进入 Dozing，再唤醒回桌面"}
      - id: E6
        text: 电池电量、温度和充电状态来自真实 UPower；低电量的危急动作不会关机或休眠容器。
        evidence:
          - {doc: docs/40-plasma-mobile-integration.md, date: 2026-09-23, note: "电池 / 亮度"}
    pitfalls:
      - text: KWin 只对显示出的窗口计算空闲抑制；探针只在裸 wl_surface 上建抑制器时直连宿主有效、经 KWin 无效。
        docs: [docs/72-kwin-android-host-isolation.md]
      - text: 不承诺息屏听歌、后台视频或相机持续运行，安卓仍可冻结后台 APK；也不保证所有第三方播放器都发抑制请求。
        docs: [docs/42-plasma-runtime-acceptance.md]
      - text: ScreenSaver.Lock 要异步延迟约 300 ms 执行，否则屏幕关闭后 APK 冻结造成 IPC 假超时。
        docs: [docs/42-plasma-runtime-acceptance.md]
      - text: powerdevil 的屏蔽原因没有记录；不要按服务清单的旧默认随意改动电源相关服务。
        docs: [docs/83-service-policy.md]
    code:
      - desktop/power-policy.py
      - packages/powerdevil/
      - system/config/etc/UPower/UPower.conf.d/60-rungic-android.conf
      - android/host/src/android/idle_inhibit.rs
      - tools/tests/test_power_policy.py
    docs:
      - docs/42-plasma-runtime-acceptance.md
      - docs/72-kwin-android-host-isolation.md

