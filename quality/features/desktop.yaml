  - id: desktop.clipboard
    title: 剪贴板与安卓互通
    scenario: desktop.type
    status: live
    platform: linux
    interfaces: [clipboard]
    summary: 纯文本在安卓与 Linux 之间自动双向同步，不要求 Rungic 在前台；敏感内容不跨系统。
    experience:
      - id: E1
        text: 在安卓里复制的中文、emoji、换行约 200 ms 内出现在 Linux 剪贴板；在 Linux 里复制的文字能在安卓应用里粘贴。
        evidence:
          - {doc: docs/research/clipboard-background.md, date: 2026-09-29, note: "android-copy.json、android-paste.json"}
          - {doc: docs/49-plasma-performance.md, date: 2026-09-28, note: "约 200 ms 同步到 Linux"}
      - id: E2
        text: Rungic 不在前台、处于自己的全屏或 APK 重建时同步照常进行。
        evidence:
          - {doc: docs/research/clipboard-background.md, date: 2026-09-29, note: "fullscreen-final.json、compat-watch.json"}
        device: 不在前台、全屏或 APK 重建时照常同步，靠的是安卓侧以 Shell 身份（UID 2000）独立于 APK 窗口运行的剪贴板后端（ClipboardDaemon、system/android-clipboard）；后台读剪贴板的权限和 APK 的重建只有手机上才有。Linux 一侧的同步与重连由离线测试检查。
      - id: E3
        text: 安卓标记为敏感的内容、非文本内容不同步，Linux 原内容保留；超长或格式错误的请求被拒绝；重启 Linux 桥时不把旧 Linux 文本写回安卓。
        evidence:
          - {doc: docs/research/clipboard-background.md, date: 2026-09-29, note: "filter-tests.json、sensitive-restart.json"}
      - id: E4
        text: 安卓侧剪贴板后端被杀后自动重启，安卓当前文字重新同步到 Linux。
        evidence:
          - {doc: docs/research/clipboard-background.md, date: 2026-09-29, note: "recovery.json"}
      - id: E5
        text: 设备锁定或非主用户时不交换剪贴板内容；日志里从不记录正文。
        gap: 锁屏与多用户只在实现上拒绝，未在实机锁屏或建用户实测（clipboard-background）
    pitfalls:
      - text: 桥只交换当前值；安卓连续复制 A/B/C 后才切回 Linux 只能得到 C，断线期间的每一次复制不补回，也不导入输入法自己的历史。
        docs: [docs/research/clipboard-history.md, docs/research/clipboard-background.md]
      - text: 后台读取剪贴板只有 Shell UID 2000 经 framework ClipboardManager 可行；普通 APK 后台服务拿不到权限，root 身份返回空不代表成功，只 createPackageContext 会触发包/UID 不匹配。
        docs: [docs/research/clipboard-background.md]
      - text: Klipper 默认 NoEmptyClipboard=true 会主动恢复上一条，安卓清空后 Linux 又被写回；验证清空要临时关闭它。
        docs: [docs/research/clipboard-background.md]
      - text: 不能用 cp 覆盖正在解释执行的 shell 脚本（曾出现残缺命令），部署要整文件 rename 原子替换。
        docs: [docs/research/clipboard-background.md]
      - text: 不要用最新控制器直接覆盖旧 G100 的完整控制器（曾让 account-setup --status 报无效账户）。
        docs: [docs/research/clipboard-background.md]
    code:
      - shared/platform/clipboard.py
      - desktop/rungic-plasma-clipboard.service
      - system/android-clipboard
      - android/app/src/com/rungic/clipboard/ClipboardDaemon.java
      - android/app/src/com/rungic/plasma/AndroidClipboardBridge.java
      - packages/wl-clipboard/
      - tools/deploy_clipboard.py
      - tools/tests/android_clipboard/
      - tools/tests/test_clipboard_bridge.py
    docs: [docs/research/clipboard-background.md]

  - id: desktop.clipboard-history
    title: 剪贴板历史
