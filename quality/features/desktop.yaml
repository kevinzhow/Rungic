      - system/bluetooth.conf
      - packages/kf6-bluez-qt/
      - android/app/src/com/rungic/plasma/AndroidBluetoothBridge.java
      - android/app/src/com/rungic/bluetooth/RootBluetooth.java
    docs: [docs/73-reduce-upstream-changes.md]

  - id: desktop.cellular
    title: 移动网络
    scenario: desktop.connect
