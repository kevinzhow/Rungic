        text: 有 SIM 时，快捷设置的移动数据开关真正打开或关闭安卓的移动数据。
        gap: 测试手机没有 SIM，只验证了无 SIM 路径
      - id: E3
        text: SIM PIN、选网、APN 与漫游等操作明确返回不支持，留在安卓设置里完成。
    pitfalls:
      - text: 模拟服务要先发布对象再占用总线名，否则 ModemManagerQt 只枚举一次、之后看不到调制解调器。
        docs: [docs/73-reduce-upstream-changes.md]
    code:
