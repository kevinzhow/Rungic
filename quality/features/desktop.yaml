  # ---------------------------------------------------------------- desktop.display
  - id: desktop.host-display
    title: 桌面流畅地画在手机上
    scenario: desktop.display
    status: live
    platform: android
    interfaces: [kwin-android-host, gpu-device, host-controller]
    summary: KWin 作为安卓宿主里的嵌套合成器，输出缓冲直接交给 SurfaceFlinger（零拷贝、显式同步、按需 vsync），滑动跟手、静止省电。
    experience:
      - id: E1
        text: 零拷贝时宿主不再每帧用 GLES 重画，SurfaceFlinger 以硬件合成（DEVICE）显示 KWin 的输出缓冲；强制 GPU 合成（CLIENT）时颜色仍正确，SurfaceFlinger 和 system_server 不崩溃。
        evidence:
          - {doc: docs/57-zero-copy-explicit-sync.md, date: 2026-09-24, note: "零拷贝；BGRA 事故修复后的 CLIENT 验证"}
      - id: E2
        text: KWin 不在 glFinish 上等 GPU，用 fence 交出缓冲；抽屉滚动时 KWin 绘制 p95 约 4 ms，SurfaceFlinger 帧间隔 p95 约 16.8 ms。
        evidence:
          - {doc: docs/57-zero-copy-explicit-sync.md, date: 2026-09-24, note: "结论表：零拷贝 + fence"}
          - {doc: docs/72-kwin-android-host-isolation.md, date: 2026-09-26, note: "perf.compositor：paint p95 3.74 ms、呈现间隔 p95 16.72 ms"}
      - id: E3
        text: 滚动时 KWin 的提交一到就转成 SurfaceControl 事务，约 8–14% 的显示间隔迟到一个 vsync（之前 29%）。
        evidence:
          - {doc: docs/57-zero-copy-explicit-sync.md, date: 2026-09-26, note: "宿主帧节拍与 vsync 预测对照"}
      - id: E4
        text: 桌面静止时宿主不再每个 vsync 唤醒，APK 合计约 2–5% 单核；有输入、提交或回调时立即恢复节拍，点击静止后的桌面能正常启动应用。
        evidence:
          - {doc: docs/57-zero-copy-explicit-sync.md, date: 2026-09-24, note: "按需vsync（第3项）"}
      - id: E5
        text: Plasma 在前台时桌面会话提升到大核（uclamp.min 50%），回到安卓桌面后恢复；滑动掉帧比例约减半，后台不常驻大核。
        evidence:
          - {doc: docs/49-plasma-performance.md, date: 2026-09-28, note: "大核调度与空闲开销"}
    pitfalls:
      - text: 零拷贝缓冲必须同时通过 HWC 与 GPU（CLIENT）两条合成路径的验收；只用安卓公开的 AHB 格式（RGBA），BGRA 曾让 SurfaceFlinger abort、安卓用户空间重启并断掉无线调试。
        docs: [docs/57-zero-copy-explicit-sync.md]
      - text: 零拷贝和 fence 必须同时开；只开 fence 时宿主要在 CPU 上等 fence 再做 GLES，帧间隔 p95 劣化到 25 ms。
        docs: [docs/57-zero-copy-explicit-sync.md]
      - text: 报真实呈现时间会形成正反馈（KWin 安全余量增大、帧数从 370 降到 106），帧时间线和 3 帧在途实测更差，都已撤回；默认提交后立即报告。
        docs: [docs/57-zero-copy-explicit-sync.md]
      - text: 同一 App 的 SurfaceControl 事务 FIFO 排队，未 signal 的 acquire fence 会阻塞后续事务；容器 GPU 挂死时显示一起停住。
        docs: [docs/57-zero-copy-explicit-sync.md]
      - text: 对照测试不能每轮重开 App（后台恢复 Codex 线程的负载叠在一起，结论能相反）；在同一实例里交替切换运行时开关。
        docs: [docs/57-zero-copy-explicit-sync.md]
      - text: 容器应用的 GPU 内存失控会让 lmkd 杀掉前台宿主连带整个会话（Elisa 封面纹理 13824² 被 DPR 乘了三次）；共享层防护尚未实施。
        docs: [docs/57-zero-copy-explicit-sync.md]
      - text: dpkg-buildpackage -nc 可能因 build stamp 完全跳过编译，包版本变了库还是旧的；要用库内符号和运行行为核对。
        docs: [docs/42-plasma-runtime-acceptance.md]
      - text: KWin 的 Android 专用代码都在 src/backends/android；上游文件只留钩子，升级时在钩子签名处编译失败而不是文本冲突。不要再往 Wayland 后端各处加 Android 判断或环境变量。
        docs: [docs/72-kwin-android-host-isolation.md]
    code:
      - packages/kwin/
      - packages/android-host/
      - packages/smithay/
      - packages/winit/
      - android/host/
      - android/test-native-core.sh
      - android/app/src/com/winland/server/NativeBridge.java
    docs:
      - docs/57-zero-copy-explicit-sync.md
      - docs/72-kwin-android-host-isolation.md
      - docs/49-plasma-performance.md

  - id: desktop.resolution-refresh
    title: 原生分辨率与刷新率
    scenario: desktop.display
    status: live
    platform: android
    interfaces: [kwin-android-host, platform-bridge]
    summary: 桌面按手机原生分辨率渲染；KDE 显示设置里可选固定 30/60/90/120Hz 或“自动”，都真正交给安卓执行。
    experience:
      - id: E1
        text: 桌面以原生分辨率渲染（G100 S 1080×2400），KScreen 的手机输出与安卓显示尺寸一致，显示页列出物理分辨率与渲染分辨率。
        evidence:
          - {doc: docs/50-plasma-display-settings.md, date: 2026-09-23, note: "19:03 实机进展"}
      - id: E2
        text: 选固定 30/60/90/120Hz 时安卓的物理模式随之改变；选“自动”时请求交还安卓（refreshPolicy=0），触摸时升到 120Hz、静止后由安卓降下来。
        evidence:
          - {doc: docs/50-plasma-display-settings.md, date: 2026-09-23, note: "rate-validation.json、auto-validation.json"}
          - {doc: docs/85-phone-display-size-policy.md, date: 2026-09-28, note: "host-refresh-test.json：每步 vrrPolicy=2 且宿主 refreshPolicy=0"}
      - id: E3
        text: 改分辨率或显示大小不会把动态刷新率误当作固定刷新率意图。
        evidence:
          - {doc: docs/85-phone-display-size-policy.md, date: 2026-09-28, note: "rungic7/kscreen4 修复后重测"}
      - id: E4
        text: Rungic 离开前台时撤销 Surface/Window 的刷新率请求，回来后恢复；默认“流畅优先”，可在左边缘菜单切换“自动”。
        evidence:
          - {doc: docs/49-plasma-performance.md, date: 2026-09-23, note: "最终版本生命周期复核"}
      - id: E5
        text: 显示模式或刷新率变化时 plasmashell 不崩溃。
        evidence:
          - {doc: docs/73-reduce-upstream-changes.md, date: 2026-09-27, note: "kwayland Output::addMode 失效迭代器"}
    pitfalls:
      - text: hasArrSupport=false，“自动”是安卓的刷新率调度，不是 KScreen 的 VRR；请求不保证被满足（相机启动时见过请求 120 实际 60），也不绕过温控。
        docs: [docs/50-plasma-display-settings.md, docs/49-plasma-performance.md]
      - text: KScreen 的 VRR 枚举是 automatic 不代表宿主策略是自动（曾保留 90）；验收要同时读宿主 refreshPolicy。
        docs: [docs/85-phone-display-size-policy.md]
      - text: 后台的 android-refresh.ini 保留最后一次前台样本，要看 sampled-uptime-ms，不能当作后台仍在申请 120Hz。
        docs: [docs/49-plasma-performance.md]
      - text: 每个 display changed 事件都重发刷新率、原生层无条件重发 mode 会造成切换掉帧；两级都按实际值去重。
        docs: [docs/49-plasma-performance.md]
      - text: 720×1600 时代的性能数据不能用于原生分辨率的判断。
        docs: [docs/49-plasma-performance.md]
    code:
      - android/app/src/com/rungic/plasma/DisplayPacer.java
      - packages/kwin/debian/patches/rungic/android-backend.patch
      - packages/kwayland/
      - desktop/screen-metrics.cpp
    docs:
      - docs/50-plasma-display-settings.md
      - docs/73-reduce-upstream-changes.md

  - id: desktop.display-size
    title: 手机显示大小
    scenario: desktop.display
    status: live
    platform: linux
    interfaces: [kwin-android-host]
    summary: 首次默认的界面大小按安卓密度算出（X70 350%、G100 300%）；设置里五档大小，切换渲染分辨率时界面大小不变。
    experience:
      - id: E1
        text: 没有显示配置时，KWin 按安卓 density 和原生短边算出默认倍率（不少于 360 逻辑像素短边）；已有用户选择（包括 300%）不被重算，安卓 density 改变也不改已有选择。
        evidence:
          - {doc: docs/85-phone-display-size-policy.md, date: 2026-09-28, note: "第二轮：480 → 3.5、320 → 2.5，已有 3.5 保留"}
      - id: E2
        text: 显示页给手机内屏五档大小，“标准”是推荐值；范围外的旧值显示为“自定义”，打开设置不会悄悄改掉；高级里能看真实倍率（50–500%）。
        evidence:
          - {doc: docs/85-phone-display-size-policy.md, date: 2026-09-28, note: "GUI 点选“标准”得到 350%"}
      - id: E3
        text: 应用新大小后 15 秒不确认就回到原值，点“保留”后保留；会话重启后仍是用户的选择。
        evidence:
          - {doc: docs/85-phone-display-size-policy.md, date: 2026-09-28, note: "display-gui-timeout-trace.json；20260928.6 补测"}
      - id: E4
        text: 原生与 720 渲染之间切换时界面逻辑大小不变，多次往返倍率和保存的密度不漂移。
        evidence:
          - {doc: docs/85-phone-display-size-policy.md, date: 2026-09-28, note: "原生↔720 三轮 3.5↔1.9917"}
      - id: E5
        text: 外屏（电视、助理屏）的缩放各自独立，调手机大小不改外屏；外屏设为主屏时状态栏安全区仍只用于手机。
        evidence:
          - {doc: docs/85-phone-display-size-policy.md, date: 2026-09-28, note: "display-external-test.json（宿主第二输出，非物理电视）"}
      - id: E6
        text: 非法倍率（例如 6 倍、NaN、0）被拒绝，不写入配置；宿主拒绝或超时时恢复旧模式和刷新策略并返回失败。
        evidence:
          - {doc: docs/85-phone-display-size-policy.md, date: 2026-09-28, note: "非法 6 倍请求未写入"}
    pitfalls:
      - text: 安卓 density 是逻辑 dp 倍率，不是面板 PPI；480/160=3 不能保证 Plasma 控件与安卓控件等大。默认的 1.25 系数是待跨设备校准的产品参数。
        docs: [docs/85-phone-display-size-policy.md, docs/50-plasma-display-settings.md]
      - text: 测试时要等旧 KWin 进程完全退出再移开 kwinoutputconfig.json，否则读到旧值；短时间多次重启还会触发 StartLimit。
        docs: [docs/85-phone-display-size-policy.md]
      - text: 外屏旧位置与手机之间的空隙会让 KScreen 整套配置校验失败，表现为缩放应用不了；用标准接口把外屏贴到内屏右边界。
        docs: [docs/85-phone-display-size-policy.md]
      - text: 新账户、整包清数据首装、第二台设备和 API 30–33 回退路径还没有实机验收；当前账户移开配置的测试不等于首装。
        docs: [docs/85-phone-display-size-policy.md]
    code:
      - shared/display-policy/
      - packages/kscreen/
      - packages/kwin/debian/patches/rungic/handset-display-size.patch
      - system/config/etc/xdg/rungic-display-policyrc
      - tools/test_display_policy.py
    docs: [docs/85-phone-display-size-policy.md]

