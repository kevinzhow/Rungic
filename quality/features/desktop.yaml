  # ---------------------------------------------------------------- desktop.connect
  - id: desktop.network
    title: Wi-Fi 与网络
    scenario: desktop.connect
    status: live
    platform: linux
    interfaces: [network]
    summary: 安卓的网络经 NetworkManager D-Bus 接口给桌面用：状态栏、快捷设置和 Wi-Fi 设置页显示真实连接，能扫描、连接和忘记网络。
    experience:
      - id: E1
        text: 状态栏、设置和其他 NetworkManager 客户端显示安卓真实的 SSID、IP、DNS 与联网状态（Connectivity=4）。
        evidence:
          - {doc: docs/40-plasma-mobile-integration.md, date: 2026-09-23, note: "网络"}
      - id: E2
        text: Wi-Fi 设置页列出已保存的当前网络和附近网络，能扫描、激活已保存网络、删除网络；点未保存的加密网络弹出 KDE 密码框。
        evidence:
          - {doc: docs/73-reduce-upstream-changes.md, date: 2026-09-27, note: "第四阶段与设置页验收：16 个接入点"}
      - id: E3
        text: 在 Linux 里打开或关闭 Wi-Fi，安卓的 Wi-Fi 跟着变，显示状态以安卓随后读数为准。
      - id: E4
        text: 安卓网络变化后很快反映到 Linux，而且不靠高频轮询（SSID 与信号正常，空闲时无持续开销）。
        evidence:
          - {doc: docs/49-plasma-performance.md, date: 2026-09-28, note: "平台桥 watch 验收"}
      - id: E5
        text: 安卓接口异常或超时时状态变为未知，不继续显示过期的“已连接”；不支持的操作明确返回 NotSupported，不伪造成功。
      - id: E6
        text: Linux 程序的域名解析跟随安卓当前默认网络（开 VPN 时用 VPN 的 DNS）：/etc/resolv.conf 随网络变化原子更新，断网时不保留已失效的服务器；安卓侧连不上时保持原样。
      - id: E7
        text: 用户手工写的 /etc/resolv.conf（没有 Rungic 标记行）或符号链接不被覆盖。
    pitfalls:
      - text: 镜像只带一行占位注释的 /etc/resolv.conf，原先没有任何机制写入 DNS，新装设备的 Linux 程序解析不了域名（issue #7）。容器与安卓共用网络命名空间（lxc.net.0.type = none），可以直接用安卓默认网络的 DNS。严格模式的私人 DNS（DoT）不在此列：容器仍按普通 53 端口查询。
        docs: [docs/research/32-network-integration.md]
      - text: 没有 Linux NetworkManager 守护进程、wpa_supplicant 或 DHCP；安卓独占网卡、路由、DNS 与凭据。在服务页打开 NetworkManager 等服务可能抢走网卡、断开无线调试。
        docs: [docs/research/32-network-integration.md, docs/83-service-policy.md]
      - text: 普通安卓 API 会脱敏 SSID/BSSID，靠白名单 root cmd wifi 补齐；固定安卓 16 的输出格式，换 ROM 要重验。
        docs: [docs/research/32-network-integration.md]
      - text: ModemManagerQt 等客户端只在服务已存在时订阅 InterfacesAdded，桥接服务要先发布对象再占用总线名。
        docs: [docs/73-reduce-upstream-changes.md]
      - text: 实际连接新网络未在实机验证：离开当前 Wi-Fi 会断开 adb。设置页启动时曾短暂看到临时连接 Settings/wifi，待查。
        docs: [docs/73-reduce-upstream-changes.md]
      - text: ObjectManager 在 /org/freedesktop，Manager 在 /org/freedesktop/NetworkManager，两个路径不能混淆。
        docs: [docs/research/32-network-integration.md]
    code:
      - shared/platform/network-manager.py
      - tools/tests/test_resolv_conf.py
      - desktop/rungic-plasma-network.service
      - system/network-manager.conf
      - android/app/src/com/rungic/plasma/AndroidNetworkBridge.java
      - android/app/src/com/rungic/wifi/RootWifi.java
    docs:
      - docs/research/32-network-integration.md
      - docs/73-reduce-upstream-changes.md

  - id: desktop.bluetooth
    title: 蓝牙
    scenario: desktop.connect
    status: live
    platform: linux
    interfaces: [bluetooth]
    summary: 安卓蓝牙经 BlueZ D-Bus 接口给 bluedevil 和蓝牙设置用：开关、搜索、配对、连接。
    experience:
      - id: E1
        text: 蓝牙设置页显示适配器和开关（不再是“没有找到蓝牙适配器”），配对向导能扫描并列出附近设备。
        evidence:
          - {doc: docs/73-reduce-upstream-changes.md, date: 2026-09-27, note: "第四阶段的设置页验收：蓝牙"}
      - id: E2
        text: 搜索期间安卓每约 12 秒结束一次扫描时自动续开，客户端退出后停止搜索。
        evidence:
          - {doc: docs/73-reduce-upstream-changes.md, date: 2026-09-27, note: "bluetoothctl 与 bluedevil"}
      - id: E3
        text: 在安卓里开关蓝牙后，容器里的 BlueZ 状态约 2–6 秒内跟上。
        evidence:
          - {doc: docs/49-plasma-performance.md, date: 2026-09-28}
