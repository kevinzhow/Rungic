  - id: desktop.services-ssh
    title: 系统服务页与 SSH 登录
    scenario: desktop.manage
    status: live
    platform: linux
    interfaces: []
    summary: 设置 → 系统管理 → 系统服务列出容器默认关闭的服务、原因和风险，可以重新打开或关闭，SSH 也在这里管理。
    experience:
      - id: E1
        text: 服务页按分组列出被屏蔽的服务、原因、依据和风险；Ubuntu 自带的 /usr/lib 屏蔽只显示不能改。
        evidence:
          - {doc: docs/83-service-policy.md, date: 2026-09-28, note: "实机验收：页面"}
      - id: E2
        text: 打开有风险的服务先确认一次，再弹 polkit 密码框；在确认框或密码框取消时开关回到原状态，系统不变；输入密码晚于 25 秒也能完成。
        evidence:
          - {doc: docs/83-service-policy.md, date: 2026-09-28, note: "取消路径；KAuth 超时改为 10 分钟"}
      - id: E3
        text: 服务页的 SSH 一项显示运行状态，以及手机各个地址的连接命令和 ED25519 主机密钥指纹（与 ssh-keyscan 一致）；在这里关闭或重新打开 SSH。SSH 自动开启本身见 install.ssh-access。
        evidence:
          - {doc: docs/83-service-policy.md, date: 2026-09-28, note: "页面显示“运行中”与 wlan0、tun0、Docker 网桥三个地址"}
      - id: E4
        text: 用户在服务页的改动在升级后保留（每个单元的默认值只落地一次）。
        evidence:
          - {doc: docs/83-service-policy.md, date: 2026-09-28, note: "迁移：service-defaults 记录 31 个单元"}
    pitfalls:
      - text: 用户明确要求 SSH 自动开启；docs/83 的“默认关闭”、policy.json 的 ssh 组 default=disabled 和 sshd 配置注释都是旧设计，不能据此关闭 SSH 或增加关闭策略。自动开启目前靠首启脚本 enable ssh.socket。
        docs: [docs/83-service-policy.md, docs/research/g100-system-update-20260929.md]
      - text: 容器与安卓共用网络，SSH 监听手机自己的地址，没有独立局域网 IP。
        docs: [docs/83-service-policy.md, docs/research/g100-ssh-connectivity-20260929.md]
      - text: 无障碍 Press 只翻转 FormSwitchDelegate 的外观、不触发处理函数，自动化测试要用 ui_tap；确认框要放在窗口 overlay 上而不是滚动页面里。
        docs: [docs/83-service-policy.md]
      - text: 打开 NetworkManager、wpa_supplicant、networkd 等可能抢走安卓网卡、断开无线调试；界面警告但不阻止。
        docs: [docs/83-service-policy.md]
      - text: 输入真实账户密码让 KAuth 辅助程序完整执行 SSH 开关、用账户密码 SSH 登录、从同一局域网另一台设备连接都还没验证。
        docs: [docs/83-service-policy.md]
    code:
      - desktop/services/
      - packaging/rungic-plasma-services/
      - tools/system/tests/services_page.py
    docs:
      - docs/83-service-policy.md
      - docs/research/g100-system-update-20260929.md
      - docs/research/g100-ssh-connectivity-20260929.md

  - id: desktop.screen-recording
    title: 录屏
    scenario: desktop.manage
    status: live
    platform: linux
    interfaces: [codec, audio, shared-storage]
    summary: 快捷设置一点开始录屏，用手机硬件 H.264 编码，带系统声音或麦克风；接着电视时每块屏各录一个文件。
    experience:
      - id: E1
        text: 录屏快捷设置写出可播放的 MP4，含 H.264 视频和 AAC 音频两轨，保存在 ~/Videos。
        evidence:
          - {doc: docs/73-reduce-upstream-changes.md, date: 2026-09-27, note: "recording.quicksetting 连续 6 次通过"}
      - id: E2
        text: 停止录屏后很快收尾（约 0.3 秒），不会超时只留下 .partial.mp4；编码跟不上时丢帧而不积压。
        evidence:
          - {doc: docs/48-plasma-media-pipelines.md, date: 2026-09-27, note: "录屏收尾超时的原因与修复"}
      - id: E3
        text: 录到的是完整桌面和应用画面，方向正确，不是黑屏。
        evidence:
          - {doc: docs/46-plasma-recording-and-edge-back.md, date: 2026-09-23, note: "moto3-frame.png"}
          - {doc: docs/48-plasma-media-pipelines.md, date: 2026-09-23, note: "moto4 方向正常"}
        device: 画面是手机上 KWin 的录屏流在 Adreno GPU 上回读的像素（screencast-gles-readback），方向随安卓；像素对不对只有手机的 GPU 和驱动能说明。不黑屏的另一半（录屏不排除 plasmashell，screencast-mobile-shell）是 KWin 补丁的逻辑，系统测试镜像里是 Ubuntu 原版 KWin，这一半还没有自动检查。
      - id: E4
        text: 接着电视时手机和电视同时录、各存一个文件（电视上带光标），录制中断开电视两个文件都保存。
        evidence:
          - {doc: docs/48-plasma-media-pipelines.md, date: 2026-09-24, note: "多屏同时录屏"}
      - id: E5
        text: 设置里可选声音来源（无、系统声音、麦克风、两者）和画质档位；只用硬件编码器，拿不到时报错而不改用软件编码。
      - id: E6
        text: 录屏结束时弹出“录屏已保存或失败”的通知。
    pitfalls:
      - text: KWin 默认把请求进程的窗口从录屏中排除，而 Plasma Mobile 的桌面、面板和录屏按钮都在 plasmashell 里，整个桌面因此黑屏。
        docs: [docs/46-plasma-recording-and-edge-back.md]
      - text: pulsesrc 首个缓冲区可能被对齐到 2³²−1 段之后（gstaudiobasesrc 用无符号差值），混音器积压、停止时 EOS 永远等不到；属共享层问题，已在 gst-plugins-base 修复，不要在录屏程序里绕开。
        docs: [docs/73-reduce-upstream-changes.md]
      - text: 硬件编码器经宿主桥接的吞吐约 50fps，60fps 档实际约 50fps；1080×2400@60 单路和两路大尺寸同时编码会被拒绝，多屏或 60fps 时缩到长边 ≤1920。
        docs: [docs/48-plasma-media-pipelines.md]
      - text: ScreencastingRequest 固定以 pointer_hidden 申请，Screencasting 类未导出；外屏光标靠插件自带的 ScreenStreamRequest。
        docs: [docs/48-plasma-media-pipelines.md]
      - text: 共享存储挂载未就绪时 xdg-user-dirs-update 曾把 Videos 等改成 $HOME，录屏落到主目录。
        docs: [docs/48-plasma-media-pipelines.md]
      - text: 收到 20 个 PipeWire buffer 不能证明录屏像素正确。
        docs: [docs/46-plasma-recording-and-edge-back.md]
    code:
      - desktop/recording/
      - packaging/rungic-plasma-recording/
      - packages/kwin/debian/patches/rungic/screencast-mobile-shell.patch
      - packages/kwin/debian/patches/rungic/screencast-gles-readback.patch
      - packages/kwin/debian/patches/rungic/screencast-finish-without-implicit-sync.patch
      - tools/tests/test_screen_recorder.py
      - tools/system/tests/recording_notification.py
    docs:
      - docs/46-plasma-recording-and-edge-back.md
      - docs/48-plasma-media-pipelines.md

  - id: desktop.account-password
    title: 在设置里改账户密码
    scenario: desktop.manage
    status: live
    platform: linux
    interfaces: []
    summary: 首次设置之后（见 install.account-setup），在“用户与密码”（kcm_users 与 AccountsService）里改 Linux 账户的密码；软件管理和系统设置的授权随之使用新密码。
    experience:
      - id: E1
        text: 在“用户与密码”里输入旧密码和新密码后修改成功，之后 polkit 授权（软件管理、系统服务页）要的是新密码。
        gap: kcm_users 改密码与 Discover 内的密码认证都还没有实机验证（docs/44）
      - id: E2
        text: 改 Linux 密码不会重新启用 Linux 锁屏，手机锁定仍由安卓管理。
        gap: 要在无头会话里经 kcm_users 与 AccountsService 真的改一次密码，再核对 Linux 锁屏仍关着；系统测试镜像没有 accountsservice，也没有可用的系统总线。锁屏设置以 [$i] 固定、用户配置改不动，由系统测试 session_restart 检查。
