area: desktop
title: 手机桌面日常
summary: 手机上每天用的 Plasma Mobile 桌面：进得去、看得清、点得准、打得了中文，联网、声音、亮度、电源和设置都接到安卓的真实硬件上。
scenarios:
  - id: desktop.enter
    title: 桌面会话一直可用
    summary: 进入桌面之后，Rungic 应用更新、宿主重启或升级发布时，会话自己恢复，用户的设置跟着迁移、不被覆盖。
  - id: desktop.operate
    title: 在手机上操作桌面和应用
    summary: 主屏、应用抽屉、状态栏、导航栏和快捷设置；用手指直接点按、滑动、边缘返回，横竖屏切换。
  - id: desktop.type
    title: 输入文字
    summary: 用屏幕键盘打中文（Rime）或英文，用安卓输入法往桌面里打字，复制粘贴在安卓和 Linux 之间互通，并能找回剪贴板历史。
  - id: desktop.display
    title: 看得清、看得顺
    summary: 原生分辨率、合适的显示大小和刷新率，亮度可调，滑动和动画流畅。
  - id: desktop.connect
    title: 联网、蓝牙与蜂窝
    summary: 在桌面的状态栏和设置里看到并操作安卓的 Wi-Fi、蓝牙、移动网络，安卓的状态变化及时到达 Linux。
  - id: desktop.manage
    title: 设置与管理手机里的电脑
    summary: 设置应用、安卓设备页、亮屏与息屏、录屏、系统服务页、改密码、桌面中文，以及 Rungic 应用的统一外观。
features:
  # ---------------------------------------------------------------- desktop.enter
  # 首次进入、整机重启后的进入、清数据与强制停止后的恢复见 install 领域（install.desktop-entry、
  # install.cold-start、install.app-restart-recovery）；这里是进入之后会话本身的稳定。
  - id: desktop.session
    title: 桌面会话经得起宿主重启
    scenario: desktop.enter
    status: live
    platform: android
    interfaces: [kwin-android-host, host-controller]
    summary: 安卓宿主（Rungic 应用）更新或重启时，KWin 等它回来再重启，客户端不崩；会话每次启动都从干净的环境开始，不被上一次的失败或旧会话拖累。
    experience:
      - id: E1
        text: 应用更新或宿主进程重启时，KWin 记录“Host connection lost”、等宿主 socket 可连接后以 133 退出并被重启，不留核心转储；Qt 客户端不在重连空窗里段错误，桌面恢复。
        evidence:
          - {doc: docs/57-zero-copy-explicit-sync.md, date: 2026-09-24, note: "第8、9项：两次 force-stop 后 0 个新核心转储、0 次段错误"}
      - id: E2
        text: 一次 GPU 启动失败（宿主重启时 EGL 暂不可用）不会让 plasmashell 永久改用软件渲染；有 GPU 时每次会话都清掉 SceneGraphBackend=software，应用抽屉不会空白。
        evidence:
          - {doc: docs/73-reduce-upstream-changes.md, date: 2026-09-27, note: "发布20260927.9的部署验收：应用抽屉空白"}
      - id: E3
        text: 新会话等上一个会话的 startplasma-wayland 真正退出后才设置环境，plasmashell 总以手机 shell 启动，不会变成桌面版 shell。
        evidence:
          - {doc: docs/65-agent-screen.md, date: 2026-09-28, note: "会话修复（rungic-plasma-session 0.283）：连续两次重装 APK，plasmashell 都是移动版"}
      - id: E4
        text: GPU 设置、登录 PATH 在任何会话单元启动前导入用户管理器；Qt 按 XDG_CURRENT_DESKTOP 选平台主题，旧会话强加的主题不残留到新会话。
      - id: E5
        text: 桌面上没有 Linux 锁屏挡住（锁定交给安卓），kaccess 不在没有 X 显示的会话里反复崩溃。
    pitfalls:
      - text: 上一个会话的 startplasma-wayland 退出时会把用户管理器环境恢复成它启动前的样子，曾删掉 PLASMA_DEFAULT_SHELL，让 plasmashell 以桌面版 shell 启动。
        docs: [docs/96-desktop-recovery-after-apk-restart.md]
      - text: KWin 嵌套后端在宿主断开时 qFatal（上游设计），wrapper 把非 0、非 133 的退出都算崩溃、超过 10 次就不再重启；Qt 的 QT_WAYLAND_RECONNECT 在没有全局对象时重建 surface 会段错误（QTBUG-150287，上游未修），只能靠消除“没有可用 KWin”的空窗来避开。
        docs: [docs/57-zero-copy-explicit-sync.md]
      - text: KWin 退出时 Qt 客户端（plasmashell）在 wl_display_read_events 中崩溃的问题还在，部署工具从新会话就绪时才统计新崩溃。
        docs: [docs/72-kwin-android-host-isolation.md]
      - text: 迁移程序在 KWin 启动前运行，不能继承会话的 Wayland 平台（X70 首次会话五个迁移程序崩溃），只对迁移命令局部用 offscreen。
        docs: [docs/research/30-feature-adaptation.md]
      - text: 只看到进程或单元 active 不等于桌面可用；APK 升级后 kactivitymanagerd 曾激活失败，要以实际画面和就绪信号验收。
        docs: [docs/research/clipboard-background.md, docs/40-plasma-mobile-integration.md]
      - text: 桌面程序要经 user-exec systemd-run --user 继承完整会话环境；直接 user-exec 的环境较小，“不崩溃”不能代替手机模式验证。
        docs: [docs/40-plasma-mobile-integration.md]
    code:
      - desktop/session
      - desktop/kwin
      - desktop/kwin-override.conf
      - desktop/rungic-plasma-session.service
      - desktop/rungic-plasma-shared.service
      - packaging/rungic-plasma-session/
      - android/host/src/android/presentation_gate.rs
      - system/config/etc/xdg/kscreenlockerrc
      - system/config/usr/lib/systemd/user/plasma-kaccess.service.d/rungic.conf
      - tools/system/tests/session_restart.py
    docs:
      - docs/40-plasma-mobile-integration.md
      - docs/42-plasma-runtime-acceptance.md
      - docs/103-krita-save-dialog-hang.md
      - docs/research/31-backend-integration.md

  - id: desktop.settings-migration
    title: 升级时的一次性用户设置迁移
    scenario: desktop.enter
    status: live
    platform: linux
    interfaces: []
    summary: 本项目对每个用户的一次性迁移（快捷设置位置、录屏图块、旧程序路径）在 KWin 读配置前做完，只做一次，不覆盖用户自己的选择。改名迁移见 install.rebrand-migration。
    experience:
      - id: E1
        text: 用户有自定义的快捷设置列表时，投屏图块放在蓝牙之后、助理屏在投屏之后；用默认列表时不改动。
      - id: E2
        text: 录屏图块换成本项目的录屏插件，用户原来禁用的录屏仍是禁用。
      - id: E3
        text: 设置里指向旧 /usr/local 路径的输入法、门户覆盖、Codex 配置和 Firefox 启动器改到新路径；用户自己改过的值不动。
      - id: E4
        text: 迁移在 KWin 启动前运行，KWin 第一次就读到新的输入法路径；每个迁移只运行一次。旧的固定 3 倍显示迁移已退役，不凭 scale=3 猜测用户选择。
    pitfalls:
      - text: 家目录不随 rootfs 快照回滚，失败部署期间写进 ~/.config 的内容会留下；排查部署后异常时要看部署时段改过的用户配置。
        docs: [docs/61-delivery-diagnostics-plan.md]
    code:
      - system/config/usr/share/kconf_update/
      - tools/tests/test_settings_migration.py
      - tools/system/tests/settings_migration.py
    docs: [docs/61-delivery-diagnostics-plan.md]

  # ---------------------------------------------------------------- desktop.operate
  - id: desktop.shell
    title: 主屏、应用抽屉与快捷设置
    scenario: desktop.operate
    status: live
    platform: linux
    interfaces: []
    summary: Ubuntu 26.04 上的 Plasma Mobile 6.6.5：主屏、应用抽屉、任务切换、导航栏和快捷设置，按控件名就能被辅助技术和自动化操作。
    experience:
      - id: E1
        text: 桌面、应用抽屉、触摸、回主屏和任务切换都可用；普通应用（Dolphin、Koko、QmlKonsole、Haruna 等）能从抽屉启动并显示。
        evidence:
          - {doc: docs/40-plasma-mobile-integration.md, date: 2026-09-23, note: "实机验收与边界表：桌面与应用"}
          - {doc: docs/42-plasma-runtime-acceptance.md, date: 2026-09-23, note: "普通应用逐个显示"}
      - id: E2
        text: 导航栏按钮有无障碍名称（任务切换、主屏、关闭应用），按名称能经启动器打开和关闭应用。
      - id: E3
        text: 主屏静止时 plasmashell 几乎不占 CPU（约 0.6% 单核、每秒十几次唤醒）；关着的快捷设置面板里溢出的文字不再滚动。
        evidence:
          - {doc: docs/57-zero-copy-explicit-sync.md, date: 2026-09-24, note: "第6项：0.57–0.61% 单核"}
        device: 静止时 plasmashell 的单核占用和每秒唤醒次数取决于手机的 CPU 和宿主的帧节拍，只能在手机上量。关着的快捷设置不再滚动文字是 plasma-mobile 补丁（marquee-stop-when-hidden）的逻辑，系统测试镜像里只有 Ubuntu 原版 plasma-mobile，这一半还没有自动检查。
      - id: E4
        text: 横屏时主屏边距按当前可用区域计算，小组件和收藏栏都在屏幕内；默认不再行列互换，小组件保持形状，图标隐藏名称。
        evidence:
          - {doc: docs/50-plasma-display-settings.md, date: 2026-10-01, note: "横屏时小组件的布局：实机验证"}
      - id: E5
        text: 按住导航栏 Home 超过 400 ms 唤起语音助手，单击 Home 照常回主屏，滑动不算按住。
        evidence:
          - {doc: docs/59-voice-agent.md, date: 2026-09-25, note: "长按Home呼出"}
    pitfalls:
      - text: 关着的快捷设置面板为了打开速度一直不设 visible=false，MarqueeLabel 跑马灯在关闭后仍以约 100 次/秒推进动画；上游 2026-09-18/19 才修复，已回移。
        docs: [docs/57-zero-copy-explicit-sync.md]
      - text: HomeScreen.qml 在 Component.onCompleted 时根项还是 0×0，边距算成负值；容器 screen() 为 −1 时 libplasma 丢掉 availableScreenRectChanged，边距从此不更新（上游 master 一样）。
        docs: [docs/50-plasma-display-settings.md]
      - text: 横屏打开抽屉后搜索框拿到焦点，关抽屉转回竖屏时键盘会自己弹出，收起后还会出现 Paste 气泡（未修）。
        docs: [docs/50-plasma-display-settings.md]
      - text: 抽屉会保留滚动位置，被滚到搜索框下方的图标仍报告有效坐标，自动点击会落到搜索框上；验收前先把列表拖回顶部。
        docs: [docs/57-zero-copy-explicit-sync.md]
      - text: 验收前先确认 dumpsys input 的 touchingPointers 为空：一次持续的实体触摸让注入的滑动变成多指手势，快捷设置拉不下来，主屏进了编辑模式。
        docs: [docs/73-reduce-upstream-changes.md]
    code:
      - packages/plasma-mobile/
    docs:
      - docs/38-plasma-mobile.md
      - docs/40-plasma-mobile-integration.md

  - id: desktop.panels
    title: 状态栏避开挖孔，应用不被遮住
    scenario: desktop.operate
    status: live
    platform: linux
    interfaces: [kwin-android-host]
    summary: 状态栏按安卓挖孔的中心线对齐，应用的工作区从状态栏下沿开始；状态栏和导航栏随前台应用的配色。
    experience:
      - id: E1
        text: 状态栏中心线与安卓挖孔中心对齐；应用窗口顶端紧贴状态栏实际厚度（38 逻辑像素时应用 y=38），不被遮住。
        evidence:
          - {doc: docs/43-plasma-panel-workarea.md, date: 2026-09-23, note: "验收表"}
      - id: E2
        text: 全屏和自动隐藏时应用占满整屏（y=0），退出后恢复；横竖屏切换和重启 plasmashell 后工作区仍与面板一致。
        evidence:
          - {doc: docs/43-plasma-panel-workarea.md, date: 2026-09-23, note: "全屏、自动隐藏、横屏、重启 plasmashell"}
      - id: E3
        text: 前台应用声明了自己的配色时，状态栏和导航栏用它的背景色，深色背景上图标和文字变浅；没有声明配色的应用不受影响。
        evidence:
          - {doc: docs/59-voice-agent.md, date: 2026-09-25, note: "面板跟随应用配色：语音助手与 plasma-settings 对照"}
      - id: E4
        text: 只有挖孔落在状态栏那一行时才用侧边安全区作为状态栏左右内边距；状态栏安全区只用到手机内屏，不套到外屏上。
    pitfalls:
      - text: PanelView.setThickness 与更新 layer-shell exclusive zone 不是同一个动作；面板变厚后应用仍从旧位置开始，问题在面板预留区而不是每个应用。
        docs: [docs/43-plasma-panel-workarea.md]
      - text: 多个短命 kwriteconfig --notify 进程退出时通知可能还在队列里，运行中的面板读到旧高度；改为一次长驻连接批量通知并 flush。
        docs: [docs/43-plasma-panel-workarea.md]
      - text: Android 报告的是保守的挖孔矩形，不等于光学轮廓。
        docs: [docs/40-plasma-mobile-integration.md]
      - text: KWin 声明式脚本共用一个 QML 引擎，重载 convergentwindows 仍用缓存的旧 main.qml，新脚本要等 KWin 下次启动才生效；不能把 loadDeclarativeScript 成功当作新代码已生效。
        docs: [docs/59-voice-agent.md, docs/47-plasma-input-window-flicker.md]
    code:
      - desktop/display.py
      - desktop/rungic-plasma-display.service
      - packages/plasma-mobile/debian/patches/rungic/panel-exclusive-zone.patch
      - packages/plasma-mobile/debian/patches/rungic/panels-app-colours.patch
      - tools/tests/test_display_panel.py
    docs:
      - docs/43-plasma-panel-workarea.md
      - docs/59-voice-agent.md

  - id: desktop.touch
    title: 用手指直接操作桌面
    scenario: desktop.operate
    status: live
    platform: linux
    interfaces: [host-input]
    summary: 安卓的触摸点按原样送进 KWin，横竖屏坐标都对得上；触屏模式下不画鼠标指针。
    experience:
      - id: E1
        text: 横屏、竖屏和缩放下点哪里就点中哪里，多指触点各自保留 ID 和按下/移动/抬起。
        evidence:
          - {doc: docs/42-plasma-runtime-acceptance.md, date: 2026-09-23, note: "横屏→竖屏、键盘菜单与触摸通过"}
        device: 触点是安卓的 MotionEvent，横竖屏与缩放下的坐标换算在 Rungic 应用的原生宿主（packages/android-host）里做，再经 KWin 的 Android 后端（android-backend.patch）进入 KWin；宿主只能在安卓上运行（它的单元测试也在手机上跑，android/test-native-core.sh），无头 KWin（--virtual）没有 Android 后端，系统测试走不到这条输入通路。
      - id: E2
        text: 宿主暂停渲染时，还没抬起的触点先收到取消，KWin 里不会留下一直按着的手指。
        evidence:
          - {doc: docs/49-plasma-performance.md, date: 2026-09-28, note: "同时修复：宿主暂停渲染时的触摸取消"}
        device: 取消由安卓宿主在暂停渲染（Activity 进入后台、熄屏）时发出（packages/android-host 的 smithay 补丁），要安卓的生命周期才会发生；宿主只能在安卓上运行（它的单元测试也在手机上跑，android/test-native-core.sh），无头 KWin（--virtual）没有 Android 后端，系统测试走不到这条输入通路。
      - id: E3
        text: 触屏模式下屏幕上没有鼠标指针（开机左上角不再有黑框光标），切到鼠标或触控板模式才出现指针。
        evidence:
          - {doc: docs/57-zero-copy-explicit-sync.md, date: 2026-09-24, note: "其他修复：开机左上角黑框光标"}
        device: 有没有指针取决于宿主报告的输入设备（触摸屏，或安卓连着的鼠标、触控板），由 KWin 的 Android 后端（android-backend.patch，只在 --android-host 下工作）处理；宿主只能在安卓上运行（它的单元测试也在手机上跑，android/test-native-core.sh），无头 KWin（--virtual）没有 Android 后端，系统测试走不到这条输入通路。
      - id: E4
        text: 每次按下不会让 KWin 重新应用输出配置（宿主只在状态变化时发 configure），点按不引起卡顿。
        evidence:
          - {doc: docs/57-zero-copy-explicit-sync.md, date: 2026-09-24, note: "第7项：applyConfigure 不再出现"}
        device: configure 由安卓宿主发出（它只在尺寸、方向等状态变化时发），点按会不会让 KWin 重新应用输出配置要在宿主与 KWin 的 Android 后端之间看；宿主只能在安卓上运行（它的单元测试也在手机上跑，android/test-native-core.sh），无头 KWin（--virtual）没有 Android 后端，系统测试走不到这条输入通路。
    pitfalls:
      - text: 蓝牙鼠标模式的指针能力增删尚未实机验证。
        docs: [docs/57-zero-copy-explicit-sync.md]
      - text: adb input 做不出多指手势；需要真实多点触控时用 rungic_touch.py 以 root 写触摸屏 evdev，且先确认没有真实手指按着。
        docs: [docs/66-pointer-gestures.md]
    code:
      - tools/rungic_touch.py
      - tools/test_rungic_touch.py
    docs: [docs/57-zero-copy-explicit-sync.md]

  - id: desktop.edge-back
    title: 边缘滑动返回
    scenario: desktop.operate
    status: live
    platform: android
    interfaces: [host-input, host-controller]
    summary: 安卓的边缘返回手势在桌面里有意义：右边缘先收键盘、再让当前应用返回上一页；左边缘打开 Rungic 菜单。
    experience:
      - id: E1
        text: 从右边缘滑入时，键盘显示则先收起键盘，否则向当前 Linux 窗口发 Alt+Left；应用有上一页时返回（Dolphin 子目录返回上级），不会关闭应用。
        evidence:
          - {doc: docs/46-plasma-recording-and-edge-back.md, date: 2026-09-23, note: "左侧菜单与右侧收键盘已实测；verified-right-back.png"}
      - id: E2
        text: 从左边缘滑入打开 Rungic 容器菜单；手势中途取消不产生任何操作。
        evidence:
          - {doc: docs/46-plasma-recording-and-edge-back.md, date: 2026-09-23}
      - id: E3
        text: Rungic 自己的应用（设计系统 PageStack）对右边缘返回同样返回上一页。
        evidence:
          - {doc: docs/102-design-system-choices-and-swipe-back.md, date: 2026-10-01, note: "用户实测"}
    pitfalls:
      - text: 沉浸状态下第一次边缘手势可能只调出安卓系统栏，下一次才分派给容器。
        docs: [docs/46-plasma-recording-and-edge-back.md]
      - text: native keymap 没有映射 KEYCODE_BACK，不能直接发它冒充返回；不要另造触摸边缘拦截区，会抢 Linux 应用内的侧栏。
        docs: [docs/46-plasma-recording-and-edge-back.md]
      - text: 导航栏右侧按钮是上游设计（键盘可见时收键盘，否则关闭活动应用），按用户要求不改成逐层返回。
        docs: [docs/46-plasma-recording-and-edge-back.md]
    code:
      - android/app/src/com/rungic/plasma/MainActivity.java
      - desktop/desktop-action.py
    docs: [docs/46-plasma-recording-and-edge-back.md]

  - id: desktop.orientation
    title: 横竖屏跟着手机转
    scenario: desktop.operate
    status: live
    platform: android
    interfaces: [platform-bridge, kwin-android-host]
    summary: 旋转由安卓执行，Linux 只跟随；在显示设置里转屏也是请安卓转，画面铺满，不会半屏黑。
    experience:
      - id: E1
        text: 在显示设置（或 kscreen-doctor）把手机屏转成横屏时，安卓真的转成横屏，KWin 输出不旋转、画面铺满；会话重启也不会重放旋转导致错位。
        evidence:
          - {doc: docs/50-plasma-display-settings.md, date: 2026-10-01, note: "kscreen-doctor rotation.right 实机验证"}
      - id: E2
        text: 横屏时画面铺到屏幕边缘，不留挖孔黑边，安卓状态栏和手势条不叠在 Plasma 面板上。
        evidence:
          - {doc: docs/50-plasma-display-settings.md, date: 2026-10-01, note: "APK 2.28 开发版：横屏宽 800，用户确认"}
      - id: E3
        text: 零拷贝打开时旋转也显示完整画面（不再只显示左侧 1080 像素），连续竖横往返每次都完整。
        evidence:
          - {doc: docs/57-zero-copy-explicit-sync.md, date: 2026-09-24, note: "零拷贝横屏被裁半屏：五次截图完整"}
      - id: E4
        text: 旋转后应用窗口、工作区、键盘和触摸都跟着新方向，转回竖屏后布局复原。
        gap: 设置界面直接点旋转、多次往返、键盘与应用窗口、会话重启后都还没验证（docs/50 未验证清单）
    pitfalls:
      - text: KWin 内部旋转会把旋转后的画面画进横向缓冲区，而安卓窗口仍是竖屏（只占上方 45%），变换还被写进 kwinoutputconfig.json 重放；手机屏在 KWin 内不接受任何变换。
        docs: [docs/50-plasma-display-settings.md]
      - text: 零拷贝层是 SurfaceView 子层，按父层最后一帧缓冲的尺寸裁剪；旋转后要先走 GLES 两帧。尺寸必须在绘制前用 eglQuerySurface 读，swap 后读会误判。
        docs: [docs/57-zero-copy-explicit-sync.md]
      - text: 恢复时指定 @120 会把宿主变成固定 120Hz，恢复后要切回“自动”。
        docs: [docs/50-plasma-display-settings.md]
    code:
      - packages/kwin/debian/patches/rungic/phone-turns-with-android.patch
      - packages/plasma-mobile/debian/patches/rungic/homescreen-margins-follow-geometry.patch
      - packages/plasma-mobile/debian/patches/rungic/folio-landscape-keeps-widget-shape.patch
    docs: [docs/50-plasma-display-settings.md]

  - id: desktop.app-windows
    title: 桌面应用的窗口在手机上正常
    scenario: desktop.operate
    status: live
    platform: linux
    interfaces: []
    summary: 为 PC 写的应用在手机竖屏上也不会因为窗口尺寸冲突被断开，缩放下的窗口重绘不越界。
    experience:
      - id: E1
        text: 应用给出的最小尺寸大于最大尺寸（静态 Qt 的微信按手机主屏算最大值）时，KWin 丢弃冲突的最大值并记警告，应用不被断开。
        evidence:
          - {doc: docs/42-plasma-runtime-acceptance.md, date: 2026-09-25, note: "minmax-probe 在 moto16 下保持连接"}
      - id: E2
        text: 缩放与缓冲不一致时为采样加宽的损伤区不超出窗口自身，不会把邻近内容重画坏。
        gap: 要带本项目 KWin 补丁（clip-scaled-damage-to-surface）的测试：两块缩放不同、边挨边的输出，一侧窗口出帧时另一侧不重画；系统测试镜像里只有 Ubuntu 原版 kwin-wayland，KWin 的 L1 测试构建（docs/71）也还没有这一项。2026-09-28 在手机上量过（docs/65：助理屏上 60 fps 动画时手机每秒重画 0 次）。
    pitfalls:
      - text: 放宽“最小大于最大必须报错”不符合 xdg-shell 协议，是本机为兼容这类客户端做的；微信登录后主窗口的真实尺寸还待抓取。
        docs: [docs/42-plasma-runtime-acceptance.md]
      - text: 手机宽度下 PC 应用仍可能需要横屏；该修复面向遵守 Wayland 尺寸的应用，不保证第三方应用的最小尺寸适合手机。
        docs: [docs/40-plasma-mobile-integration.md, docs/43-plasma-panel-workarea.md]
    code:
      - packages/kwin/debian/patches/rungic/xdg-min-above-max.patch
      - packages/kwin/debian/patches/rungic/clip-scaled-damage-to-surface.patch
    docs: [docs/42-plasma-runtime-acceptance.md]

  # ---------------------------------------------------------------- desktop.type
  - id: desktop.rime
    title: Rime 中文输入
    scenario: desktop.type
    status: live
    platform: linux
    interfaces: []
    summary: Plasma 屏幕键盘接 Rime 朙月简体拼音，中文候选在前，可切英文；两个键盘进程共用一份用户词库，只在打字时占用。
    experience:
      - id: E1
        text: 输入 nihao 首候选是“你好”，候选按 Rime 顺序、中文在前，拼音只在预编辑区；300 次快速组合、选词和提交都正确。
        evidence:
          - {doc: docs/41-plasma-rime-input.md, date: 2026-09-23, note: "实际触屏连续输入；整机重启后再验"}
      - id: E2
        text: 连续输入、四次收起再打开、切到 English 输入 hello 再切回中文都正常，键盘进程不崩溃不重启；整机重启后默认就是简体中文。
        evidence:
          - {doc: docs/41-plasma-rime-input.md, date: 2026-09-23, note: "同一 PID 持续存活；rime-after-reboot-nihao.png"}
      - id: E3
        text: 中文键盘的字母页和符号页都用 Rime：数字框先出符号页时 `,` 打出 `，`；上游布局变化时构建报错，不会静默退回 Qt 默认输入法。
      - id: E4
        text: 用户词库只在打字时打开：键盘收起、失焦或显示时 5 秒不按键就关闭会话并释放词库，组合中不关闭；另一个进程正持有词库时本边仍能打中文（不学习），对方释放后转为共享，学到的词两边都排第一，词库不被修复程序改写。
        evidence:
          - {doc: docs/41-plasma-rime-input.md, date: 2026-10-03, note: "实机容器内 rungic-rime-check 全部通过"}
      - id: E5
        text: 建会话加第一个键在实机上远低于 50 ms，不需要预建会话。
        evidence:
          - {doc: docs/41-plasma-rime-input.md, date: 2026-10-03, note: "首次 24.6 ms、重开中位数 13.5 ms"}
        device: 耗时取决于手机的 CPU 和存储（LevelDB 每次打开都写 MANIFEST 并 fsync）；离线在 tmpfs 与 NVMe 上就相差十倍，只有手机上量的数字能说明。
      - id: E6
        text: 密码字段不交给 Rime，敏感字段不学习词频；用户词频和定制在 ~/.local/share/plasma-rime（0700），default.custom.yaml 只首次创建。
    pitfalls:
      - text: librime 打开词库失败会安排 userdb_recovery_task，LevelDB RepairDB 不取 LOCK，会改写另一进程正在用的词库；所以在确认能独占词库之前，任何会话都不能尝试打开它。
        docs: [docs/41-plasma-rime-input.md]
      - text: Ubuntu 的 Qt VKB 没有 Pinyin 插件，旧 symbols.qml 报 PinyinInputMethod is not a type 后改用 Hunspell，标点变半角。
        docs: [docs/41-plasma-rime-input.md]
      - text: 访客会话依赖 librime 方案配置缓存共享的实现细节；升级 librime 后要重新核对 UserDictionary::Load 的恢复逻辑和配置缓存。
        docs: [docs/41-plasma-rime-input.md]
      - text: 部署后旧的 plasma-keyboard 进程会一直持有词库，新进程只能用访客会话；要确认键盘进程是部署后启动的。rime-data 升级后两进程同时启动可能并发写 build/。
        docs: [docs/41-plasma-rime-input.md]
      - text: 旧 Maliit 拼音插件反复处理旧请求、把拼音排在候选前，并会崩溃重启（键盘自己收起又弹出）；已换掉，不要恢复。
        docs: [docs/41-plasma-rime-input.md]
      - text: 验收脚本用 pkill -x 清理探针时进程名只保留 15 个字符，从未匹配，残留窗口让 input.rime 偶发失败；按完整命令行匹配。
        docs: [docs/72-kwin-android-host-isolation.md]
    code:
      - desktop/rime/
      - packaging/rungic-plasma-input/
      - tools/tests/test_plasma_rime.py
      - tools/system/tests/rime_keyboard.py
    docs: [docs/41-plasma-rime-input.md]

  - id: desktop.keyboard
    title: 屏幕键盘弹出收起不打扰
    scenario: desktop.type
    status: live
    platform: linux
    interfaces: []
    summary: 点文本框弹出 Plasma 键盘，窗口为键盘让位但不上下跳；键盘只在手机屏上出现，叠在其他浮层之上。
    experience:
      - id: E1
        text: 反复点同一个正在输入的文本框，窗口不再上下跳动（Marknote 12 次、GTK4 20 次无几何变化）；两个字段交替切换时键盘不收起再弹出。
        evidence:
          - {doc: docs/47-plasma-input-window-flicker.md, date: 2026-09-23, note: "验收记录"}
      - id: E2
        text: 切换语言后旋转屏幕，语言菜单不访问已销毁的按键，没有报错；键盘尺寸变化时菜单关闭。
        evidence:
          - {doc: docs/41-plasma-rime-input.md, date: 2026-09-23, note: "键盘前端的语言菜单与旋转修复"}
      - id: E3
        text: 屏幕键盘只出现在手机内屏，不出现在电视等外屏。
        gap: 要一个带本项目 KWin 补丁（inputmethod-host-text 的内屏规则）和 plasma-keyboard 的无头系统测试：一块内屏、一块外屏，聚焦外屏上的文本框；系统测试镜像里只有 Ubuntu 原版 kwin-wayland。2026-09-24 在电视上实机看过（docs/58 第3步），但那时还没有实机场景记录它。
      - id: E4
        text: 聚焦一个 Qt 文本框时键盘弹出。
    pitfalls:
      - text: 上游 convergentwindows 每次运行都把 frameGeometry 设成 MaximizeArea（不含键盘避让），随后 KWin 输入法再缩小窗口，形成抖动；只在窗口边框确实要取消时保留直接设置。
        docs: [docs/47-plasma-input-window-flicker.md]
      - text: GTK 两字段切换是另一条独立路径（旧上下文失活即隐藏键盘、销毁 surface），单字段测试不能代替它。
        docs: [docs/47-plasma-input-window-flicker.md]
    code:
      - packages/plasma-keyboard/
      - packages/plasma-mobile/debian/patches/rungic/convergent-keyboard.patch
    docs: [docs/47-plasma-input-window-flicker.md]

