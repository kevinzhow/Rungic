area: desktop-mode
title: 桌面模式与外屏
summary: 手机里有一台完整的电脑桌面（0 号独立桌面）：浮窗里看、全屏里用、投到电视上当电脑。几块助理屏可以一起看，也可以从别的设备远程看。
scenarios:
  - id: desktop-mode.use
    title: 把手机当电脑用
    summary: 打开桌面模式，在浮窗里看桌面，进入全屏后用触摸、触控板和键盘操作。桌面里的应用、设置、剪贴板和授权与手机连通。
  - id: desktop-mode.tv
    title: 在电视上用
    summary: 选一台电视投屏，电视显示电脑桌面，手机当触控板和键盘。声音跟着画面走，断了能自己连回来。
  - id: desktop-mode.watch-agents
    title: 看助理们工作
    summary: 几块助理屏同时在干活时，在手机的导播台窗口或电视上一起看，切换焦点、放大其中一块。
  - id: desktop-mode.remote
    title: 从别的设备看手机上的屏幕
    summary: 用电脑上的 RDP 客户端连到手机，看手机桌面、电脑桌面或某块助理屏，手机睡着也能看助理屏。

features:
  # ---- 把手机当电脑用 ------------------------------------------------------------------------------
  - id: desktop-mode.on-off
    title: 打开和关闭桌面模式
    scenario: desktop-mode.use
    status: live
    platform: linux
    interfaces: [platform-bridge]
    summary: 控制中心的“桌面模式”磁贴或 rungic-desktop-mode 启动独立电脑桌面，并显示浮窗。关闭前，系统先请求桌面应用退出。
    experience:
      - id: E1
        text: 打开后 0 号桌面启动、浮窗显示它。手机的 KWin 不再多出一块 CAST 输出（只剩 WL-0），旧的 APK 桌面模式开关被顺手关掉。
        evidence:
          - {doc: docs/research/97-headless-agent-work.md, date: 2026-10-03, note: "§19.4 实机验收：切换"}
      - id: E2
        text: 关闭（磁贴、off、浮窗的关闭按钮）先请应用退出。有应用因未保存内容没关掉时发通知（查看／不保存直接关闭），不强行关闭。
      - id: E3
        text: 手机界面重启（会话重启、宿主重启）后，开着的桌面模式自动回来、浮窗重新出现。0 号不属于图形会话，期间一直在运行。
        evidence:
          - {doc: docs/research/97-headless-agent-work.md, date: 2026-10-03, note: "§19.7、§20.1 会话重启后浮窗自动恢复"}
      - id: E4
        text: 磁贴如实显示状态：关闭、浮窗、全屏、在电视上。操作中显示“正在打开/关闭…”，出错时显示原因。
      - id: E5
        text: 手机睡着、Rungic 应用被冻结时，开关请求最多等 1 秒就回答。手机醒来后第一次操作立即生效，不会一段时间内对开关没反应。
    pitfalls:
      - text: rungic_plasma.py restart-session 会误报 “Desktop did not become ready”：就绪检查用 pidof kwin_wayland 比较新旧进程，而工作区（含 0 号）的 KWin 一直在跑。
        docs: [docs/research/97-headless-agent-work.md]
      - text: 0 号运行时手机可用内存约 2.5 GB。打开桌面模式就多了一整套 KWin、plasmashell 和会话服务。
        docs: [docs/research/97-headless-agent-work.md]
      - text: 磁贴注释、验收检查 desktop_mode_output 和 docs/65 仍按“用户 KWin 的第二输出 CAST-n”描述桌面模式，那是 §19 之前的做法。
        docs: [docs/65-agent-screen.md, docs/research/97-headless-agent-work.md]
    code:
      - agent/screen/rungic-agent-screen
      - agent/screen/quicksetting/
      - agent/screen/po/zh_CN/plasma_com.rungic.quicksetting.desktopmode.po
      - agent/screen/com.rungic.DesktopMode.desktop
      - packaging/rungic-agent-screen/
      - tools/tests/test_platform_bridge_contract.py
      - tools/tests/test_desktop_mode_switch.py
      - tools/tests/test_desktop_mode_tile.py
    docs: [docs/research/97-headless-agent-work.md, docs/65-agent-screen.md, docs/research/91-agent-workspaces.md]

  - id: desktop-mode.independent-desktop
    title: 独立的电脑桌面
    scenario: desktop-mode.use
    status: live
    platform: linux
    interfaces: []
    summary: 桌面模式使用独立 KWin 和 Plasma 桌面外壳，作为工作区 0 无头运行。桌面提供任务栏、开始菜单、托盘和通知。用户设置及数据与手机共用，桌面布局单独保存。
    experience:
      - id: E1
        text: 桌面里有完整的 Plasma 桌面：任务栏、开始菜单、固定的应用、托盘、时钟，壁纸与手机相同。外壳退出后自动重新起来。
        evidence:
          - {doc: docs/research/97-headless-agent-work.md, date: 2026-10-03, note: "§19.2 实机验收"}
      - id: E2
        text: 应用设置与手机共用（一边改了另一边看得到，桌面上新建的设置文件放置 10 秒后归入用户目录，手机那边增删的跟着增删）。KWin、桌面外壳、全局快捷键、活动、klipper 历史等各自私有，两边互不覆盖。
        evidence:
          - {doc: docs/research/97-headless-agent-work.md, date: 2026-10-03, note: "§19.2 kdeglobals 是链接、kwinrc 私有、活动数据库在私有目录"}
      - id: E3
        text: 整台手机只有一个密码库：桌面里的应用查询和解锁密码库用的是手机会话的那个 ksecretd，两边查询结果相同。
        evidence:
          - {doc: docs/research/97-headless-agent-work.md, date: 2026-10-03, note: "§19.2 两条总线上 Collections 相同、只有 1 个 ksecretd"}
      - id: E4
        text: 桌面里的程序按桌面形态运行：KDE 应用不用手机布局，Firefox 用桌面版配置（Linux UA、maxTouchPoints 为 0、没有 about:mobile）。同一个 Firefox 回到手机上仍是移动版。
        evidence:
          - {doc: docs/research/97-headless-agent-work.md, date: 2026-10-03, note: "§19.8 在 3 号工作区后台实测；0 号里待用户实测"}
      - id: E5
        text: 桌面的声音面板列出手机的输出和输入设备（手机上的设备都是虚拟设备，默认不显示）。
      - id: E6
        text: 关闭桌面模式后 0 号的进程全部退出。开着时不因闲置被冻结或关闭。
        evidence:
          - {doc: docs/research/97-headless-agent-work.md, date: 2026-10-03, note: "§19.2 停止单元后相关进程全部退出"}
    pitfalls:
      - text: plasmashell 的程序名、KWin 的 kwinrc 在源码里写死，plasmashellrc、kwinrc 等与手机的移动版外壳同名，0 号必须用私有的 XDG_CONFIG_HOME（链接镜像），否则两边互相覆盖。
        docs: [docs/research/97-headless-agent-work.md]
      - text: 工作区要有自己的 XDG_CACHE_HOME：KDE 应用数据库 ksycoca 记录设置目录，共用时被两边轮流重建，手机主屏反复重载、丢掉 dock 和小部件（2026-09-29）。
      - text: 0 号的 plasmashell 环境曾带 QT_QUICK_CONTROLS_MOBILE=true，KDE 应用按手机布局显示。rungic_cua 的 import_session_environment 会从 systemd 环境把 PLASMA_* 补回来，0 号必须跳过。Firefox 的判断用 RUNGIC_WORKSPACE 而不是 PLASMA_PLATFORM（后者会串进工作区）。
        docs: [docs/research/97-headless-agent-work.md]
      - text: 外壳运行中改它的布局文件，退出时会被覆盖：rungic-desktop-plasma 只在外壳启动前写。手动运行必须带 0 号的 XDG_CONFIG_HOME，否则写进手机自己的布局文件（发生过一次）。
        docs: [docs/research/97-headless-agent-work.md]
      - text: 0 号的密码库解锁提示经 rungic-bus-forward 仍弹在手机上（竖屏、手机外观），在电视或远程观看时看不到。1 号工作区的私有总线上另有一个 ksecretd，只有 0 号做了转发，有损坏密码库文件的风险。
        docs: [docs/research/97-headless-agent-work.md]
      - text: Firefox 不能在两边同时运行（switch.py 先关后开）。在 about:config 改过的设置两边都生效。网站记在 cookie 里的“移动版”可能还会跳。
        docs: [docs/research/97-headless-agent-work.md]
      - text: 独立桌面里 Firefox 闪烁的原因没有证实，§20 的改动之后不再出现。再出现时先查触控板模式下的两路 0 号录屏，再录原始画面和手机屏幕逐帧比较。
        docs: [docs/research/97-headless-agent-work.md]
    code:
      - agent/workspace/rungic-workspace
      - agent/workspace/rungic-workspace@.service
      - agent/workspace/rungic-workspace-env
      - agent/workspace/defaults/kwinrc
      - agent/workspace/rungic-desktop-dirs
      - agent/workspace/rungic-desktop-plasma
      - agent/workspace/rungic-bus-forward
      - agent/workspace/dbus/desktop.conf
      - agent/workspace/dbus/desktop-services/
      - packages/mobile-config-firefox/debian/patches/rungic/desktop-session.patch
      - tools/tests/test_desktop_dirs.py
      - tools/tests/test_desktop_plasma.py
      - tools/tests/test_bus_forward.py
      - tools/tests/test_workspace_env.py
      - tools/system/tests/independent_desktop_session.py
    docs: [docs/research/97-headless-agent-work.md, docs/research/91-agent-workspaces.md]

  - id: desktop-mode.clipboard
    title: 桌面与手机、安卓应用的剪贴板互通
    scenario: desktop-mode.use
    status: live
    platform: linux
    interfaces: [clipboard]
    summary: 在手机上、安卓应用里或桌面里复制的文字，在另外两处都能粘贴（手机会话 ⇄ 安卓剪贴板 ⇄ 独立桌面）。
    experience:
      - id: E1
        text: 手机上复制的文字在桌面里能粘贴，桌面里复制的在手机上能粘贴。安卓应用的复制同样到达桌面。
        evidence:
          - {doc: docs/research/97-headless-agent-work.md, date: 2026-10-03, note: "§19.3 wl-copy/wl-paste 两个方向"}
      - id: E2
        text: 桌面打开时以安卓剪贴板的当前内容为准。同步程序退出后几秒内自动重启。
      - id: E3
        text: 桌面的剪贴板历史（klipper）与手机的分开保存，不共用一份历史文件。
    pitfalls:
      - text: 后台运行的 wl-copy 会继承输出管道，远程命令一直等它结束而超时。测试时要重定向 wl-copy 的输出，并在测试前后保存、恢复用户的剪贴板。
        docs: [docs/research/97-headless-agent-work.md]
      - text: 只同步当前的纯文本：不补回断线期间的每一次复制，不同步图片和文件。锁屏和多用户时不交换。
        docs: [docs/research/clipboard-background.md]
      - text: Klipper 默认 NoEmptyClipboard=true，会把清空的剪贴板恢复成上一条，桥随后同步该值。
        docs: [docs/research/clipboard-background.md]
    code:
      - agent/workspace/rungic-workspace
      - shared/platform/clipboard.py
      - tools/system/tests/desktop_clipboard.py
    docs: [docs/research/97-headless-agent-work.md, docs/research/clipboard-background.md, docs/research/clipboard-history.md]

  - id: desktop-mode.floating-window
    title: 桌面在浮窗里
    scenario: desktop-mode.use
    status: live
    platform: linux
    interfaces: [platform-bridge]
    summary: 桌面和助理屏以手机上的浮窗显示，供观看而不直接操作。用户可以单指拖动、双指缩放，或甩到边缘收成标签。工具栏按需出现。
    experience:
      - id: E1
        text: 单指拖动时浮窗逐帧跟手，松手平滑归位。拖过侧边四分之一或向侧边快甩，收成贴边标签。点标签展开，竖直拖动标签沿边移动。
        evidence:
          - {doc: docs/65-agent-screen.md, date: 2026-10-01, note: "双指放大修复后的实机测试表：甩动、拖过边缘、点标签"}
      - id: E2
        text: 双指捏合在屏宽 50%–100% 之间缩放。捏合永远不会把浮窗收成标签，包括一根手指先抬起、外侧手指先快速外移的情况。捏合后立即单指慢拖仍然跟手。
        evidence:
          - {doc: docs/65-agent-screen.md, date: 2026-10-01, note: "tools/rungic_touch.py 写多点触控事件"}
      - id: E3
        text: 点击、拖动或捏合时工具栏出现在画面下方（靠近底部时改到上方），几秒后淡出。按钮为全屏、投到电视、收到边缘、关闭，并显示这是哪块屏（“桌面”或“助理屏”）。
        evidence:
          - {doc: docs/65-agent-screen.md, date: 2026-09-25, note: "实机验收截图"}
      - id: E4
        text: 浮窗只显示画面，不能直接操作里面的内容。桌面的画面里没有光标。画面边上不露出底下的黑线，黑底只在还没有画面时出现。
        evidence:
          - {doc: docs/research/97-headless-agent-work.md, date: 2026-10-03, note: "§19.4 浮窗显示 0 号桌面、画面里没有光标"}
      - id: E5
        text: 浮窗不白耗电：投到电视、被全屏取代时不再接收画面。呼吸点每秒只画 10 步，不按 120 Hz 重画。
      - id: E6
        text: 手机转屏后浮窗留在屏内、大小合适（横屏转回竖屏不会被撑到横屏宽度的一半）。
      - id: E7
        text: 已关闭的桌面或助理屏遇到残留启动请求时直接退出，不闪出黑色浮窗。
    pitfalls:
      - text: 不能用 margin 移动整个 layer surface：位置总比请求晚一帧，形成反馈，窗口乱窜。现在是一个覆盖整屏的透明表面，画面在里面由 QML 移动，输入区域只含可见部分。
        docs: [docs/65-agent-screen.md]
      - text: 经 Android → 宿主 → KWin 送到 Qt 的触摸与测试工具直接注入的不一样：捏合中一指先抬起的路径离线重现不了，要用 tools/rungic_touch.py 实机测。测试前确认屏幕上没有真实触点，测试会移动用户屏幕上的浮窗。
        docs: [docs/65-agent-screen.md]
      - text: Qt 的 eglSwapBuffers 每帧把整个表面标为受损，浮窗每画一帧（小窗也一样），手机 KWin 都要重新合成整屏。
        docs: [docs/research/97-headless-agent-work.md]
      - text: 真正的毛玻璃要 KWin 的 blur 效果，Plasma Mobile 默认没有加载。全局开启的 GPU 开销没有评估，所以没开。
        docs: [docs/65-agent-screen.md]
      - text: 浮窗程序的语言本来就是英文（标签 “Desktop” 等），授权提示等也是英文。
        docs: [docs/research/97-headless-agent-work.md]
    code:
      - agent/screen/qml/Main.qml
      - agent/screen/agentscreen.cpp
      - agent/screen/agentscreen.h
      - agent/screen/floater.cpp
      - agent/screen/floater.h
      - agent/screen/main.cpp
      - agent/screen/CMakeLists.txt
      - agent/screen/po/zh_CN/rungic-agent-screen.po
      - agent/screen/com.rungic.AgentScreen.desktop
      - agent/workspace/stream.cpp
      - agent/workspace/com.rungic.WorkspaceStream.desktop
      - tools/tests/test_agent_screen_gestures.py
      - tools/tests/test_agent_screen_window.py
      - tools/system/tests/desktop_mode_window.py
    docs: [docs/65-agent-screen.md, docs/research/97-headless-agent-work.md, docs/research/91-agent-workspaces.md]

  - id: desktop-mode.fullscreen
    title: 桌面模式全屏
    scenario: desktop-mode.use
    status: live
    platform: linux
    interfaces: [platform-bridge, host-input]
    summary: 浮窗桌面可以全屏显示，横向铺满手机。系统对话框、键盘和通知仍显示在它上方。这是普通全屏窗口，也适用于 PC Plasma。
    experience:
      - id: E1
        text: 进出全屏是连续的变形动画，中间没有空白帧，退出后浮窗回到原来的位置和大小。
        evidence:
          - {doc: docs/research/97-headless-agent-work.md, date: 2026-10-03, note: "§21.6 手机录屏逐帧检查"}
        device: 空白帧出不出现取决于手机上新窗口第一帧上屏的时机（手机 KWin 约晚 0.6 秒，离线渲染几毫秒就画出），离线测试只能检查变形连续、交接静帧的先后和回到原位，进入时的那一帧要看手机录屏。
      - id: E2
        text: 全屏是一个普通的全屏窗口：会被激活的对话框（授权框）、屏幕键盘、通知和 OSD 都显示在它上面，关闭后它回到最上面。
        evidence:
          - {doc: docs/research/97-headless-agent-work.md, date: 2026-10-03, note: "§21.6 授权框、键盘在全屏之上"}
      - id: E3
        text: Plasma Mobile 的状态栏和导航栏随全屏收起，退出后恢复。
        evidence:
          - {doc: docs/research/97-headless-agent-work.md, date: 2026-10-03}
      - id: E4
        text: 竖着拿手机时，全屏画面在窗口里转成横向（手机向左横放的方向），手机本身、桌面和其他应用不转，没有整机转屏。PC 的横屏显示器上不转。
        evidence:
          - {doc: docs/research/97-headless-agent-work.md, date: 2026-10-02, note: "§17.1 进入全屏后 mCurrentRotation=ROTATION_0"}
          - {doc: docs/research/97-headless-agent-work.md, date: 2026-10-03, note: "§21.6 画面转成横屏、铺满屏幕"}
        device: 手机整机转不转屏由安卓的旋转（mCurrentRotation）决定，Linux 一侧测不到。画面在窗口里转、横屏显示器上不转由单元测试检查。
      - id: E5
        text: 离开全屏：工具栏的退出，或电脑上的 Esc。从任务切换器关闭它只回到浮窗，桌面照开。桌面被投到电视时全屏直接撤掉、不播动画。
        evidence:
          - {doc: docs/research/97-headless-agent-work.md, date: 2026-10-03, note: "§21.6 工具栏退出（手机）、Esc（无头）；任务切换器待测"}
      - id: E6
        text: 全屏铺满时手机 KWin 不再合成它下面的界面，被盖住的程序降到每秒 1 帧。退出全屏时背后的程序立即恢复满帧，没有残影。
        evidence:
          - {doc: docs/research/97-headless-agent-work.md, date: 2026-10-03, note: "§20.1 背后有动画时每秒合成 70 → 0，退出后下一个 2 秒窗口回到满帧"}
      - id: E7
        text: 桌面模式的全屏铺满到边：没有边距、圆角、壁纸和阴影，16:9 以外是黑边，点黑边呼出工具栏。进入全屏后工具栏先显示约 1 秒再滑出，告诉用户它在哪里。
        evidence:
          - {doc: docs/research/97-headless-agent-work.md, date: 2026-10-03, note: "§19.4 工具栏先显示后自动隐藏；点黑边待测"}
    pitfalls:
      - text: 手机上全屏窗口第一帧比无头环境晚约 0.6 秒。交接要等它真正画出第一帧，否则画面会消失。
        docs: [docs/research/97-headless-agent-work.md]
      - text: 浮动键盘没打开时，全屏里的 Esc 是退出全屏，不会送进桌面。
        docs: [docs/research/97-headless-agent-work.md]
      - text: 不要再用 overlay 层的 layer surface 做全屏：它压在 Normal 到 OSD 各层之上，盖住授权框、门户对话框、通知和键盘，逐个窗口打补丁没有尽头（§21）。
        docs: [docs/research/97-headless-agent-work.md]
      - text: 浮窗和全屏必须是两个窗口（没有“同一表面从画中画切到标准全屏”的做法）。新窗口第一次建立纹理、特效和着色器约 110 ms，离开的窗口要留一张静帧，直到另一个窗口画出画面。
        docs: [docs/research/97-headless-agent-work.md]
      - text: 全屏是普通应用窗口：出现在任务切换器里，授权框弹出时面板会重新出现。顶边触摸带下拉、与 §18 边缘手势的分工还没有实机核对。
        docs: [docs/research/97-headless-agent-work.md]
      - text: KWin 补丁 input-panel-above-overlay 只是为原来的 overlay 全屏加的。确认键盘照常显示在标准全屏之上后应当移除。
        docs: [docs/research/97-headless-agent-work.md]
      - text: 遮挡降帧只在一个输出整个被单个不透明、未变换的窗口盖住时生效。被盖住的 Qt 应用每秒“曝光一次”的开销没有测。不透明区域必须在开始退出的同一刻撤销。
        docs: [docs/research/97-headless-agent-work.md]
    code:
      - agent/screen/qml/Main.qml
      - agent/screen/floater.cpp
      - agent/screen/floater.h
      - packages/kwin/debian/patches/rungic/fullscreen-occlusion-throttle.patch
      - packages/kwin/debian/patches/rungic/input-panel-above-overlay.patch
      - tools/system/tests/desktop_mode_fullscreen.py
    docs: [docs/research/97-headless-agent-work.md]

  - id: desktop-mode.fullscreen-touch
    title: 全屏里用手指操作桌面
    scenario: desktop-mode.use
    status: live
    platform: linux
    interfaces: [host-input]
    summary: 全屏桌面提供直接触摸和触控板两种操作方式。直接触摸以手指位置作为指针，触控板通过手指移动系统光标。用户可以切换方式，系统保存选择。手势规则与原 APK 全屏一致。
    experience:
      - id: E1
        text: 直接触摸：点按左键，长按约 400 ms 右键，按住移动从按下处开始拖动，双指点按右键、三指点按中键，双指移动自然滚动、松手后惯性滚动。
        evidence:
          - {doc: docs/research/97-headless-agent-work.md, date: 2026-10-02, note: "§17.1 转后的长按：右键菜单出现在手指所在的文件上"}
          - {doc: docs/research/97-headless-agent-work.md, date: 2026-10-03, note: "§19.4 点开始菜单、打开 Dolphin、长按出右键菜单；多指手势未测"}
      - id: E2
        text: 触控板：单指相对移动系统光标（慢速时物理 1:1、快速时按 libinput 曲线加速），轻点单击、点两下双击、点后按住拖动，双指、三指轻点右键、中键。选的模式会记住。
        evidence:
          - {doc: docs/research/97-headless-agent-work.md, date: 2026-10-03, note: "§19.4 系统光标跟着手指移动"}
      - id: E3
        text: 直接触摸时画面里没有光标。切到触控板时带光标的画面接上，前后不闪黑、不出现空白。
        evidence:
          - {doc: docs/research/97-headless-agent-work.md, date: 2026-10-03, note: "§19.4 触摸屏模式没有光标；指针画面修复一"}
      - id: E4
        text: 从（横屏视角的）底边上滑呼出工具栏，3 秒后隐藏。底边的点按仍是点击。打开着的开始菜单不会因呼出工具栏或点键盘按钮而关闭。
        evidence:
          - {doc: docs/research/97-headless-agent-work.md, date: 2026-10-03, note: "§19.4 修复二之后"}
      - id: E5
        text: 导播台全屏时点其他屏幕把它设为焦点。团队看板在焦点时触摸不转发给任何屏幕，上滑呼出工具栏照常可用。
    pitfalls:
      - text: 替换旧机制前要先逐项列出旧实现的功能：移植 APK 全屏时漏了触控板模式，用户发现工具栏上的切换没了。
        docs: [docs/research/97-headless-agent-work.md]
      - text: 底边起手的触摸要先压住，走出 3.2 mm 再判断（APK 的 stripDecided）。移植时漏了这一步，手指动 1.3 mm 就被当成移动，工具栏永远呼不出来。
        docs: [docs/research/97-headless-agent-work.md]
      - text: 从安卓 24 dp 的边缘区内起手，安卓的系统栏会闪出来，触摸被当成触控板移动。原生安卓本来就是“第一次边缘滑动给应用、第二次给系统”，第一次仍会半透明地显示系统栏约 2.25 秒。
        docs: [docs/research/97-headless-agent-work.md]
      - text: KPipeWire 只在项目可见时接收数据：带指针的那路画面要一直可见（准备好之前透明度为 0），否则两边互相等待，流一直 suspended。
        docs: [docs/research/97-headless-agent-work.md]
      - text: 点击要在按下 40 ms 后再抬起：面板的应用启动器认不出同一瞬间的按下和抬起。
        docs: [docs/66-pointer-gestures.md, docs/research/97-headless-agent-work.md]
      - text: adb 只能模拟单指。双指滚动、多指点按要用 tools/rungic_touch.py 写多点触控事件实机测。
        docs: [docs/65-agent-screen.md, docs/research/97-headless-agent-work.md]
    code:
      - agent/screen/qml/FullTouch.qml
      - tools/tests/test_full_touch.py
    docs: [docs/research/97-headless-agent-work.md, docs/66-pointer-gestures.md]

  - id: desktop-mode.floating-keyboard
    title: 全屏的浮动键盘
    scenario: desktop-mode.use
    status: live
    platform: linux
    interfaces: []
    summary: 全屏窗口提供可拖动、缩放和停靠的浮动键盘，类似平板输入法。键盘方向跟随画面。中文使用与手机键盘相同的 Rime，文字进入桌面中获得焦点的输入框。
    experience:
      - id: E1
        text: 键盘方向跟着全屏画面转，横握手机时是正的。拖顶栏移动、松手吸附到底部中间或两角，双指缩放，放大到上限停靠成整宽、缩小又浮起来。大小、位置、停靠为桌面模式和助理屏分别记住。
        evidence:
          - {doc: docs/research/97-headless-agent-work.md, date: 2026-10-03, note: "§19.9 用户实测方向正确；拖动、吸附、缩放待验收"}
      - id: E2
        text: 中文用与手机键盘相同的 Rime 和用户词库：拼音显示在左上角，候选字够大、可横向滑动，第一个（空格选它）用蓝色，能展开全部候选。选中的词上屏到桌面里获得焦点的输入框（密码框也行）。
        evidence:
          - {doc: docs/research/97-headless-agent-work.md, date: 2026-10-03, note: "§19.10 手机真实窗口输入 nihao"}
          - {doc: docs/research/97-headless-agent-work.md, date: 2026-10-03, note: "§21.7 经键盘向 0 号的密码框输入 abc"}
      - id: E3
        text: 顶栏有 Esc、Tab、Ctrl、Alt（点一下作用于下一个键后松开）和四个方向键。按住 Ctrl 或 Alt 时字母和数字按键码发送，Ctrl+C、Alt+F4 等组合键送进桌面。
      - id: E4
        text: 键盘打开时全屏工具栏出现在键盘上方，不挡最下面一排键。在键盘上的触摸不会漏到下面的画面。
        evidence:
          - {doc: docs/research/97-headless-agent-work.md, date: 2026-10-03, note: "§19.10 工具栏在键盘上方"}
      - id: E5
        text: 浮动键盘打开时手机键盘不同时弹出。收起键盘或退出全屏后键盘消失。
      - id: E6
        text: 键盘加载后位于横屏舞台的底部中间，高度合适，不超出屏幕，离底边留出呼出工具栏的那条边。
        evidence:
          - {doc: docs/research/97-headless-agent-work.md, date: 2026-10-03, note: "§19.9 手机上离屏测试的尺寸与位置"}
    pitfalls:
      - text: 系统键盘 plasma-keyboard 只有铺满屏宽一种尺寸，KWin 只把它放在屏幕底部或光标下，不能旋转和浮动。而画面在窗口里旋转是我们全屏自己的设计，所以键盘做在窗口里，不改共享层。
        docs: [docs/research/97-headless-agent-work.md]
      - text: Qt 虚拟键盘的内置样式按 2560×800 的大屏设计，字号随键盘宽度缩放，手机上按键字只有约 2 mm。自己的样式里所有尺寸取自按键高度。样式的 id 不能叫 style（被键盘组件的同名属性遮住），内联组件看不到外层 id。
        docs: [docs/research/97-headless-agent-work.md]
      - text: 离屏截图不可靠：打字之后截出的顶栏是空的（手机软件渲染、Docker llvmpipe 都一样），看设计要看手机上的真实窗口。
        docs: [docs/research/97-headless-agent-work.md]
      - text: librime 的用户词库是独占锁的 LevelDB：Rime 插件只在键盘使用时持有会话，同一时间只能有一个键盘在用。
        docs: [docs/research/97-headless-agent-work.md]
      - text: 隐藏输入框必须设 ImhNoAutoUppercase | ImhNoPredictiveText：它总是空的，否则每个字母都被当成句首大写。
        docs: [docs/research/97-headless-agent-work.md]
      - text: 窗口进程设了 QT_IM_MODULE=qtvirtualkeyboard，不再有 Wayland text-input。电视键盘模式下手机 KWin 提交给它的文字由 KWin 改成按键送来。
        docs: [docs/research/97-headless-agent-work.md]
      - text: 在桌面里点中输入框时自动弹出键盘还没有做（要一个报告“输入框被点中”的 KWin 补丁）。
        docs: [docs/research/97-headless-agent-work.md]
    code:
      - agent/screen/qml/FloatingKeyboard.qml
      - agent/screen/vkb/
      - agent/screen/tests/tst_floating_keyboard.qml
      - packages/kwin/debian/patches/rungic/virtualkeyboard-commit-text.patch
    docs: [docs/research/97-headless-agent-work.md]

  - id: desktop-mode.auth-prompts
    title: 授权框出现在桌面里
    scenario: desktop-mode.use
    status: live
    platform: linux
    summary: 桌面应用需要授权时，授权框显示在桌面内，使用横屏和桌面外观。仅以浮窗观看时，浮窗显示提示。用户点击提示后进入全屏输入。
    interfaces: []
    experience:
      - id: E1
        text: 只把请求方会话总线上的请求转给那里的代理界面。手机自己的、助理屏的、地址不可接受的请求留在手机上弹。
      - id: E2
        text: 授权框出现在 0 号桌面里，桌面外观、横向。手机上不再弹竖屏框。
        evidence:
          - {doc: docs/research/97-headless-agent-work.md, date: 2026-10-03, note: "§21.7"}
      - id: E3
        text: 桌面只在浮窗里时，浮窗显示“需要授权”提示，点它进入全屏。答完提示消失。
        evidence:
          - {doc: docs/research/97-headless-agent-work.md, date: 2026-10-03, note: "§21.7"}
      - id: E4
        text: 取消（按钮、Esc、polkit 取消）后请求结束且不授予权限，代理界面不崩溃。
        evidence:
          - {doc: docs/research/97-headless-agent-work.md, date: 2026-10-03, note: "§21.7 修复后复测"}
      - id: E5
        text: 电视的电脑模式或远程观看 ws-0 时，授权框同样出现在 0 号桌面里，在哪看就在哪输入。
        gap: 还没有实测（docs/97 §21.7“未测和遗留”第一项）。系统测试要先在容器里运行由补丁队列构建的 polkit-kde-agent-1，再有一个 RDP 观看端或电视。
    pitfalls:
      - text: 原版 PolicyKitListener 取消一次会多次完成结果对象，结果对象不能在第一次完成时释放。
        docs: [docs/research/97-headless-agent-work.md]
      - text: polkit 每个会话只有一个代理。user@ 下的进程都回落到显示会话，按会话分不开桌面实例。
        docs: [docs/research/97-headless-agent-work.md]
      - text: 发起测试要经 systemd-run --user --scope 放进 user@1000.service，像 0 号里真实启动的应用一样。直接从 adb 启动的进程不属于任何会话，polkit 回答 “no agent is available”。
        docs: [docs/research/97-headless-agent-work.md]
      - text: 对话框在 0 号里被放在左上角（0 号 KWin 默认的摆放）。KAuth 应用把对话框挂到自己窗口上、输入正确密码后授权成功都还没测。
        docs: [docs/research/97-headless-agent-work.md]
      - text: rungic_dev.py 原先只用基线发布的 user_restart，工作区新登记的重启项被忽略，部署后手机端代理没有重启。重启时 systemd 提示需要 daemon-reload，重启脚本不执行。
        docs: [docs/research/97-headless-agent-work.md]
    code:
      - packages/polkit-kde-agent-1/
      - agent/workspace/dbus/desktop-services/org.kde.polkit-kde-authentication-agent-1.service
      - agent/workspace/stream.cpp
    docs: [docs/research/97-headless-agent-work.md]

  # ---- 在电视上用 ----------------------------------------------------------------------------------
  - id: desktop-mode.cast-connect
    title: 投屏到电视
    scenario: desktop-mode.tv
    status: live
    platform: android
    interfaces: [wifi-display, platform-bridge]
    summary: 用户在控制中心的“投屏”中选择电视，连接、断开或更换接收端。电视端断开时自动重连，用户主动断开时不重连。投屏使用 Android 无线显示框架和高通 WFD 组件，不依赖 Ready For 开关。
    experience:
      - id: E1
        text: 点“投屏”打开“投屏到”面板：同一台电视的多个入口（R1、R2）合并为一项，分“上次使用”和“附近的设备”，忙碌中的不可点。找不到时提示电视须停在等待画面、屏保时搜不到，并列出检查项。
        evidence:
          - {doc: docs/58-miracast-desktop-feasibility.md, date: 2026-09-29, note: "选设备与投屏控制：实测"}
          - {doc: docs/86-x70-miracast-assessment.md, date: 2026-09-30, note: "X70 面板列出 TCL 和 UGREEN"}
      - id: E2
        text: 选中电视后几秒内连上（G100 S 约 3 秒、X70 约 6 秒），面板自动关闭，电视显示 Linux 桌面。连接中可以取消。
        evidence:
          - {doc: docs/58-miracast-desktop-feasibility.md, date: 2026-09-29}
          - {doc: docs/86-x70-miracast-assessment.md, date: 2026-09-28, note: "三轮断开/重连 6.15/6.02/6.33 秒"}
      - id: E3
        text: 用户断开（快捷开关、投屏胶囊、语音、命令）后保持断开，不自动重连。电视端结束会话时几秒后开始自动重连（最长 180 秒），重连成功后 2 分钟内电视又退出就不再重连。
        evidence:
          - {doc: docs/58-miracast-desktop-feasibility.md, date: 2026-09-24, note: "第 5 步实测表：模拟电视端断开 11 秒后重连"}
      - id: E4
        text: 投屏中可以换另一台电视：列表里有当前的、上次使用的、最近发现的和安卓已保存的电视，点一台即切换，失败时有提示。
        gap: 投屏中实际换到第二台电视、换台失败的提示、“已保存”的电视出现在列表里都还没有实机验收（docs/58：2026-09-29 列为未验证，2026-10-01 修复后待验收）。APK 的换设备面板没有离线测试。
      - id: E5
        text: 后端出错时说清原因（组件版本不兼容、无线显示关闭、Wi-Fi 不可用、超时等），不显示成“没有电视”的空列表。
        evidence:
          - {doc: docs/86-x70-miracast-assessment.md, date: 2026-09-30, note: "旧 jar 返回 backend-incompatible"}
      - id: E6
        text: 电视的 R2 入口不会因厂商 WFD 配置超出本机编码器而一连上就断：配置按本机编码器能力生成，只降不升。
        evidence:
          - {doc: docs/58-miracast-desktop-feasibility.md, date: 2026-09-28, note: "自动生成配置下进入 PLAYING"}
      - id: E7
        text: 对语音助手说“投到电视上”“把投屏断开”，它会连接或断开并口头确认。
        evidence:
          - {doc: docs/58-miracast-desktop-feasibility.md, date: 2026-09-24, note: "断开约 6 秒、连接约 26 秒后口头确认"}
    pitfalls:
      - text: 电视进入屏保后停止 P2P 监听，扫描不到。TCL 只在等待画面出现后的短时间内监听。查发现问题前先问用户电视是不是在屏保。
        docs: [docs/58-miracast-desktop-feasibility.md, docs/84-miracast-source.md]
      - text: 用户在电视遥控器上退出投屏与电视端故障无法区分，会被自动重连一次。P2P 链路直接丢失时日志顺序可能与手机端断开相同，不会重连（未验证）。重连判断依赖 logcat 字符串顺序。
        docs: [docs/58-miracast-desktop-feasibility.md, docs/86-x70-miracast-assessment.md]
      - text: 会话在 PLAYING 约 45–48 秒后因 P2P 链路丢失断开过多次（电视为组主、5 GHz、rssi -87），原因未排除。
        docs: [docs/58-miracast-desktop-feasibility.md]
      - text: 投屏期间安卓不扫描，“最近发现”会过期。不扫描时 status 里的 available 可能是上次扫描的结果，选设备只采信 scan 的可见状态。
        docs: [docs/58-miracast-desktop-feasibility.md]
      - text: 手机上的 root 组件（rungic-cast.jar）要和容器里的 rungic-cast 版本一致：旧 jar 没有 protocol_version、没有 receivers，面板就列不出电视。
        docs: [docs/58-miracast-desktop-feasibility.md, docs/86-x70-miracast-assessment.md]
      - text: 编码器失败后 rungic-cast-watch 会按“电视端断开”反复重连且错误为空，快捷开关只显示“没有连上电视”。
        docs: [docs/58-miracast-desktop-feasibility.md]
      - text: wfd.sepolicy.rule 只针对 XT2537-4（G100 S）的高通域，其他机型要按实际 AVC 核对，不能机械套用。未知平台走不改厂商的框架路径。
        docs: [docs/58-miracast-desktop-feasibility.md, docs/86-x70-miracast-assessment.md]
      - text: X70 上直接关掉无线显示开关后，紧接着的重连多次超时，失败在 P2P/IP 建立之后、WFD 会话完成之前，未定因。刷新率变更的完整重新协商也没单独验证。
        docs: [docs/86-x70-miracast-assessment.md]
      - text: 连接时 Moto“超级互联显示”仍会在手机上弹“已连接至…”横幅。Ready For 参与连接，不能整体停用。
        docs: [docs/58-miracast-desktop-feasibility.md]
    code:
      - desktop/cast/
      - packaging/rungic-cast/
      - shared/android/rungic-cast/rungic-cast
      - shared/android/rungic-cast/rungic-cast-watch
      - shared/android/rungic-cast/build.sh
      - shared/android/rungic-cast/src/com/rungic/cast/Main.java
