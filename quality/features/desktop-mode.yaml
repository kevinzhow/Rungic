  - id: desktop-mode.tv-shows-linux
    title: 电视上只显示 Rungic 的桌面
    scenario: desktop-mode.tv
    status: live
    platform: android
    interfaces: [wifi-display]
    summary: 投屏后，电视显示 Linux 桌面。厂商的欢迎页、任务栏和副屏主屏不会覆盖它。断开后，厂商组件恢复原状。规则根据实际窗口判断，不使用机型名单。
    experience:
      - id: E1
        text: 只有实际盖在 Linux 桌面上的厂商界面（同一块外屏、真的可见、包和 UID 相符、层级更高）才被处理，只暂停实际出现的冲突包。不因装了某个包就停用它，不接管没有 Rungic 桌面的普通安卓投屏。
        evidence:
          - {doc: docs/research/g100-ugreen-miracast.md, date: 2026-09-29, note: "第二阶段最终验收：watcher 自动识别欢迎页和任务栏"}
      - id: E2
        text: 断开（包括异常断开、关掉无线显示、重启）后，被暂停的包恢复到投屏前的原状态，租约释放。
        evidence:
          - {doc: docs/research/g100-ugreen-miracast.md, date: 2026-09-29, note: "正常断开后两包恢复 enabled=1"}
          - {doc: docs/86-x70-miracast-assessment.md, date: 2026-09-28, note: "直接关闭无线显示开关后 watcher 恢复两包"}
      - id: E3
        text: 电视上不闪出手机的副屏主屏，输入焦点留在手机上。
        evidence:
          - {doc: docs/58-miracast-desktop-feasibility.md, date: 2026-09-24, note: "第 5 步：重连期间没有 SecondaryDisplayLauncher，mTopFocusedDisplayId=0"}
      - id: E4
        text: 缺少悬浮窗权限时，应用自己以 root 授予，仍不行再打开系统授权页并等用户允许，电视照样出现 Linux 桌面。
        evidence:
          - {doc: docs/58-miracast-desktop-feasibility.md, date: 2026-09-28, note: "APK 2.10 权限置回 default 后连接，同一秒授予并上桌面"}
    pitfalls:
      - text: 首次识别要等厂商窗口出现，开始投屏时可能短暂露出 Moto 界面，没有证明零闪屏。
        docs: [docs/research/g100-ugreen-miracast.md]
      - text: 窗口观测（dumpsys window）不是公开接口：字段缺失或未知时不匹配、不停包。新厂商的界面要按实际窗口加规则，不能说所有品牌已自动适配。
        docs: [docs/research/g100-ugreen-miracast.md]
      - text: 不能把 ApplicationInfo.FLAG_SYSTEM 当作“系统预装”：com.motorola.mobiledesktop 在 /product/preinstall 下却没有 SYSTEM 标记，第一版因此漏判了欢迎页。
        docs: [docs/research/g100-ugreen-miracast.md]
      - text: 暂停的是整个厂商 UI 包，投屏期间该包的其他界面也不可用。
        docs: [docs/86-x70-miracast-assessment.md]
      - text: 手机锁屏时安卓在电视上显示锁屏（KeyguardPresentation），盖住 Linux。这与厂商界面是两件事，不能靠停用 SystemUI 解决。手机进入 Dozing 后电视上是锁屏时钟。
        docs: [docs/86-x70-miracast-assessment.md]
      - text: 普通应用的 TYPE_APPLICATION_OVERLAY 盖不过厂商的系统窗口。setShouldShowSystemDecors(false) 会被显示自身的 FLAG_SHOULD_SHOW_SYSTEM_DECORATIONS 覆盖，无效。
        docs: [docs/58-miracast-desktop-feasibility.md, docs/86-x70-miracast-assessment.md]
    code:
      - shared/android/rungic-cast/src/com/rungic/cast/CastAdapter.java
      - shared/android/rungic-cast/src/com/rungic/cast/CastWindows.java
      - profiles/cast-adapters.json
      - android/app/src/com/rungic/plasma/CastDesktop.java
      - tools/tests/CastWindowsTest.java
    docs: [docs/research/g100-ugreen-miracast.md, docs/86-x70-miracast-assessment.md, docs/58-miracast-desktop-feasibility.md]

  - id: desktop-mode.cast-video-modes
    title: 投屏的分辨率与帧率
    scenario: desktop-mode.tv
    status: live
    platform: android
    interfaces: [wifi-display]
    summary: 投屏胶囊的“分辨率与帧率…”只列出当前电视与手机能实际使用的视频模式。选择后，系统核对模式是否生效，失败时恢复原模式。
    experience:
      - id: E1
        text: 列表只有“自动”、当前协商的模式和在这台电视上实际切换并核对成功的模式（协商读回一致、外屏尺寸一致、连接保持 5 秒）。没有未验证或“试用”的选项。
        evidence:
          - {doc: docs/research/miracast-video-modes.md, date: 2026-09-29, note: "最终实机复核：胶囊弹窗只有 8 项"}
      - id: E2
        text: 切换失败时恢复原来的模式并从列表里去掉。检查结果按接收端、它声明的能力、手机固件和组件版本分开记，每项 7 天过期，记录损坏或身份不符时不信任。
        evidence:
          - {doc: docs/research/miracast-video-modes.md, date: 2026-09-29, note: "1920×1200p30 回落后返回失败、恢复 1080p60、不进菜单"}
      - id: E3
        text: 同尺寸改帧率在线完成（约 3.5 秒），改尺寸则重新连接，手机上的外屏和 Linux 桌面的大小同步改变。
        evidence:
          - {doc: docs/research/miracast-video-modes.md, date: 2026-09-29, note: "720p/1080p 在线与重连矩阵"}
      - id: E4
        text: 接收端的能力按它本次 RTSP 回复实际解析（R1、R2 位表，64 位位图，隔行与逐行区分）。抓包缺段、有歧义或没有握手记录时记为未知，不推测、不用内置表冒充。
      - id: E5
        text: 模式在胶囊里的底部面板里选，点“应用”才生效。取消、返回键、点遮罩、下拉都回到胶囊。
        evidence:
          - {doc: docs/research/miracast-video-modes.md, date: 2026-09-29, note: "BottomSheet 交互验收"}
    pitfalls:
      - text: 安卓和 KScreen 显示的 60 Hz 是显示刷新率，不是视频 60 fps。UGREEN 默认协商的是 1080p30。
        docs: [docs/research/miracast-video-modes.md, docs/research/g100-ugreen-miracast.md]
      - text: XML 和属性只控制 offer 的上限，不能做精确选择。setResolution 返回 0 却不改变协商，getCommonResolution 在 R2 会话返回空，返回码不能当作成功。
        docs: [docs/research/miracast-video-modes.md]
      - text: 高通 Java wrapper 的 VESA 校验表不接受 R2 的位 30–32，1440p 以上暂时开不了。不猜 handle、不另建会话、不改闭源库。
        docs: [docs/research/miracast-video-modes.md]
      - text: 能力读取靠系统自带的 tcpdump 只看 RTSP 7236 端口。从安卓设置直接连上的会话没有握手记录，能力为 unknown，要重新连接一次。
        docs: [docs/research/miracast-video-modes.md]
    code:
      - shared/android/rungic-cast/src/com/rungic/cast/CastResolution.java
      - shared/android/rungic-cast/src/com/rungic/cast/ModeHistory.java
      - shared/android/rungic-cast/src/com/rungic/cast/WfdCapture.java
      - shared/android/rungic-cast/src/com/rungic/cast/WfdFormats.java
      - shared/android/rungic-cast/src/com/rungic/cast/WfdPackets.java
      - shared/android/rungic-cast/src/com/rungic/cast/WfdSession.java
      - android/app/src/com/rungic/plasma/CastControls.java
      - tools/tests/ModeHistoryDeviceTest.java
      - tools/tests/WfdFormatsTest.java
    docs: [docs/research/miracast-video-modes.md, docs/58-miracast-desktop-feasibility.md]

  - id: desktop-mode.tv-computer-mode
    title: 电视上的电脑模式
    scenario: desktop-mode.tv
    status: live
    platform: linux
    interfaces: [kwin-android-host, host-input, platform-bridge]
    summary: 电视的“电脑模式”显示独立桌面，即工作区 0。手机作为该桌面的触控板和键盘。桌面显示在电视上时，手机浮窗收起。
    experience:
      - id: E1
        text: 电视投电脑模式时显示 0 号桌面，盖住手机会话放在那块输出上的外壳。连上后马上出画面，不等桌面里的画面下一次变化。
      - id: E2
        text: 电视上只有一个光标，跟着手机触控板移动，位置与 0 号里的指针一一对应。按键和滚轮按比例转进 0 号（一格滚轮 = 15 个轴单位）。
      - id: E3
        text: 投屏控制的键盘模式打的文字（含中文、表情）进入 0 号里获得焦点的输入框。
      - id: E4
        text: 桌面模式在电视上时手机上的浮窗收起，0 号的画面流继续。断开电视后浮窗回来。
      - id: E5
        text: 每个窗口的投屏按钮投它自己的画面：桌面模式的浮窗投电脑模式，助理屏投导播台（并把那块屏设为焦点）。没有电视时先打开选电视列表，已连电视时打开投屏控制面板。快捷开关只打开面板。
    pitfalls:
      - text: KWin 的屏幕录制流不给新加入的接收方补发当前帧：电视窗口接已有的那条流时要等到下一次画面变化（约 30 秒黑屏）。电视要单独开一条新流（tv-stream）。
        docs: [docs/research/97-headless-agent-work.md]
      - text: 投屏按钮原来只发 source:0，安卓把 0 当作“不改内容”，新连上的电视又被无条件设成导播台，于是桌面模式投出的是导播台。窗口按钮必须带上 content。
        docs: [docs/58-miracast-desktop-feasibility.md]
      - text: 电视上的桌面由 CAST 输出上一块 overlay 层的图层窗口显示（placeOnCast），和原来的 overlay 全屏是同一类，会压住同层后来出现的窗口。下面的 Plasma Mobile 外接屏外壳和 docked 模式照常运行。
        docs: [docs/research/97-headless-agent-work.md]
      - text: 电视的电脑模式在 2026-10-03 改投 0 号后，黑屏和没声音的修复还在等用户在电视上复测。
        docs: [docs/research/97-headless-agent-work.md]
    code:
      - agent/screen/qml/Main.qml
      - agent/screen/floater.cpp
      - agent/screen/agentscreen.cpp
      - agent/workspace/stream.cpp
      - android/app/src/com/rungic/plasma/CastDesktop.java
      - android/host/src/android/backend/wayland/cast.rs
    docs: [docs/research/97-headless-agent-work.md, docs/58-miracast-desktop-feasibility.md]

  - id: desktop-mode.tv-touchpad
    title: 手机当电视的触控板和键盘
    scenario: desktop-mode.tv
    status: live
    platform: android
    interfaces: [host-input, platform-bridge]
    summary: 投屏时，手机显示投屏胶囊。用户可以切换“手机／触控板／键盘”。触控板移动电视光标，键盘向电视窗口输入文字。
    experience:
      - id: E1
        text: 投屏时出现投屏胶囊，显示电视名和状态。空闲 4 秒后收成贴边小胶囊，可拖到任意位置、松手吸附到较近一边，位置在应用重启后保留。贴边时不会触发安卓的返回手势。
        evidence:
          - {doc: docs/58-miracast-desktop-feasibility.md, date: 2026-09-29, note: "胶囊与面板实测"}
      - id: E2
        text: 触控板：手指移动电视上的光标，慢速时按视角 1:1（约 10.5 像素/毫米）、快速时加速。轻点单击、轻点后按住拖动、双指滚动（内容跟着手指，松手有停止事件）、双指轻点右键、三指轻点中键。
        evidence:
          - {doc: docs/58-miracast-desktop-feasibility.md, date: 2026-09-24, note: "第 3 步：触控板按出 Kalk 的 7、8"}
          - {doc: docs/66-pointer-gestures.md, date: 2026-09-25, note: "电视上双指滚动的 axis_source/axis_stop、双指轻点打开右键菜单"}
      - id: E3
        text: 键盘：按键和输入法提交的文字（含中文、表情）送到电视上获得焦点的 Linux 窗口，电视上不弹 Plasma 屏幕键盘。输入法被返回键收起后自动回到触控板。
        evidence:
          - {doc: docs/58-miracast-desktop-feasibility.md, date: 2026-09-24, note: "abc1+2、你好，世界 进入电视上的 KRunner"}
      - id: E4
        text: 手机模式下手机照常操作 Plasma 移动界面。投屏中手机屏幕保持常亮，触控板和键盘模式下亮度降到很低，回到手机模式后恢复。
        evidence:
          - {doc: docs/58-miracast-desktop-feasibility.md, date: 2026-09-24}
    pitfalls:
      - text: 电视上光标抖动、不跟手的原因没有定位（嫌疑：KWin CAST 时钟与无线显示编码时钟不同步、120 Hz 输入对 60 Hz 出帧、编码和 Wi-Fi 延迟）。
        docs: [docs/66-pointer-gestures.md]
      - text: 轻点和移动的阈值要按每根手指相对自己的按下点判断。用多指中点对比第一指按下点时，第二根手指一落下就超阈值，双指轻点失效。
        docs: [docs/66-pointer-gestures.md]
      - text: 10.5 像素/毫米是按电视占 35° 视野推算的，拿不到电视的实际尺寸和观看距离。
        docs: [docs/66-pointer-gestures.md]
      - text: 应用在后台时手机上没有触控板和键盘，电视只能看不能操作（除非另接蓝牙键鼠，未测）。
        docs: [docs/58-miracast-desktop-feasibility.md]
      - text: 胶囊画在 Linux 画面之上，Plasma 面板打开时小胶囊仍压在面板边缘。收起后原来展开区域的点击落到桌面。
        docs: [docs/58-miracast-desktop-feasibility.md]
      - text: 注入测试时一次轻点总时长超过 180 ms 就不算轻点。
        docs: [docs/66-pointer-gestures.md]
    code:
      - android/app/src/com/rungic/plasma/CastControls.java
      - android/app/src/com/rungic/plasma/PointerOutput.java
      - android/app/src/com/rungic/plasma/PointerTransfer.java
      - android/app/src/com/rungic/plasma/TouchpadGestures.java
      - android/app/src/com/rungic/plasma/GestureRules.java
    docs: [docs/66-pointer-gestures.md, docs/58-miracast-desktop-feasibility.md]

  - id: desktop-mode.audio-follow
    title: 声音跟着画面
    scenario: desktop-mode.tv
    status: live
    platform: linux
    interfaces: [audio, platform-bridge]
    summary: 投屏时，声音跟随应用画面。手机应用从手机播放声音，电视应用从电视播放声音。电视断开后，所有声音恢复默认输出。
    experience:
      - id: E1
        text: 窗口在手机上的应用从手机出声，窗口在电视上的从电视出声。没有窗口的声音在电视投电脑模式时去电视，否则留在手机。
        evidence:
          - {doc: docs/58-miracast-desktop-feasibility.md, date: 2026-10-02, note: "无窗口的 paplay、桌面上的 Godot 游戏挪到手机"}
      - id: E2
        text: 助理屏的声音在电视显示它时去电视，否则去手机。独立桌面（0 号）在电视投电脑模式时去电视，否则在手机。
      - id: E3
        text: 应用自己选定的去处不动：语音助手的手机输出、通话用的扬声器、工作区自己的声道。
      - id: E4
        text: 断开电视后，挪过的声音都回到默认输出。
      - id: E5
        text: 留在手机本机的声音不卡顿，延迟有上限（约 185 ms）。
        evidence:
          - {doc: docs/58-miracast-desktop-feasibility.md, date: 2026-10-02, note: "用户确认声音从手机出来、不卡"}
        device: 手机本机的声音卡不卡、延迟多少取决于安卓 AudioTrack 的输出线程和扬声器路径，只能在手机上听和测。Linux 一侧按画面分配去处由 E1–E4 的单元测试检查。
    pitfalls:
      - text: 安卓会把所有普通媒体声音都送到无线显示，所以要在 Linux 一侧按画面所在分配，否则手机上玩的游戏声音从电视出来。
        docs: [docs/58-miracast-desktop-feasibility.md]
      - text: AudioTrack 用 PERFORMANCE_MODE_LOW_LATENCY 时不再理会 setPreferredDevice，投屏时被送到 PROXY，声音跑到电视上。已撤回。以后试 USAGE_GAME 前也要先核对这一点。
        docs: [docs/58-miracast-desktop-feasibility.md]
      - text: 浏览器的声音来自子进程，找窗口时要沿父进程往上查。
        docs: [docs/58-miracast-desktop-feasibility.md]
      - text: 手机本机这一路比默认路径多约 0.15–0.2 s。剩下的延迟主要在安卓扬声器输出线程，暂不处理。
        docs: [docs/58-miracast-desktop-feasibility.md]
      - text: 0 号的回环要一直开着（rungic-workspace-sound 0 listen），并每 30 秒检查补建。0 号在这一行加入之前启动时没有回环，电视上没声音。
        docs: [docs/research/97-headless-agent-work.md]
    code:
      - shared/media/audio-follow.py
      - desktop/rungic-plasma-audio-follow.service
      - agent/workspace/rungic-workspace-sound
      - tools/tests/test_audio_follow.py
    docs: [docs/58-miracast-desktop-feasibility.md, docs/research/97-headless-agent-work.md]

  - id: desktop-mode.external-screen
    title: 外接屏上的桌面外观
    scenario: desktop-mode.tv
    status: live
    platform: linux
    interfaces: [kwin-android-host]
    summary: 手机会话支持电视 CAST 输出或 PC 显示器作为外接屏。外接屏使用文件夹桌面、任务栏和开始菜单等 Plasma 桌面外观。外屏窗口显示标题栏，手机窗口保持移动样式。
    experience:
      - id: E1
        text: 接上外接屏后进入 docked 模式，拔掉后退出。会话在外接屏连着时重启，拔掉后也能退出 docked。
        evidence:
          - {doc: docs/58-miracast-desktop-feasibility.md, date: 2026-09-24, note: "第 2、4 步实测"}
      - id: E2
        text: 外接屏有任务栏和开始菜单，开始菜单贴任务栏弹出且大小完整，打开的应用出现在外接屏并在其任务栏高亮。手机仍是移动界面。
        evidence:
          - {doc: docs/58-miracast-desktop-feasibility.md, date: 2026-09-24}
      - id: E3
        text: 窗口规则按所在的屏区分：手机上的窗口无边框、最大化，外接屏上的带边框。窗口换屏时重新套用，状态栏和导航条保持沉浸样式。
        evidence:
          - {doc: docs/58-miracast-desktop-feasibility.md, date: 2026-09-24}
      - id: E4
        text: 应用已在外接屏上时，在手机主屏点它的图标，窗口回到手机并按手机样式显示。
        evidence:
          - {doc: docs/58-miracast-desktop-feasibility.md, date: 2026-09-24}
      - id: E5
        text: 断开外接屏后，每条通知只在手机上弹一次，不再多出一个桌面样式的弹窗。
        evidence:
          - {doc: docs/58-miracast-desktop-feasibility.md, date: 2026-09-29, note: "plasma-mobile +rungic5 三步实测"}
    pitfalls:
      - text: 电视的电脑模式自 2026-10-03 起投 0 号（盖在 CAST 上的图层窗口），手机会话在外接屏上的这套外壳在电视上看不到。补丁按 §19 保留给真显示器和 PC 用。
        docs: [docs/research/97-headless-agent-work.md]
      - text: external-desktop.js 判断屏上是否已有面板时不能只看 screen（面板视图约 0.4 s 后才有屏号），否则每次接屏多建一个面板。脚本不去重，其他设备上已累积的面板要另行清理。
        docs: [docs/58-miracast-desktop-feasibility.md]
      - text: 上游 KScreenOSDProvider 把“插入前的模式”记在 convergenceModeEnabled 本身，docked 状态下重启会话就回不去。KScreenOSDUtil 构造时从不读取 KScreen 配置，插入外屏也不会切换。
        docs: [docs/58-miracast-desktop-feasibility.md]
      - text: KWin 的 TabletMode 和应用自身的移动/桌面形态仍是全局的，没有按屏区分。
        docs: [docs/58-miracast-desktop-feasibility.md]
      - text: 升级后第一次接电视的那次会话里，断开后通知仍会重复一次（小程序已加载）。kickoff 和手机的任务切换器不走“点图标回到点击的屏”。
        docs: [docs/58-miracast-desktop-feasibility.md]
    code:
      - packages/plasma-mobile/debian/patches/rungic/external-screen-desktop-shell.patch
      - packages/plasma-mobile/debian/patches/rungic/docked-rules-per-output.patch
      - packages/plasma-mobile/debian/patches/rungic/activate-on-tapped-screen.patch
      - packages/plasma-mobile/debian/patches/rungic/desktop-size-windows-on-tv.patch
      - packages/plasma-mobile/debian/patches/rungic/kscreenosd-read-config.patch
      - packages/plasma-mobile/debian/patches/rungic/predock-mode-apart.patch
      - packages/kwin/debian/patches/rungic/output-internal-to-scripts.patch
    docs: [docs/58-miracast-desktop-feasibility.md]

  - id: desktop-mode.cast-install
    title: 投屏组件随安装就绪
    scenario: desktop-mode.tv
    status: live
    platform: android
    interfaces: [wifi-display]
    summary: 新装或升级时，Android 侧的投屏组件自动安装，并与桌面侧版本一致。组件包括 root 工具、重连守护、开机脚本和 SELinux 规则。损坏的组件可以修复，安装失败不阻止桌面运行。
    experience:
      - id: E1
        text: 清数据新装时首启装好投屏组件和开机脚本，并在本次开机就启动。投屏是可选能力，组件缺失时只记日志，不阻止桌面安装。
      - id: E2
        text: 已有安装损坏（jar 坏了、开机脚本缺了）时自动修复，并保留上次连接的电视等状态。完好的安装不去动它。
      - id: E3
        text: 只装与当前源码一致的组件：没有构建来源记录、源码在编译期间或之后改过、jar 被换过的，拒绝组包和部署，不会再出现“旧 jar 让面板显示空列表”。
      - id: E4
        text: 已装好的手机可以单独升级投屏组件：先备份旧组件，校验摘要后逐文件原子替换，不重跑整套首启、不动用户账户。
        evidence:
          - {doc: docs/58-miracast-desktop-feasibility.md, date: 2026-10-01, note: "deploy_cast.py 备份并升级 root 组件"}
          - {doc: docs/86-x70-miracast-assessment.md, date: 2026-09-30}
    pitfalls:
      - text: 首启的整 release 完成标记会跳过后续安装逻辑：已完成首启的设备更新投屏组件要用 tools/deploy_cast.py，不能重跑首启。
        docs: [docs/86-x70-miracast-assessment.md]
      - text: install.sh 是可恢复的文件级更新，不是整目录事务切换。回退时要同时恢复备份的 root 载荷、桌面包和 release pin，不能只换回旧 jar。
        docs: [docs/86-x70-miracast-assessment.md]
      - text: 悬浮窗权限不在 default-permissions 管的范围内：首启以 root、失败再以 shell 身份 appops set，结果只记日志。G100 首启曾拒绝 root 上下文的 appops。
        docs: [docs/58-miracast-desktop-feasibility.md]
      - text: 带投屏组件的新整包还没有做清数据刷入后的投屏验收。
        docs: [docs/58-miracast-desktop-feasibility.md, docs/86-x70-miracast-assessment.md]
    code:
      - tools/deploy_cast.py
      - tools/cast_payload.py
      - shared/android/rungic-cast/install.sh
      - tools/tests/test_cast_payload.py
      - tools/ci/test_firstboot_cast.py
    docs: [docs/86-x70-miracast-assessment.md, docs/58-miracast-desktop-feasibility.md]

  - id: desktop-mode.miracast-source
    title: 不经厂商组件的投屏（自研发送端）
    scenario: desktop-mode.tv
    status: experimental
    platform: android
    interfaces: []
    summary: 自研 Miracast 发送端使用 Wi-Fi P2P、RTSP、TS/RTP 和硬件编码，不经过厂商 WFD 栈。原型能协商到 PLAY，但电视没有画面。用户允许使用高通组件后，这条路线自 2026-09-28 起暂缓。
    experience:
      - id: E1
        text: 定向查找约 3 秒发现电视、约 4 秒建组，RTSP M1–M7 协商成功并收到 PLAY，每 25 秒保活。
        evidence:
          - {doc: docs/84-miracast-source.md, date: 2026-09-28, note: "原型实测，root app_process"}
      - id: E2
        text: 电视显示推送的画面和声音，持续 10 分钟以上不掉线。
        gap: 暂缓：电视一直停在等待画面，最可疑的是只实现了 LPCM 而电视只支持 AAC。要先抓厂商栈会话的 RTSP/RTP 逐项对比。
    pitfalls:
      - text: TCL 85Q6H 的 wfd_audio_codecs 只有 AAC，不支持规范强制的 LPCM。CEA 里没有 1080p60。
        docs: [docs/84-miracast-source.md]
      - text: 在 app_process 里画文字会因没加载系统字体触发 hwui 断言（gDefaultTypeface）。
        docs: [docs/84-miracast-source.md]
    code:
      - shared/android/miracast-probe/
    docs: [docs/84-miracast-source.md]

  # ---- 看助理们工作 --------------------------------------------------------------------------------
  - id: desktop-mode.director
    title: 导播台：几块助理屏一起看
    scenario: desktop-mode.watch-agents
    status: live
    platform: linux
    interfaces: [platform-bridge]
    summary: 需要显示至少两块助理屏，或一块助理屏加团队看板时，手机合成一个导播台窗口。焦点画面在主区域，右侧一列实时小窗。窗口可以放大或全屏。
    experience:
      - id: E1
        text: 第二块助理屏要显示时，各自的浮窗换成一个导播台窗口。成员少到一个时它像普通浮窗。有团队看板时一块屏加看板也算两格。
        evidence:
          - {doc: docs/research/91-agent-workspaces.md, date: 2026-10-02, note: "§14 第二次实机验收：浮窗自动换成导播台"}
      - id: E2
        text: 点右侧的小窗把它设为焦点。切换时画面不闪黑，新焦点从 0.95 倍“呼吸”到原大（约 0.26 秒，不过冲）。
        evidence:
          - {doc: docs/58-miracast-desktop-feasibility.md, date: 2026-10-01, note: "第五次修订：切到 3 号后一秒内已是时钟画面"}
      - id: E3
        text: 工具栏的放大按钮在标准、放大、独占三级之间循环。全屏时焦点按 16:9 放到最大，其他屏排在右侧一列，与电视的布局相同。
      - id: E4
        text: 团队看板在焦点时显示阶段、简报、每个成员一行和组长的决定。看板不盖住组长屏的字幕。
        evidence:
          - {doc: docs/research/91-agent-workspaces.md, date: 2026-10-02, note: "§14 第二次实机验收"}
      - id: E5
        text: 三块助理屏的导播台约占 290 MB（每块屏各开一个窗口时约 516 MB）。
        evidence:
          - {doc: docs/58-miracast-desktop-feasibility.md, date: 2026-10-01}
        device: 内存是手机上 Qt 在 Mesa/KGSL 上渲染、PipeWire 缓冲几路画面的实际占用，取决于手机的 GPU 驱动。系统测试容器用 llvmpipe，量出的数不代表手机。
    pitfalls:
      - text: 浮窗里不能用一个视频项换 nodeId 切换焦点：接通另一路 PipeWire 流前那几帧是黑底。每块屏固定一个一直连着的视频项，切焦点只改位置和大小。
        docs: [docs/58-miracast-desktop-feasibility.md]
      - text: 用户否决了弹簧动画（分散注意力）和单纯变亮（像闪了一下）。切换只用普通的呼吸。
        docs: [docs/58-miracast-desktop-feasibility.md]
      - text: TeamBoard.qml 的 id 不能和数据属性同名，否则 board.phase 读到的是组件自己。
        docs: [docs/research/91-agent-workspaces.md]
      - text: 看板在焦点时，电视呈现、全屏、投屏按钮都用旁边的第一块屏（focusPicture），声音不跟随看板。
        docs: [docs/research/91-agent-workspaces.md]
    code:
      - agent/screen/qml/TeamBoard.qml
      - agent/screen/qml/Main.qml
      - agent/screen/agentscreen.cpp
      - agent/screen/agentscreen.h
      - docs/images/readme/team-director.jpg
      - tools/tests/test_agent_screen_switch.py
    docs: [docs/58-miracast-desktop-feasibility.md, docs/research/91-agent-workspaces.md]

  - id: desktop-mode.tv-director
    title: 电视上的导播台
    scenario: desktop-mode.watch-agents
    status: live
    platform: android
    interfaces: [kwin-android-host, platform-bridge, wifi-display]
    summary: 电视导播台以零拷贝呈现多块助理屏。焦点画面在左，其他画面列在右侧，各带名称标签。声音跟随焦点。当前实现位于 Android，按 §17 的决定逐步迁入 Linux。
    experience:
      - id: E1
        text: 新连上的电视在有助理屏时默认投导播台。最后一块助理屏关掉后电视自动回到电脑模式。
        evidence:
          - {doc: docs/58-miracast-desktop-feasibility.md, date: 2026-10-01, note: "23:58 新连上的电视直接投导播台"}
      - id: E2
        text: 布局按 16:9：焦点在左尽量大，其余在右侧一列，不拉伸，名字标签正确。关掉一块屏后格子随之减少。断开重连后回到导播台。
        evidence:
          - {doc: docs/58-miracast-desktop-feasibility.md, date: 2026-10-01, note: "用户确认布局和标签"}
          - {doc: docs/58-miracast-desktop-feasibility.md, date: 2026-10-02, note: "关闭一块屏、断开重连"}
      - id: E3
        text: 在投屏控制里切焦点后，新焦点的声音约 0.15 秒内接上，只剩一路声音。
        evidence:
          - {doc: docs/58-miracast-desktop-feasibility.md, date: 2026-10-02, note: "6 次 130–142 ms，用户确认声音跟着焦点"}
      - id: E4
        text: 无头的助理屏在电视上有实时画面（约 27.6 fps）。Rungic 应用被冻结时工作区照跑，解冻后画面自动恢复。
        evidence:
          - {doc: docs/research/97-headless-agent-work.md, date: 2026-10-02, note: "§13 呈现器实测"}
    pitfalls:
      - text: 动画每帧调用 setDirector 会让宿主每帧重新提交所有画面而卡顿。动画只移动焦点那一层（placeTile，一次 setGeometry 事务）。
        docs: [docs/58-miracast-desktop-feasibility.md]
      - text: 宿主丢掉一个格子的图层时，要先隐藏并从父层摘下再释放，否则旧画面留在屏上。
        docs: [docs/58-miracast-desktop-feasibility.md]
      - text: 呈现器里 Qt 在 Mesa 上默认建桌面 OpenGL 上下文，外部纹理不可用，着色器失败后在 libgallium 里 SIGSEGV，keeper 每 3 秒重启、每次留约 140 MB core。必须显式要 GLES，并有重启退避。
        docs: [docs/research/97-headless-agent-work.md]
      - text: KGSL 没有隐式同步：录屏帧交给 PipeWire 前要 glFinish，否则消费方读到 GPU 没画完的帧（也影响浮窗）。
        docs: [docs/research/97-headless-agent-work.md]
      - text: 导播台全屏里点电视按钮曾让 APK 崩溃（castButton 要求主窗口有焦点）。之后 plasmashell active 却一个窗口都没有、屏幕全黑，自动恢复还没覆盖这种情况。
        docs: [docs/58-miracast-desktop-feasibility.md]
      - text: 按 §17，电视应改为“KWin 第二输出上全屏放导播台窗口”，Director.java、DirectorArt、宿主的 21-tv-director 和呈现器逐步退役。声音跟随焦点也要改由 Linux 侧的导播台提供。
        docs: [docs/research/97-headless-agent-work.md]
    code:
      - android/app/src/com/rungic/plasma/Director.java
      - android/app/src/com/rungic/plasma/DirectorArt.java
      - agent/workspace/present.cpp
      - packages/android-host/debian/patches/rungic/21-tv-director.patch
      - packages/kwin/debian/patches/rungic/screencast-finish-without-implicit-sync.patch
    docs: [docs/58-miracast-desktop-feasibility.md, docs/research/97-headless-agent-work.md]

  # ---- 从别的设备看 --------------------------------------------------------------------------------
  - id: desktop-mode.remote-viewing
    title: 远程观看手机上的屏幕
    scenario: desktop-mode.remote
    status: experimental
    platform: linux
    interfaces: [platform-bridge]
    summary: 整台设备共用一个 RemoteSurface RDP Host。连接后，观看端可以切换手机桌面、电脑桌面和各块助理屏。手机休眠时，助理屏仍可观看。
    experience:
      - id: E1
        text: 整台设备只有一个 Host：连上后观看端拿到设备上所有屏幕的列表（手机桌面、电脑桌面 ws-0、各助理屏），由观看端切换，不会自己切走。
      - id: E2
        text: 手机睡着时手机桌面列为不可用并说明原因，助理屏和电脑桌面照常可看。
      - id: E3
        text: 默认只监听本机回环。TLS 加用户名和随机密码，密码只在第一次显示，配置只有本人可读。
      - id: E4
        text: 看一块无头工作区时 1920×1080 约 27 fps（软件 H.264）。
        evidence:
          - {doc: docs/research/97-headless-agent-work.md, date: 2026-10-02, note: "§15 单工作区冒烟测试，测试用 Host，非 rungic-remote.service"}
        device: 约 27 fps 是手机 CPU 上软件 H.264 编码的实测速度（KGSL 不是 DRM 渲染节点，画面要读回再编码）。Mac mini 容器的 CPU、渲染和读回路径都不同，量出的帧率不代表手机。
      - id: E5
        text: 手机界面重启不会断开正在看工作区的观看端。
    pitfalls:
      - text: RemoteSurface Host 不在发行包里：rungic-remote 从 ~/.local/share/remote-surface-host 或 /usr/lib/remote-surface-host 找它。ARM64 版要另编共享库形式的 FreeRDP 3.31。
        docs: [docs/research/97-headless-agent-work.md]
      - text: KGSL 不是 DRM 渲染节点，录屏要读回、用软件编码。硬件编码等 RemoteSurface 多屏合并后再做。
        docs: [docs/research/97-headless-agent-work.md]
      - text: 每个工作区各开一个 Host（rungic-remote@N）方向不对，已作废。授权靠 ~/.local/share/applications 里一个桌面文件覆盖所有 KWin。
        docs: [docs/research/97-headless-agent-work.md]
      - text: Mac 不经路由器直连手机（AWDL）：G100 的无线驱动 monitor 模式没有发送回调，原版 filin 用不了。不依赖外网时，安卓本地专用热点是优先验证的路线。
        docs: [docs/research/mac-offline-desktop-link.md]
    code:
      - agent/workspace/rungic-remote
      - agent/workspace/rungic-remote.service
      - tools/tests/test_rungic_remote.py
    docs: [docs/research/97-headless-agent-work.md, docs/research/mac-offline-desktop-link.md]

