  - id: install.rebrand-migration
    title: 从 moto 到 Rungic 的改名迁移
    scenario: install.upgrade
    status: live
    platform: linux
    interfaces: []
    summary: 已装手机从 moto 名称迁到 Rungic：账户、家目录和用户设置跟着改名，回到改名前的发布时再交回。D 阶段清理尚未做。
    experience:
      - id: E1
        text: 改名后账户、家目录（随登录名到 /home/<登录名>）、用户设置保留。已完成的 KDE 配置迁移不会重复执行（用户移除的快捷设置不会被加回）。只运行一次。
        evidence:
          - {doc: docs/70-rungic-rebrand.md, date: 2026-09-27, note: "C1/C2 部署与重启验收"}
      - id: E2
        text: 回到改名前的发布时把名称和改名后变化的设置交回旧目录。
        evidence:
          - {doc: docs/70-rungic-rebrand.md, date: 2026-09-27, note: "按包回滚到 20260927.5 再前进，两个方向都通过"}
      - id: E3
        text: 首次账户设置已经移动过家目录、或已在新名称下重新运行过时，迁移仍然正确。
      - id: E4
        text: 已安装的包、单元和包名里不再有 moto 名称（硬件名称和 C 阶段兼容名除外）。
        evidence:
          - {doc: docs/70-rungic-rebrand.md, date: 2026-09-27, note: "rebrand.residue 0 项失败"}
    pitfalls:
      - text: D 阶段还没做：兼容挂载 /var/lib/moto-*、moto-gpu-alloc 链接、投屏厂商“Moto”、/home/linux 链接、旧 APK、moto-* 的 rc 残留和 Docker 旧卷都还在。
