  - id: install.legacy-full-bundle
    title: Android 与 Rungic 整包清数据刷入
    scenario: install.legacy-rom
    status: retired
    keep: AGENTS.md：完整 Android 整包工具保留给明确指定的历史/恢复工作。
    platform: android
    interfaces: []
    summary: >-
      把原厂 Android、自编 GKI、Magisk 引导和 RungicOS 种子合成一个完整刷机包，清数据一次刷入（G100 portov-20260928.5、X70 vantage-20260928.x）。
      2026-09-30 改为三段式独立安装，旧整包已删除。
      AGENTS.md 要求这些工具保留给明确指定的历史复现/恢复，删除前由用户决定。
    experience:
      - id: E1
        text: 整包清数据刷入后，Android 与 Magisk 初始化、Rungic 部署、账户和桌面自动完成。
        evidence:
          - {doc: docs/80-g100-image-installation-retrospective.md, date: 2026-09-28, note: "portov-20260928.5，用户确认进入 Plasma"}
      - id: E2
        text: 电脑端刷写实时显示 fastboot 输出、阶段和分片编号。无输出超时或设备失败时停止该命令。
      - id: E3
        text: 只接受 spec/adapter 记录的 bootloader 值和已核验的刷写计划。错固件、错 spec 或未验证的计划在写入前被拒绝。
      - id: E4
        text: 清数据首启时早期缺少 /data/adb 只记延迟标志，Android 启动完成后准备 Magisk 运行文件并自动重启一次。已安装的 runtime 不被替换。
        evidence:
          - {doc: docs/79-g100-ci-execution.md, date: 2026-09-28, note: ".3 清数据首启成功"}
    pitfalls:
      - text: 整包清数据后反复进入 Recovery，核心差异在干净首启：Magisk 31 在 /data/adb 不存在时到 boot-complete 才创建它。只换部署触发器（service.d）不够。
        docs: [docs/79-g100-ci-execution.md, docs/80-g100-image-installation-retrospective.md]
      - text: APK 复制进 product/app 时漏了压缩的 ARM64 JNI 库（libc++_shared.so），启动即崩。pm install -r 临时修好不能代替只读镜像验收。
        docs: [docs/79-g100-ci-execution.md, docs/80-g100-image-installation-retrospective.md]
      - text: Magisk 不能作为系统应用预装（v2 的教训）。离线首启要让 Magisk 自己把完整 APK 装成普通应用。
        docs: [docs/13-offline-magisk-user-app.md]
      - text: Motorola bootloader 拒绝重新封装的 super.img，改走 fastbootd 的分区刷写。oem fb_mode_set 后进入 fastbootd 前要清除标志。
        docs: [docs/11-stock-install.md]
    code:
