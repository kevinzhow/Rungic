  # ------------------------------------------------------------------ 接入新机型、重刷底座
  - id: install.device-spec
    title: 机型 spec 与原厂固件核验
    scenario: install.new-device
    status: live
    platform: android
    interfaces: []
    summary: 开发者和 Agent 为每个机型及固件维护一份不可变 spec。它记录身份、原厂摘要、内核配方、分区和刷写策略。原厂包必须通过 spec 核验后才能使用。
    experience:
      - id: E1
        text: 原厂包按精确 identity 核验后才解包（默认 G100，X70 用显式 identity）。错机型、多出的 super 分片、XML 摘要不符时在解包前拒绝，结果不发布。
      - id: E2
        text: 实机预检按 spec 核对身份、固件、槽位、电量和空间，不符时停止，不写设备。
    pitfalls:
      - text: G100 S（mumba_cn）的镜像、哈希和刷机命令不能用于 G100（portov_cn）。同销售名、同 GPU、同 Android 版本都不能合并 spec。
        docs: [docs/78-g100-firmware-inventory.md, docs/75-image-build-separation.md]
      - text: G100 有 32 个 super 分片、X70 有 41 个。X70 还有独立的 odm 逻辑分区，不能遗漏。分片按数字而不是词典序排列。
        docs: [profiles/devices/motorola/vantage_cn/W2WV36.55-75-15-knowledge.md]
      - text: Motorola bootloader 的 fastboot 值与 Android 属性表示不同（多行、少末尾字符），两边分别记录、严格比对，不能为通过而放宽。
        docs: [docs/79-g100-ci-execution.md, profiles/devices/motorola/vantage_cn/W2WV36.55-75-15-knowledge.md]
      - text: Android/fastbootd 回 bootloader 常只断开 USB、需要重插。bootloader 直接刷第二个 super 分片曾卡住并报 error -71。不要循环重刷，超级分区走 fastbootd，进入前清 fb_mode。
        docs: [docs/79-g100-ci-execution.md, profiles/devices/motorola/vantage_cn/W2WV36.55-75-15-knowledge.md]
      - text: 改执行参数要发新的 adapter 和包，不能改已绑定哈希的旧 spec 后继续用。
        docs: [profiles/devices/motorola/vantage_cn/W2WV36.55-75-15-knowledge.md]
    code:
      - profiles/
      - tools/prepare_g100_stock.py
      - tools/verify_g100_stock.py
      - tools/test_prepare_stock.py
      - tools/ci/preflight.py
      - .agents/skills/rungic-three-stage-image/
      - tools/ci/test_device_preflight.py
    docs:
      - docs/01-device.md             # G100 S 的硬件与分区身份
      - docs/77-g100-three-ci-assessment.md
      - docs/78-g100-firmware-inventory.md
      - docs/83-x70-air-pro-onboarding.md

  - id: install.gki-kernel
    title: 自编 GKI 设备底座
    scenario: install.new-device
    status: live
    platform: android
    interfaces: []
    summary: 每个机型固定 ACK/Kleaf 来源、配置和补丁。构建的 GKI 提供 LXC 所需能力，与原厂模块 ABI 兼容，并保持 Android 正常启动。
    experience:
      - id: E1
        text: 候选内核与原厂模块逐符号比对 CRC：GKI 可比较的引用 0 差异，并写明未覆盖的引用范围。正确解析 Android 15/16 的旧式与扩展 modversions。
        evidence:
          - {doc: docs/83-x70-air-pro-onboarding.md, date: 2026-09-28, note: "X70 v7 36,262 个可比较引用 0 差异"}
          - {doc: docs/80-g100-image-installation-retrospective.md, date: 2026-09-28, note: "G100 19,009 个引用 0 不匹配"}
      - id: E2
        text: 刷入候选内核后 Android 正常启动，原厂模块全部加载，SELinux Enforcing，LXC 需要的 namespaces 可用。
        evidence:
          - {doc: docs/83-x70-air-pro-onboarding.md, date: 2026-09-28, note: "X70 508 个模块含 rust_binder"}
      - id: E3
        text: 保留原厂模块的签名信任证书，不因缺模块而不开机。
        evidence:
          - {doc: docs/17-lxc-installation.md, date: 2026-09-22, note: "G100 S 恢复证书后 441 个模块完整加载"}
    pitfalls:
      - text: 直接开启 IPC、namespace 和额外 cgroup 配置曾造成 9,768 个 CRC 不匹配。要锁定与原厂匹配的 ACK 提交、构建号、页大小和证书，用 KABI 预留槽承载新字段。
        docs: [docs/80-g100-image-installation-retrospective.md]
      - text: 早期重编出现 3,252 个符号 CRC 变化、97 个模块缺失。编译成功不等于能用，静态 ABI 和实机启动共同放行。
        docs: [docs/75-image-build-separation.md]
      - text: X70 的 6.12 收敛 C 布局后还剩 Rust Binder 的 CRC 差异，需要单独的补丁。
        docs: [docs/83-x70-air-pro-onboarding.md]
      - text: 每台手机有自己的内核产物，boot 二进制不跨机型复用。Magisk 也要在目标设备本机修补。
        docs: [docs/75-image-build-separation.md]
    code:
      - packages/gki-android15-6.6/
      - packages/gki-android16-6.12/
      - kernel/README.md
      - kernel/targets/
      - tools/ci/module_abi.py
      - tools/ci/test_module_abi.py
      - tools/ci/restore_module_trust.py
    docs:
      - docs/75-image-build-separation.md
      - docs/80-g100-image-installation-retrospective.md
      - docs/83-x70-air-pro-onboarding.md

  - id: install.rungicos-image
    title: 构建独立 RungicOS 镜像
    scenario: install.new-device
    status: live
    platform: linux
    interfaces: []
    summary: 构建器使用干净的 ARM64 root 树和固定包集合，生成 ext4 rootfs、压缩载荷、包锁和报告。镜像不含个人数据，预装集合遵循清单。
    experience:
      - id: E1
        text: 镜像不带个人账户、密码、凭据或构建机痕迹：只有一个口令锁定的 UID 1000 模板账户，没有账户完成标记，home 里没有别的条目。违反时拒绝出镜像，报错里不出现口令哈希。
        evidence:
          - {doc: docs/83-x70-air-pro-onboarding.md, date: 2026-09-28, note: "受影响的 root 树被新检查拒绝"}
      - id: E2
        text: 预装集合按清单：被排除的独立应用（Angelfish、Haruna、Journald Browser、KleverNotes、Marknote）不在镜像里，Emoji Selector 入口被 dpkg 排除，桌面与 Emoji 字体保留。旧树有残留时拒绝。
        evidence:
          - {doc: docs/92-x70-android-base-end-to-end.md, date: 2026-09-30, note: "五个独立包未安装"}
      - id: E3
        text: 镜像里的包安装干净：dpkg --audit、apt-get check、ext4 检查通过。APT pin 按本次 manifest 重新生成，不留旧 release 的 pin。
        evidence:
          - {doc: docs/93-x70-independent-image-revalidation.md, date: 2026-09-30}
          - {doc: docs/94-build-fingerprints.md, date: 2026-09-30}
      - id: E4
        text: 按输入指纹复用产物：安装包里组件被替换、缺少构建绑定、输入被改或依赖未解析时 verify 拒绝。
        evidence:
          - {doc: docs/94-build-fingerprints.md, date: 2026-09-30, note: "8 个组件第二次构建全部命中缓存"}
      - id: E5
        text: 在 x86 主机上构建 ARM64 root 树时，chroot 不继承宿主的 Python 设置和 HOME，但保留代理。
    pitfalls:
      - text: PRoot 下 systemd 安装脚本的原子改名报 EXDEV。改用独立 user/mount namespace 的真实 chroot 加 QEMU。
        docs: [docs/80-g100-image-installation-retrospective.md]
      - text: 开发 venv 用 --system-site-packages 掩盖了包没声明的运行依赖。在干净 rootfs 里核验 dpkg --audit 和 pip check。
        docs: [docs/80-g100-image-installation-retrospective.md]
      - text: 旧准备树的 /dev/null 曾被重定向写成普通文件。从清理过的 root 树开始，arm64_chroot 在私有挂载命名空间里绑定真实 /dev。
        docs: [docs/93-x70-independent-image-revalidation.md]
      - text: build_rootfs_image.py 只打包已准备好的 root 树，不是包下载与全自动安装器。复用旧树前先在构建 chroot 里卸掉排除清单的包。
        docs: [docs/75-image-build-separation.md, .agents/skills/rungic-three-stage-image/references/tool-map.md]
      - text: 组合 rootfs/host 的执行器要在 podman unshare 内运行，不能在其中再启动 Podman。mtime 不进缓存键，不承诺逐字节可复现。
        docs: [docs/94-build-fingerprints.md]
    code:
      - tools/ci/build_rootfs_image.py
      - tools/ci/arm64_chroot.py
      - tools/ci/rootfs.Dockerfile
      - tools/ci/build_fingerprinted_rootfs.py
      - tools/ci/build_fingerprinted_host.py
      - tools/ci/build_image_packages.py
      - tools/ci/build_image_repo.py
      - tools/ci/build_host_seed.py
      - tools/ci/test_rootfs_isolation.py
      - tools/ci/test_build_manifest.py
      - system/ubuntu-packages.txt
      - system/ubuntu-excluded-packages.txt
      - system/ubuntu-build-packages.txt
      - system/config/etc/dpkg/dpkg.cfg.d/zz-rungic-apps
      - tools/system/tests/rootfs_image.py
    docs:
      - docs/75-image-build-separation.md
      - docs/94-build-fingerprints.md

