  - id: delivery.phone-access
    title: 开发机连接手机执行命令
    scenario: delivery.diagnose
    status: live
    platform: android
    interfaces: []
    summary: rungic_device.py 查找手机，并将脚本送到 Android、Android root、容器 root 或桌面用户环境执行。rungic_plasma.py 和 rungic_lxc.py 提供对应命令行。Android 侧的 enter 程序负责进入 LXC 控制环境。
    experience:
      - id: E1
        text: 按硬件序列号在所有 adb 设备里找到手机，无线调试端口变化不用改配置。RUNGIC_ADB、RUNGIC_SERIAL、RUNGIC_TRANSPORT 或 .work/device.env 可以指定。
        evidence:
          - {doc: docs/55-agent-native-debugging.md, date: 2026-09-23, note: "P0：原 7 个硬编码工具改为共用此入口"}
      - id: E2
        text: 脚本经 stdin 送到四个层级执行，没有多层引号，退出码原样返回。
      - id: E3
        text: 回滚到改名前的发布后，工具先找 Rungic 名称、找不到再用旧名称，部署、验收和诊断照样可用。
        evidence:
          - {doc: docs/70-rungic-rebrand.md, date: 2026-09-27, note: "按包回滚到 20260926.20 后冒烟验收通过"}
      - id: E4
        text: enter 程序在私有挂载命名空间里进入 LXC 运行环境，不在 Android 原来的挂载命名空间挂载任何东西。build_enter.sh 用 NDK 静态编译。
        gap: enter 程序只能以 Android root 运行：路径写死为 /data/adb/rungic-lxc/runtime、/storage 与 /data/user，unshare/pivot_root 需要 CAP_SYS_ADMIN。开发机禁止非特权 user namespace（apparmor_restrict_unprivileged_userns=1），系统测试容器没有 SYS_ADMIN，也没有 NDK。还没有按日期记录的实机核对
    pitfalls:
      - text: 多个 adb server 或多台手机同时在线时，先 adb devices -l 核对端口和序列号，之后每条命令都带精确序列号。adb server 是共用的，不能 kill-server。
        docs: [AGENTS.md]
      - text: adb shell su -c '命令一; 命令二' 可能只有第一条以 root 运行，改为把脚本经 stdin 送给 su -c sh。
        docs: [AGENTS.md]
      - text: adb 走 Wi-Fi，离开当前 Wi-Fi 会断开 adb，失去对手机的全部访问。不要做会断网的操作。
        docs: [docs/73-reduce-upstream-changes.md]
      - text: Magisk 31.0 的 magiskd 遇到返回 SQL NULL 的查询会退出（直接 PRAGMA table_info、未检查的 SELECT *）。只查明确非空的列或逐列 COALESCE，先在内存数据库核对，不在实机复现。
        docs: [docs/39-magisk-daemon-crash.md, AGENTS.md]
    code:
      - tools/rungic_device.py
      - tools/rungic_plasma.py
      - tools/build_enter.sh
      - tools/rungic_plasma_enter.c
      - tools/rungic_lxc_enter.c
      - tools/tests/test_phone_levels.py
    docs: [docs/55-agent-native-debugging.md, docs/39-magisk-daemon-crash.md]

  # ---------------------------------------------------------------- upstream
  - id: delivery.patch-queue
    title: 上游组件的补丁队列
    scenario: delivery.upstream
    status: live
    platform: linux
    interfaces: []
    summary: packages/<名>/recipe.json 固定上游来源和校验值。修改保存在 debian/patches/rungic/，使用 DEP-3 和 X-Rungic-* 元数据。tools/pq.py 负责下载、展开、编辑、导出和检查。
    experience:
      - id: E1
        text: fetch 按配方下载并核对 sha256，不符的文件不留在缓存里，并报出是哪个文件。
      - id: E2
        text: lint 要求我们的每条补丁都有 DEP-3 与 X-Rungic-* 字段、取值合法、与 series 一致，缺了就失败。
      - id: E3
        text: overlay 把仓库里的共享文件放进源码树，补丁只引用不复制。整体替换上游文件时必须记录它的哈希，上游一改或文件消失就拒绝构建。
      - id: E4
        text: git 子树配方核对所选子树的树哈希。换了子树不复用旧归档。排除项消失或路径越出所选子树时失败，要求复核。
      - id: E5
        text: verify 把打好补丁的源码与参照树比较，无法解析的符号链接算作差异，不会误报一致。
      - id: E6
        text: tests 列出补丁与测试的对应矩阵，只写了计划的测试不算覆盖，没有测试的补丁列为缺口。
      - id: E7
        text: prepare 再 export 往返不改变补丁内容。export 只写回我们的主题和 series，Ubuntu 原有补丁保持原样。
        evidence:
          - {doc: docs/71-upstream-patch-queue.md, date: 2026-09-26, note: "试点 3 工具"}
      - id: E8
        text: Android 宿主及其 Smithay、Winit 依赖只组装在 .work/ 内，组装结果与迁移前直接维护的源码逐项一致。
        evidence:
          - {doc: docs/73-reduce-upstream-changes.md, date: 2026-09-30, note: "706 个原生文件差异为 0"}
    pitfalls:
      - text: 不以提交上游作为手段（评审周期过长）：必须保留的修改长期作为补丁维护，能在自有组件、扩展点或共享服务里解决的不改上游。升级时先核对新版本是否已包含我们的修复，已包含的删除。
        docs: [docs/73-reduce-upstream-changes.md, AGENTS.md]
      - text: gbp pq export 第一次会把 Ubuntu 原有补丁改写成 From/Date/Subject 格式，只导出 rungic 主题下的补丁。
        docs: [docs/71-upstream-patch-queue.md]
      - text: 复用构建目录并用 rsync -a 同步时源文件保留旧修改时间，CMake 不重编，结果混入旧目标文件。每个源码状态用新目录或 git archive。
        docs: [docs/71-upstream-patch-queue.md]
      - text: KWin 测试要在 xvfb 下串行跑（xvfb-run ctest -j1），比较与不含补丁的基线的失败集合，而不是通过数。
        docs: [docs/71-upstream-patch-queue.md]
      - text: pull-lp-source 只用 Debian 密钥环验签，Ubuntu 上传者只给警告。完整性以配方里的 sha256 为准。
        docs: [docs/71-upstream-patch-queue.md]
      - text: Winland 固定提交缺根 LICENSE（README 声明 MIT），这是已记录的来源缺口，没有补造许可证。
        docs: [docs/52-git-repository-scope.md, docs/73-reduce-upstream-changes.md]
      - text: desktop/patches/qt-video-duration.patch 是未验收实验，不在 qt6-multimedia 的补丁队列里，不要手动叠加到源码树。
        docs: [packages/WORKFLOW.md]
    code:
      - tools/pq.py
      - tools/test_pq.py
      - tools/pq/Dockerfile
      - tools/pq/build.Dockerfile
      - tools/prepare_android_host.py
      - packages/WORKFLOW.md
      - packages/*/recipe.json
    docs: [docs/71-upstream-patch-queue.md, docs/73-reduce-upstream-changes.md, packages/WORKFLOW.md]

  - id: delivery.vendor-history-import
    title: 由 vendor 历史生成补丁队列
    scenario: delivery.upstream
    status: retired
    platform: linux
    interfaces: []
    summary: 一次性迁移工具按 tools/pq-history/<包>.json 将 vendor/ 时期的提交转换为补丁队列。工具与 vendor 树逐字节核对结果。全部组件已于 2026-09-27/30 完成迁移，vendor/ 已从全部历史删除。
