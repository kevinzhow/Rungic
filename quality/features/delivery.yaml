area: delivery
title: 交付、诊断与开发
summary: 开发者和开发 Agent 用的工程能力：改完代码装到手机上试、出正式发布并能回退、自动验收、诊断故障、维护上游补丁、管好仓库与项目知识。
scenarios:
  - id: delivery.try-on-phone
    title: 改完代码装到手机上试
    summary: 在开发机或 Mac mini 上从工作区构建，作为开发覆盖装到手机，看效果，不满意一条命令撤销。
  - id: delivery.release
    title: 出一个正式发布并能回退
    summary: 从干净的提交构建全部包，生成发布元包，部署到手机，自动验收。失败时自动回到部署前，之后也能回到上一个发布。
  - id: delivery.diagnose
    title: 查清手机上出了什么问题
    summary: Agent 不靠点界面就能拿到合并日志、崩溃回溯、追踪、截图、完整性报告，并按控件名操作桌面复现问题。
  - id: delivery.upstream
    title: 维护对上游组件的修改
    summary: 上游源码只固定不入库，修改是带元数据的补丁队列。编辑、构建、升级都有固定流程。
  - id: delivery.repository
    title: 管好仓库与项目知识
    summary: 仓库里只有该同步的东西，来源可查。开发 Agent 一进来就找得到约定、技能、文档和功能清单。

features:
  # ---------------------------------------------------------------- try on the phone
  - id: delivery.dev-overlay
    title: 开发覆盖：工作区改动装到手机上
    scenario: delivery.try-on-phone
    status: live
    platform: linux
    interfaces: []
    summary: rungic_dev.py deploy 从工作区构建指定包或上游组件，包括未提交改动。产物作为开发覆盖安装在现有发布之上。用户可以查看覆盖状态，并用 reset 恢复发布版本。
    experience:
      - id: E1
        text: 开发版本是“发布里的版本+dev<UTC 时间>.<短 sha>[.dirty]”，排在该发布版本之后、下一个发布之前。apt 和 Discover 把开发覆盖当作已装系统（每个覆盖 Installed 等于 Candidate），不提示把我们的包“更新”回去。
        evidence:
          - {doc: docs/97-local-development-deploy.md, date: 2026-09-30, note: "首次部署三个包：apt list --upgradable 无 rungic 包，dist-upgrade 不动它们"}
      - id: E2
        text: 手机说得出自己偏离了哪个发布、偏离了什么：status 和 /usr/share/rungic/release.json 列出基线发布及每个覆盖的版本、提交、是否 dirty、构建时间。完整性检查的 release.dev 列出覆盖，state 为 development。
        evidence:
          - {doc: docs/97-local-development-deploy.md, date: 2026-09-30, note: "release.dev 列出基线和 3 个覆盖"}
      - id: E3
        text: 再次部署时之前的覆盖保留，开发元包的基线始终是原来那个发布。
      - id: E4
        text: reset [包|组件] 回到发布版本（发布里还没有的组件回到手机上原来的发行版版本）。先装好基线版本，成功后才删开发的源、pin 和仓库。
        gap: reset 尚未在实机执行，只有离线测试
      - id: E5
        text: 发布要重建的上游组件（packages/<名>）也能直接 deploy：用补丁队列构建，有 obj 树时增量构建，只覆盖发布里登记、手机已装的那几个二进制包。
        evidence:
          - {doc: docs/97-local-development-deploy.md, date: 2026-10-01, note: "plasma-mobile 增量构建 238 秒，会话按规则重启"}
          - {doc: docs/97-local-development-deploy.md, date: 2026-10-03, note: "新加入 rebuilt 的 ksystemstats，以发行版版本为基准"}
      - id: E6
        text: 在 Mac mini 上构建的包由手机直接从构建机取（wire.net、局域网依次试），每个文件核对大小与 SHA-256，最多三次。被新覆盖替换掉的包从本机记录和构建机上一并删掉。三个包同步约 25 秒，整次部署约 5.5 分钟。
        evidence:
          - {doc: docs/97-local-development-deploy.md, date: 2026-10-03, note: "rungic-firefox、rungic-agent-screen、rungic-cua；此前约 21 分钟"}
      - id: E7
        text: 正式发布部署成功、写好发布 pin 之后，开发覆盖的源、pin 和仓库被清掉。安装失败时开发覆盖和它的包保持原样。
        gap: 这一步还没有在实机走通过（docs/97 §事故）
      - id: E8
        text: 覆盖更新使用工作区当前的系统服务名称重启对应部件，旧发布清单中的名称不会让已更新的桥接服务继续运行旧代码。
        evidence:
          - {doc: docs/97-local-development-deploy.md, date: 2026-10-03, note: "USB G100 三项桥接服务重启，主进程时间从 9 月 30 日更新到本轮部署"}
    pitfalls:
      - text: 不要 dpkg -i 或直接替换容器里的文件：装上的版本和发布 pin 冲突，Discover 会提示“有更新”，完整性检查报漂移。试验一律走开发覆盖。
        docs: [docs/97-local-development-deploy.md, docs/61-delivery-diagnostics-plan.md]
      - text: 开发覆盖不做 rootfs 快照。上一次发布的快照未 commit 时也能部署，但之后执行 rollback --snapshot 会把覆盖一起丢掉。
        docs: [docs/97-local-development-deploy.md]
      - text: APK、rungic-plasma 控制器和发布清单里 android 列出的文件没有开发覆盖，要单独安装并在文档里记录。
        docs: [docs/97-local-development-deploy.md]
      - text: 不要用 --host phone：会把 Qt、CMake 等构建依赖装进用户的日常机（G100 S），重任务还会引发低内存查杀。
        docs: [.agents/skills/rungic-dev-release/SKILL.md]
      - text: 2026-09-30 一个离线部署测试替换了 rungic_release.run，却没拦住 rungic_device.run，在真手机上删掉了开发覆盖。部署流程里新加的设备操作必须走调用方模块的 run 或由参数传入 runner。
        docs: [docs/97-local-development-deploy.md]
      - text: 部署经 Wi-Fi 要几分钟到十几分钟，放在后台运行，不要套短超时。
        docs: [.agents/skills/rungic-dev-release/SKILL.md, docs/96-desktop-recovery-after-apk-restart.md]
    code:
      - tools/rungic_dev.py
      - tools/test_rungic_dev.py
      - .agents/skills/rungic-dev-release/
      - .claude/skills/rungic-dev-release
    docs: [docs/97-local-development-deploy.md]

  - id: delivery.build-hosts
    title: 在 Mac mini 或手机上构建 ARM64 包
    scenario: delivery.try-on-phone
    status: live
    platform: linux
    interfaces: []
    summary: 设备包和上游组件默认在 Mac mini 的 Ubuntu 26.04 ARM64 容器中构建。手机作为后备构建端。产物进入发布仓库或开发仓库。
    experience:
      - id: E1
        text: 默认构建机是 Mac mini，速度远快于手机：KWin 含 LTO 的完整构建约 6 分钟，手机上一小时以上。构建期间手机不受影响。
        device: 构建耗时取决于 Mac mini 与手机的硬件，只能在两台机器上实测。默认构建机和不碰手机由单元测试检查
        evidence:
          - {doc: docs/71-upstream-patch-queue.md, date: 2026-09-27, note: "§构建机：Mac mini"}
      - id: E2
        text: 增量构建只重编改动的文件：源码树用 rsync --checksum 同步，未改文件保留时间戳，保留上次的 obj 树，并按生成文件选择 make 或 Ninja。
        evidence:
          - {doc: docs/97-local-development-deploy.md, date: 2026-10-01, note: "plasma-mobile 增量 238 秒；ksystemstats 增量 54 秒（2026-10-03）"}
      - id: E3
        text: 与构建机之间的每次传输都核对大小与 SHA-256，不一致就重试，不会把截断的包收进仓库。
        evidence:
          - {doc: docs/71-upstream-patch-queue.md, date: 2026-09-27, note: "docker exec cat 曾以成功状态提前结束（13.7 MB 只收到 12.9 MB）"}
      - id: E4
        text: 手机用自己的受限密钥直连构建机，只能 put/get /root/rungic-build 下的相对路径，其他命令、绝对路径和 .. 都被拒绝。
        evidence:
          - {doc: docs/71-upstream-patch-queue.md, date: 2026-09-27, note: "实测 6.8 MB/s，其他命令与路径被拒绝"}
      - id: E5
        text: Mac mini 上的构建结果与手机上的完整构建逐文件一致（ELF 去掉 build-id 与 debuglink 后比较），差异只来自可解释的原因。
        device: 要在手机容器里做一次完整构建（一小时以上）再与 Mac mini 的产物逐文件比较。系统测试只有 Mac mini 一台构建环境，替代不了手机上的那一份
        evidence:
          - {doc: docs/71-upstream-patch-queue.md, date: 2026-09-27, note: "plasma-settings、libcamera 一致；qmlcachegen AOT 与 IPA 签名差异已解释"}
      - id: E6
        text: 构建容器里每条联网命令都带上 Mac mini 的系统代理（scutil 读取，以 host.docker.internal 代替本机地址）。
    pitfalls:
      - text: 经 ssh 执行的命令和 Docker 容器都不会自动使用 Mac mini 的系统代理（Surge 127.0.0.1:6152），要显式传入。容器 DNS 把 macmini.wire.net 解析成公网地址，手机直连要用 10.77.0.20 或 192.168.5.45。
        docs: [AGENTS.md, docs/71-upstream-patch-queue.md]
      - text: qmlcachegen 按构建环境里已安装的 QML 模块决定能预编译哪些绑定，所以构建机镜像装了手机的整套桌面（arm64-host-packages.txt）。手机新装包后要刷新这份清单。
        docs: [docs/71-upstream-patch-queue.md]
      - text: 比较 aarch64 二进制要用 llvm-objcopy：主机的 objcopy 不认识 aarch64，出错时输出为空，两边哈希会“相同”。
        docs: [docs/71-upstream-patch-queue.md]
      - text: 在手机容器里跑重任务（构建、gdb 加载调试信息）会让 Android 的低内存查杀杀掉 VPN 和 Plasma APK，失去对手机的访问。
        docs: [docs/61-delivery-diagnostics-plan.md]
    code:
      - tools/build_on_device.py
      - tools/build_mesa.py
      - tools/pq/arm64-host.Dockerfile
      - tools/pq/arm64-host-packages.txt
      - tools/pq/rungic-transfer
      - tools/test_build_on_device.py
    docs: [docs/71-upstream-patch-queue.md, docs/53-remote-system-development.md]

  - id: delivery.dev-env
    title: 开发环境一条命令就绪
    scenario: delivery.try-on-phone
    status: live
    platform: linux
    interfaces: []
    summary: dev-setup.sh 准备开发用 Python 环境。work-env.sh 将缓存和构建输出放入 .work/。Android 交叉编译器包装脚本通过环境变量选择本机工具链。
    experience:
      - id: E1
        text: source tools/work-env.sh 之后 Python 字节码缓存、Cargo 输出都在 .work/ 下，并启用 .work/venv。源码目录里不出现缓存。
      - id: E2
        text: sh tools/dev-setup.sh 一次装好开发用 Python（PySide6、pytest）并打印 PySide6 版本。这些依赖只用于原型和测试，不进入镜像或软件包。
      - id: E3
        text: Android 交叉编译器（tools/toolchains/android-clang、android-clang++）可由 RUNGIC_ANDROID_CLANG、RUNGIC_ANDROID_SYSROOT 等变量指向本机的 clang 与 sysroot。
    pitfalls:
      - text: 交叉编译器包装脚本的默认路径写死在 /home/kevinzhow/android-kernel。SDK/NDK、Rust 依赖和 Android 链接库要另行准备，源码齐备不等于任意机器一键构建。
        docs: [docs/52-git-repository-scope.md, docs/53-remote-system-development.md]
      - text: PySide6 这类依赖只服务于开发时的原型与测试，进入生产的部分用 C++ 等重写或用设备自带的库（用户 2026-09-29 明确）。
        docs: [AGENTS.md, docs/52-git-repository-scope.md]
    code:
      - tools/work-env.sh
      - tools/dev-setup.sh
      - tools/dev-requirements.txt
      - tools/toolchains/
      - .cargo/config.toml
      - tools/test_dev_env.py
    docs: [docs/52-git-repository-scope.md]

  - id: delivery.design-gallery
    title: 设计系统状态总览截图
    scenario: delivery.try-on-phone
    status: live
    platform: linux
    interfaces: []
    summary: design_gallery.py 将设计系统各控件的状态渲染为浅色和深色两套图。开发机可离线渲染，也可在手机上渲染。截图用于界面改动前后的对照。
    experience:
      - id: E1
        text: local 在本机用 PySide6 渲染 desktop/design/qml，每节浅深两张图并拼成 sheet.png。--rev 渲染某个提交的 QML，用于改动前后对照。
        evidence:
          - {doc: docs/102-design-system-choices-and-swipe-back.md, date: 2026-10-01, note: "ChoiceRow、ToggleRow、ListRow 三节"}
      - id: E2
        text: phone 以桌面用户、offscreen 平台运行已安装的 rungic-design-gallery，不在用户屏幕上开窗口，截图取回本机。
        evidence:
          - {doc: docs/87-agent-app-redesign.md, date: 2026-09-30, note: "21 节 × 浅深两种主题共 42 张"}
          - {doc: docs/102-design-system-choices-and-swipe-back.md, date: 2026-10-01}
    pitfalls:
      - text: software 后端不画 MultiEffect，Thumbnail 和 LivePicture 的示例图是空的。这不是回退，这类控件要在真实会话里另行确认。
        docs: [.agents/skills/rungic-dev-release/SKILL.md, docs/87-agent-app-redesign.md]
    code:
      - tools/design_gallery.py
      - tools/tests/test_design_picture.py
      - tools/tests/test_design_gallery.py
    docs: [docs/87-agent-app-redesign.md]

  - id: delivery.offline-tests
    title: 离线测试一次跑完
    scenario: delivery.try-on-phone
    status: live
    platform: linux
    interfaces: []
    summary: tools/run-tests.sh 在开发机上统一运行 pytest、APK 纯 Java 测试和 shell 语法检查，不操作手机。
    experience:
      - id: E1
        text: 一条命令跑完全部离线测试（tools/ci、tools、tools/tests、system/account 的 pytest，APK 纯 Java 测试，已跟踪 sh 脚本的语法），最后列出失败的部分或报告全部通过。
      - id: E2
        text: 离线测试碰不到手机：任何测试一旦走到 rungic_device 的 adb 调用就直接失败。
      - id: E3
        text: 没有 PySide6 时跳过需要它的 QML 测试，并提示 sh tools/dev-setup.sh。
    pitfalls:
      - text: 2026-09-30 一个部署测试走到了没有被替换的 rungic_device.run，删掉了真手机上的开发覆盖。之后 conftest.py 给 tools/ 下所有测试加了 adb 保护。
        docs: [docs/97-local-development-deploy.md]
      - text: 在模块顶层调用 unittest.main() 的测试会中断 pytest 收集（system/account/test_setup.py 曾如此）。
        docs: [docs/95-install-use-case-tests.md]
    code:
      - tools/run-tests.sh
      - tools/conftest.py
      - tools/test_run_tests.py
    docs: [docs/95-install-use-case-tests.md]

  # ---------------------------------------------------------------- release
  - id: delivery.packaging
    title: 自有软件包构建
    scenario: delivery.release
    status: live
    platform: linux
    interfaces: []
    summary: rungic_package.py 根据 packaging/<名>/ 在主机或 ARM64 构建机上构建 rungic-* 包。包安装到 /usr 和 /etc 等标准位置，包含依赖、维护脚本和调试符号。
    experience:
      - id: E1
        text: 发布构建只用已提交的内容：包的路径里有未提交改动就拒绝构建。版本为 0.<提交数>，同一提交重建内容不同时加 +bN。路径没变的包不重建，list 显示 current、stale 或 uncommitted。
      - id: E2
        text: 包声明的输入（paths、upstream 配方及其 overlay）都存在，build.sh 从仓库读取的文件都在声明里，所以改了任何输入，这个包都会被判为需要重建。
      - id: E3
        text: 升级、卸载重装都保留管理员对单元的启用或禁用选择。维护脚本只启用不覆盖禁用，obsolete 里的链接只在悬空时删除。
        evidence:
          - {doc: docs/70-rungic-rebrand.md, date: 2026-09-26, note: "B0：禁用 coredump.path 后 dpkg -r 再 -i 仍为 disabled"}
      - id: E4
        text: 改名的包对旧名写 Conflicts 和 Replaces，安装时继承旧单元的启用状态。按精确版本部署时 apt 自动移走旧名的包。
        evidence:
          - {doc: docs/70-rungic-rebrand.md, date: 2026-09-27, note: "发布 20260927.5：4 个系统单元与 6 个用户单元都已启用"}
      - id: E5
        text: 设备包带 dpkg-shlibdeps 生成的库依赖，并按 build-id 拆出 -dbgsym，供崩溃符号化使用。
        evidence:
          - {doc: docs/61-delivery-diagnostics-plan.md, date: 2026-09-26, note: "-g1 成本：plasma-mobile dbgsym 3.7 MB"}
    pitfalls:
      - text: 旧的生成器把单元启用链接列为 obsolete，每次升级都删一遍。运行中的会话掩盖了问题，直到容器重启后会话起不来（发布 20260926.7）。
        docs: [docs/61-delivery-diagnostics-plan.md]
      - text: 维护脚本只启用单元（容器的 policy-rc.d 不让启动），新服务要靠部署的 service_restart 才会跑新代码。
        docs: [docs/73-reduce-upstream-changes.md]
      - text: 改名规则漏掉库文件名（libmotocodec）时，GStreamer 按插件文件名找入口符号，编码器全部不可用。改名字要连文件名一起核对。
        docs: [docs/70-rungic-rebrand.md]
    code:
      - tools/rungic_package.py
      - packaging/
      - tools/test_source_layout.py
      - tools/test_rungic_package.py
      - tools/system/tests/package_unit_state.py
    docs: [docs/61-delivery-diagnostics-plan.md]

  - id: delivery.release-deploy
    title: 发布、部署与回滚
    scenario: delivery.release
    status: live
    platform: linux
    interfaces: []
    summary: rungic_release.py 将一次发布打包为 rungic-release=<YYYYMMDD.N>，精确依赖该发布的全部包。手机部署依次执行预检、记录、同步、安装、重启和复核。失败时自动恢复，用户也可以回到上一发布。
    experience:
      - id: E1
        text: 部署在临时单元里按精确版本安装发布的全部包，成功后把每个包钉在发布版本（1001），元包带 Protected：Discover 不把我们的包显示为“有更新”，也不能顺带卸掉元包。不在发布里的 Ubuntu 包照常更新。
        evidence:
          - {doc: docs/97-local-development-deploy.md, date: 2026-09-30, note: "发布 20260930.10 写 71 条 pin，apt 不提示 rungic 包"}
      - id: E2
        text: rollback 回到上一个发布：按包精确降级，需要时重启会话。
        evidence:
          - {doc: docs/61-delivery-diagnostics-plan.md, date: 2026-09-26, note: "20260926.2 回到 .1，实际降级 kwin 并重启会话"}
          - {doc: docs/70-rungic-rebrand.md, date: 2026-09-27, note: "按包回滚到 20260926.20 再升级回 20260927.5，两个方向都通过"}
      - id: E3
        text: 安装之后任何一步出错或验收失败，先保存证据包，再回到部署前的快照，部署改过的 Android 侧文件也恢复原样。
        evidence:
          - {doc: docs/61-delivery-diagnostics-plan.md, date: 2026-09-26, note: "20260926.10 与 .11 共 3 次验收失败，都自动回到快照"}
      - id: E4
        text: 发布记录的 Android 侧源文件在构建发布之后被改动时，部署在建快照之前就中止。
      - id: E5
        text: 部署后改动自动生效：变化的系统服务（service_restart）、正在运行的桌面用户服务（user_restart，plasmashell 最后）按规则重启，需要时重启整个会话。没在运行的单元不启动。
        evidence:
          - {doc: docs/97-local-development-deploy.md, date: 2026-09-30, note: "按 user_restart 重启了 rungic-voice-agent、语音浮层和 plasmashell"}
      - id: E6
        text: status 给出手机上的发布、它的 git 提交、与仓库是否一致、rootfs 快照状态和开发覆盖。每次部署在 .work/deploy/<时间>-<版本>/ 留下逐步记录和 result。
      - id: E7
        text: 增量发布装到 Android 侧的文件，与完整镜像的 host seed 路径和权限一致。
      - id: E8
        text: Ubuntu 发布了我们重建或耦合的包的更高版本时，apt 升级（Discover 的更新）和 unattended-upgrades 都保留已装发布的版本：每个发布包按精确版本 pin 在 1001，与耦合包同源的已装兄弟包（plasma-workspace 的私有库）按已装版本 pin，unattended-upgrades 另有按发布生成的精确名单。元包被卸掉后 pin 照样有效。
        evidence:
          - {doc: docs/109-dev-release-channel.md, date: 2026-10-04, note: "G100 S 只读：apt-cache policy 与 apt-get -s dist-upgrade 不动任何发布包；unattended-upgrades 每天运行，从未升级过发布包"}
    pitfalls:
      - text: 经 Wi-Fi 部署整套发布会超过 10 分钟。2026-09-30 一次部署被 590 秒的客户端超时杀掉，只能用 rungic_release.py 自己的函数补完。要放在后台运行，不加超时。
        docs: [docs/96-desktop-recovery-after-apk-restart.md]
      - text: 上一次部署的快照还没 commit 时部署会中止。commit 上一版还是 --snapshot never 由用户决定。
        docs: [.agents/skills/rungic-dev-release/SKILL.md]
      - text: 家目录不随快照回滚，失败部署期间写进 ~/.config 的内容会留下（曾留下 kdeglobals 的 SceneGraphBackend=software，抽屉网格空白）。排查部署后的异常时先看这段时间改过的用户配置。
        docs: [docs/61-delivery-diagnostics-plan.md]
      - text: 建快照的重启仍在跑旧版本，那时的崩溃曾被算进新发布、导致误回滚。验收从安装完成时统计，早于安装的崩溃记为 version null。
        docs: [docs/61-delivery-diagnostics-plan.md]
      - text: 容器里的 unattended-upgrades 是开着的，会把重建包静默换成 Ubuntu 的更高版本。重建、被 divert 和 Qt 私有 ABI 相关的包要在黑名单里。
        docs: [docs/61-delivery-diagnostics-plan.md]
      - text: unattended-upgrades 认 pin（被 pin 的已装版本不算可升级），pin 不在时只剩名单。rungic-plasma-config 带的静态名单漏了后来加入的组件（powerdevil、kwayland、xwayland、flatpak、gst-plugins-base 等）和 plasma-workspace 的私有库，部署因此按发布另写 52rungic-release。
        docs: [docs/109-dev-release-channel.md]
      - text: 耦合包（plasma-workspace）的版本取自出发布时那台手机上装的版本。Ubuntu 的 -updates 索引只留最新版，别的手机要装回这个旧版本时可能已经下载不到，部署会在安装一步失败。
        docs: [docs/109-dev-release-channel.md]
      - text: 仓库保留历史版本供回滚。只靠仓库整体 pin 时，旧版本同样可能成为候选，所以按包写 pin。
        docs: [docs/61-delivery-diagnostics-plan.md]
      - text: 按包回滚到较早的发布需要它的提交：Android 侧文件从发布记录的提交中读取并按 sha256 核对。
        docs: [docs/70-rungic-rebrand.md]
    code:
      - tools/rungic_release.py
      - tools/test_rungic_release.py
      - release/packages.json
      - tools/test_rungic_release_deploy.py
      - tools/test_rungic_release_pins.py
    docs: [docs/61-delivery-diagnostics-plan.md, docs/96-desktop-recovery-after-apk-restart.md, docs/109-dev-release-channel.md]

  - id: delivery.dev-channel
    title: dev 发布渠道：从 main 出发布，装到所有手机
    scenario: delivery.release
    status: live
    platform: linux
    interfaces: []
    summary: rungic_release.py dev 仅从干净的 origin/main 构建含 APK 的 dev 发布，并导出发布包。deploy --all 逐台部署已连接的 Rungic 手机。status --all 为每台手机显示一行状态。用户确认后，发布可上传为 GitHub 预发布。每次部署记录在 release/history.json。
    experience:
      - id: E1
        text: dev 只在 HEAD 等于刚取下来的 origin/main、工作区干净（含未跟踪文件）时才出发布。版本号 YYYYMMDD.N 避开本机仓库、origin 上已发布的 dev-* tag 和 release/history.json 里用过的号。
      - id: E2
        text: dev 先构建发布缺的东西：源码变了的自有包、changelog 版本不在仓库里的上游组件（补丁队列变了却没加 changelog 条目就拒绝）、APK。发布记录 channel dev、提交和 APK 的文件名、versionName、versionCode、sha256，同时写进元包里的 release.json。
      - id: E3
        text: 发布包是一个文件：发布用到的 deb 加索引、APK、Android 侧文件和逐文件 SHA-256 的 manifest。没构建的机器 deploy --from 逐文件核对后导入再部署。同名 deb 内容不同、同一版本号来自别的提交都拒绝，两台机器的构建不会混在一起。
      - id: E4
        text: 部署在容器一侧装好之后装发布的 APK：手机上的 versionCode 更低时 adb install -r（保留数据）、重新打开、等会话就绪，再做验收。结果记在部署记录的 apk 一步。版本不低于发布的不动，--restart never 时不装并记录，没装 APK 的手机不首装。装不上算部署失败，回到快照。
      - id: E5
        text: deploy --all 逐台部署所有连着的、有 Rungic 启动器的手机（每台用自己的 RUNGIC_SERIAL/RUNGIC_TRANSPORT），某台失败或连不上就记下来继续下一台，最后打印汇总表。同一台手机同时走 USB 和 Wi-Fi 只算一次。
      - id: E6
        text: status --all 为每台手机显示一行状态：已装发布、渠道、提交、比 origin/main 落后的提交数、APK 版本和开发覆盖数。该行还显示 apt 是否按发布固定版本，包括未 pin 的包、元包 Protected 状态和 unattended-upgrades 名单。
        evidence:
          - {doc: docs/109-dev-release-channel.md, date: 2026-10-04, note: "G100 S 只读运行：20260930.10 之上 25 个覆盖，落后 195 个提交，APK 2.33/81"}
      - id: E7
        text: publish 默认只输出 gh 命令和发布说明。说明包括上一 dev 发布以来合并的 PR、其他提交、包版本变化、APK 和部署命令。用户确认后，加 --yes 才会在 kevinzhow/Rungic 创建 dev-<版本> 预发布，并附发布包和 APK。
        gap: 还没有对 GitHub 实际执行过：对外发布要用户确认
      - id: E8
        text: 每次部署（成功、失败、中止，以及 deploy --all 里连不上的手机）在 release/history.json 追加一行：版本、提交、渠道、手机序列号、结果、时间，随仓库提交。
    pitfalls:
      - text: 2026-10-04 之前各开发机有自己的 APT 仓库，发布号在不同机器上各自增长。最后一个正式发布是 20260930.10，之后合并的改动只以开发覆盖散落在手机上。dev 渠道之后只从 origin/main 出发布。
        docs: [docs/109-dev-release-channel.md]
      - text: 发布号只能避开已发布（有 tag）的号和已提交的部署记录。两台机器同时出还没发布的 dev 发布仍可能撞号，导入时会因提交不同而拒绝。
        docs: [docs/109-dev-release-channel.md]
      - text: 回滚不会降级 APK：adb install -r 只往高版本装。
        docs: [docs/109-dev-release-channel.md]
      - text: GitHub 预发布会建 tag、对外可见，必须先给用户看 publish 的输出、得到确认。
        docs: [.agents/skills/rungic-dev-release/SKILL.md]
    code:
      - tools/test_rungic_release_channel.py
      - release/history.json
    docs: [docs/109-dev-release-channel.md]

  - id: delivery.rootfs-snapshot
    title: rootfs 快照与整体回滚
    scenario: delivery.release
    status: live
    platform: android
    interfaces: []
    summary: rootfs 使用 /data/adb 下的 ext4 镜像。部署前自动创建 dm-snapshot，失败时合并快照以恢复原状态。用户接受发布后，commit 丢弃快照。
    experience:
      - id: E1
        text: 部署先停容器建快照，重启后等会话稳定再安装。验收失败时自动合并回快照，回滚后发布和 dpkg 状态都是部署前的版本。
        evidence:
          - {doc: docs/61-delivery-diagnostics-plan.md, date: 2026-09-26, note: "§P6 实测"}
      - id: E2
        text: rungic_release.py commit 丢弃快照，rootfs 回到 linear，容器重新启动并就绪。
        evidence:
          - {doc: docs/97-local-development-deploy.md, date: 2026-09-30, note: "用户接受 .10 后 commit"}
      - id: E3
        text: 家目录、崩溃报告目录和本地 APT 仓库放在快照之外，回滚不会丢掉它们。
      - id: E4
        text: 镜像 rootfs 不比目录慢：容器启动到会话就绪 8.2 秒（目录 11.2 秒），读写速度和合成器帧时间在同一水平。
        evidence:
          - {doc: docs/61-delivery-diagnostics-plan.md, date: 2026-09-26}
      - id: E5
        text: 快照回滚后比较内核的 ext4 错误数并跑完整性检查，结果写进部署记录。
    pitfalls:
      - text: 2026-09-27 一次快照回滚没有恢复被重写的块，ext4 出现 76 个目录损坏，根因至今未查明。在查明之前退回优先按包回滚（部署上一个发布）。
        docs: [docs/70-rungic-rebrand.md]
      - text: 回滚测试的副本只改了 LXC= 没改 IMAGES=，在容器运行时把系统镜像第二次读写挂载。测试脚本现在拒绝仍含系统路径的副本，attach 拒绝被别的 dm 设备占用的 loop。
        docs: [docs/70-rungic-rebrand.md]
      - text: toybox losetup 只接受 64 字节以内的路径且默认 autoclear。镜像目录因此移到 /data/adb/rungic-lxc/images/。
        docs: [docs/61-delivery-diagnostics-plan.md, docs/70-rungic-rebrand.md]
      - text: journal 随快照回滚丢失，失败部署要先保存证据包再回滚。
        docs: [docs/61-delivery-diagnostics-plan.md]
      - text: rollback --snapshot 会连开发覆盖一起丢掉。
        docs: [docs/97-local-development-deploy.md]
    code:
      - system/rootfs-image
      - tools/rootfs_rollback_test.sh
      - tools/test_rootfs_image_state.py
    docs: [docs/61-delivery-diagnostics-plan.md]

  - id: delivery.acceptance
    title: 发布后自动验收
    scenario: delivery.release
    status: live
    platform: android
    interfaces: [platform-bridge, kwin-android-host, host-input, camera, audio, codec]
    summary: rungic_acceptance.py 按 release/acceptance.json 在手机上执行自动验收。每次部署运行冒烟验收，发布候选运行完整验收。结果与上一发布比较。
    experience:
      - id: E1
        text: 每次部署后自动跑冒烟验收（会话、单元、新崩溃、显示、输入、相机、空闲抑制、播放、录音），几分钟内给出结果。
        evidence:
          - {doc: docs/61-delivery-diagnostics-plan.md, date: 2026-09-26, note: "8 项约 70 秒"}
          - {doc: docs/94-build-fingerprints.md, date: 2026-09-30, note: "G100 9 项 smoke 全部通过"}
      - id: E2
        text: 失败的场景自动重跑一次，重跑通过的记为 flaky，不算失败。
        evidence:
          - {doc: docs/61-delivery-diagnostics-plan.md, date: 2026-09-26, note: "20260926.12 冒烟 8 项一次通过（无 flaky）"}
      - id: E3
        text: 每个场景结束时恢复它改过的东西（无障碍开关、显示缩放和模式、录下的文件），不留在用户手机上。
      - id: E4
        text: 指标与较早发布的最新报告比较。合成器 paint 或呈现间隔 p95 比上一发布劣化超过 15% 即判失败。
        evidence:
          - {doc: docs/61-delivery-diagnostics-plan.md, date: 2026-09-26, note: "完整验收 15 项全部通过，paint p95 3.802 ms"}
      - id: E5
        text: 部署和验收期间出现已知签名以外的崩溃即失败。安装之前发生的崩溃不算到新发布上。
      - id: E6
        text: 报告写到 .work/acceptance/<发布>/<时间>/report.json，并列出自动结果不能替代的人工项（画质、声学、音画同步、拼音手感、投屏）。
    pitfalls:
      - text: 验收前先看 dumpsys input 的 touchingPointers 为空：一次屏幕右下持续的实体触摸让注入的滑动成了多指手势，快捷设置拉不下来。
        docs: [docs/73-reduce-upstream-changes.md]
      - text: 容器刚启动时第一次 Android 文字输入偶尔大小写错误（CaICUL），原因未确认。输入检查不区分大小写并记录 case_exact。
        docs: [docs/61-delivery-diagnostics-plan.md]
      - text: 会话刚重启时抽屉搜索结果不进 AT-SPI 树，输入检查改用 OCR 读回。前置摄像头冷启动首帧可达数秒，按帧 10 秒超时。
        docs: [docs/61-delivery-diagnostics-plan.md, docs/55-agent-native-debugging.md]
      - text: smoke 会自动附带上一份报告的指标对比，换了机型时数值不能当作性能变化的结论。
        docs: [docs/94-build-fingerprints.md]
    code:
      - tools/rungic_acceptance.py
      - release/acceptance.json
      - tools/tests/test_acceptance_scenarios.py
      - tools/tests/test_acceptance_restore.py
    docs: [docs/61-delivery-diagnostics-plan.md]

  - id: delivery.build-fingerprint
    title: 按输入指纹复用构建
    scenario: delivery.release
    status: live
    platform: linux
    interfaces: []
    summary: build_artifact.py 根据源码内容、依赖、工具、参数和架构计算输入指纹。只有指纹相同才复用缓存，并校验每个产物的摘要。镜像构建用这些检查阻止旧产物混入。
    experience:
      - id: E1
        text: 输入相同就复用缓存。改无关的文档或换输入所在位置不会让组件失效。
      - id: E2
        text: 源码、依赖、工具、参数、目标架构、文件模式或符号链接任何一项变化，都得到新的输入指纹和新的缓存目录。
      - id: E3
        text: 产物损坏、缺记录、构建中输入被改、构建失败时绝不发布或命中缓存。伪造记录、越界输出路径和与固定摘要不符的二进制输入都被拒绝。
      - id: E4
        text: 真实组件第二次调用同一执行器全部命中，输入指纹和产物摘要不变。
        evidence:
          - {doc: docs/94-build-fingerprints.md, date: 2026-09-30, note: "8 个构建阶段，cache-reuse-verification.json"}
    pitfalls:
      - text: 起因是旧投屏 JAR 被混入新镜像（docs/86）。按组件类别决定“强制重编或默认复用”都不可靠，只能按实际输入判断。
        docs: [docs/94-build-fingerprints.md]
      - text: 组合 rootfs/host 的执行器要在 podman unshare 内运行，APT 索引容器要在外层单独执行，不能在该用户命名空间里再起 Podman。
        docs: [docs/94-build-fingerprints.md]
      - text: 记录只说明本地构建一致性，不是签名的供应链证明。rungic_package.py 等直接构建入口还没切到这个执行器。
        docs: [docs/94-build-fingerprints.md]
    code:
      - tools/build_artifact.py
      - tools/tests/test_build_artifact.py
      - tools/apk_manifest_info.py
    docs: [docs/94-build-fingerprints.md]

  # ---------------------------------------------------------------- diagnose
  - id: delivery.agent-diagnostics
    title: Agent 直接调用的诊断工具
    scenario: delivery.diagnose
    status: live
    platform: android
    interfaces: [platform-bridge]
    summary: 项目级 rungic MCP 服务由 rungic_agent_mcp.py 提供。工具支持设备状态、合并日志、崩溃、截图、证据包、完整性、追踪和按控件操作。开发 Agent 通过参数调用，无需手工拼接 adb 引号。
    experience:
      - id: E1
        text: logs 把 Android logcat、容器 journal 和内核日志按墙钟合成一条时间线，三个来源的事件按实际先后返回。
        evidence:
          - {doc: docs/55-agent-native-debugging.md, date: 2026-09-23, note: "P0：三个来源各写一个标记，按先后返回"}
      - id: E2
        text: 已知噪声（bpf-firewall、runuser 会话、binder 释放等）只计数不显示，并注明原因，不让 Agent 每次重新诊断。
        evidence:
          - {doc: docs/55-agent-native-debugging.md, date: 2026-09-23}
      - id: E3
        text: screenshot 约 5 秒取回（设备上写文件再 pull），返回 540px 预览，原图留在 .work/diag。
        evidence:
          - {doc: docs/55-agent-native-debugging.md, date: 2026-09-23, note: "exec-out 方式要 36 秒"}
      - id: E4
        text: snapshot 一次调用把状态、日志窗口、崩溃和截图写进 .work/diag/<时间>-<标签>/ 的证据包。
        evidence:
          - {doc: docs/55-agent-native-debugging.md, date: 2026-09-23, note: "34 秒生成完整证据包"}
      - id: E5
        text: 只读工具不改变设备状态并标为 read-only。改变状态的操作（按控件操作、无障碍开关）单列。
      - id: E6
        text: MCP 客户端经 stdio 能列出并调用全部工具（adb 子进程不吞调用者的 stdin）。
        evidence:
          - {doc: docs/55-agent-native-debugging.md, date: 2026-09-23, note: "列出 9 个工具，逐一调用成功"}
          - {doc: docs/70-rungic-rebrand.md, date: 2026-09-26, note: "改名后新实例列出 21 个工具并调用成功"}
    pitfalls:
      - text: 没给 adb 子进程关闭 stdin 时，adb shell 会吞掉调用者的 stdin，MCP 的 stdio 握手没有响应。统一用 stdin=DEVNULL。
        docs: [docs/55-agent-native-debugging.md]
      - text: .mcp.json 是项目级配置，Claude Code 首次加载时要用户批准。
        docs: [docs/55-agent-native-debugging.md]
      - text: 设备日志可能含网络、账户、剪贴板等隐私，只写本地 .work/，不上传外部服务。
        docs: [docs/55-agent-native-debugging.md]
      - text: 向 Magisk 31.0 守护进程提交可能返回 SQL NULL 的查询会让它退出。工具层要拒绝这类查询。
        docs: [docs/39-magisk-daemon-crash.md, AGENTS.md]
    code:
      - tools/rungic_agent.py
      - tools/rungic_agent_mcp.py
      - .mcp.json
      - tools/tests/test_agent_tools.py
    docs: [docs/55-agent-native-debugging.md]

  - id: delivery.crash-reports
    title: 崩溃报告、归并与符号化
    scenario: delivery.diagnose
    status: live
    platform: linux
    interfaces: []
    summary: 桌面程序崩溃后，系统自动保存回溯、build-id、所属包、发布和签名。用户可以通过 coredumpctl 和 MCP 查看报告。系统按签名归并报告，并在构建机上符号化。
    experience:
      - id: E1
        text: 桌面程序（KDE 的与非 KDE 的）崩溃后自动留下报告和 core，journal 里有一条 err 级记录，coredumpctl list/info/debug 能直接使用。Android 的 core_pattern 和目录不受影响。
        evidence:
          - {doc: docs/55-agent-native-debugging.md, date: 2026-09-23, note: "sleep 与 kalk 的可控 SIGSEGV"}
          - {doc: docs/61-delivery-diagnostics-plan.md, date: 2026-09-26, note: "coredumpctl 读取 kalk 与 sleep 的 core.zst"}
      - id: E2
        text: crash_groups 按签名归并：次数、首次与最近出现时间、所属发布，并能筛出某个发布之后新出现的签名。
        evidence:
          - {doc: docs/61-delivery-diagnostics-plan.md, date: 2026-09-26}
      - id: E3
        text: 符号化在构建机上做：手机只给出报告、映射文件和 core，回溯与签名写回手机。手机不会因此内存耗尽、失去 VPN。
        evidence:
          - {doc: docs/61-delivery-diagnostics-plan.md, date: 2026-09-27, note: "符号化移出手机"}
      - id: E4
        text: 每个签名最多保留 2 个 core，一个循环崩溃不会挤掉其他崩溃的现场。采集服务限 768 MiB 内存。
        evidence:
          - {doc: docs/61-delivery-diagnostics-plan.md, date: 2026-09-26, note: "kaccess 两天 188 次 abort"}
      - id: E5
        text: 持有凭据的服务（语音助手、codex app-server）不产生 core。
        evidence:
          - {doc: docs/61-delivery-diagnostics-plan.md, date: 2026-09-26, note: "子进程 core 上限实测为 0"}
      - id: E6
        text: 早于当前发布安装时间的崩溃记为 version null 并注明 before，不算到新发布上。
    pitfalls:
      - text: 不要装 drkonqi：KCrash 找得到它时改走 DrKonqi 并以 _exit(253) 结束，KDE 程序不再留下 core。确需时同时设 KCRASH_DUMP_ONLY=1。
        docs: [docs/61-delivery-diagnostics-plan.md]
      - text: 在手机上用 gdb 加载桌面程序的调试信息要数 GB，两次让 Android 低内存查杀杀掉了 VPN 和 Plasma APK。手机上的 rungic-crash-symbols 默认拒绝运行。
        docs: [docs/61-delivery-diagnostics-plan.md, docs/73-reduce-upstream-changes.md]
      - text: debuginfod 直连很慢、经代理超时，只作后备。gdb 开启它要用 -iex。
        docs: [docs/55-agent-native-debugging.md, docs/61-delivery-diagnostics-plan.md]
      - text: core 文件名虽是 .gz，实际是未压缩的 core（Android 的 core_pattern 在崩溃进程自己的根目录下解析）。
        docs: [docs/55-agent-native-debugging.md]
    code:
      - tools/rungic_crash_symbolize.py
      - system/diagnostics/rungic-coredump-collect
      - system/diagnostics/rungic-coredump.path
      - system/diagnostics/rungic-coredump.service
      - system/diagnostics/rungic-coredump.tmpfiles
      - system/diagnostics/rungic-crash-symbols
      - system/diagnostics/60-rungic-core.conf
      - tools/tests/test_crash_reports.py
    docs: [docs/61-delivery-diagnostics-plan.md, docs/55-agent-native-debugging.md]

  - id: delivery.trace
    title: 全系统帧追踪
    scenario: delivery.diagnose
    status: live
    platform: android
    interfaces: [kwin-android-host]
    summary: rungic_trace.py 使用 Android perfetto 同时记录 KWin、plasmashell、SurfaceFlinger、宿主 APK 和 Adreno GPU。rungic_trace_report.py 分析各阶段耗时。
    experience:
      - id: E1
        text: 一份追踪里同时看到 KWin 的 Paint→GpuWait→Import 区间、宿主的 queueBuffer 和 SurfaceFlinger 呈现，以及各进程的 CPU 与 GPU 时间。
        evidence:
          - {doc: docs/55-agent-native-debugging.md, date: 2026-09-23, note: "P2 验收"}
      - id: E2
        text: KWin 的 FTrace 标记只在录制期间打开，录完恢复原状态。
      - id: E3
        text: 每次 GPU 提交的执行时间来自 KGSL retire 事件的常开计数器（19.2 MHz），与事件时间差一致。
        evidence:
          - {doc: docs/55-agent-native-debugging.md, date: 2026-09-23, note: "29295 ticks = 1.53 ms"}
    pitfalls:
      - text: 本机是 user 版，perfetto 只接受白名单 ftrace 事件，KGSL 事件被静默忽略。工具另建 tracefs 实例记录它们。
        docs: [docs/55-agent-native-debugging.md]
      - text: Android 把两层 queueBuffer 都记为嵌套的 queueBuffer，直接计数会翻倍，只计外层。
        docs: [docs/55-agent-native-debugging.md]
      - text: 容器有独立 PID 命名空间，perfetto 里的全局 PID 和容器里 pgrep 看到的不同，不代表进程重启。
        docs: [docs/55-agent-native-debugging.md]
      - text: KWin moto6 之前的构建成批写 FTrace 标记，时间戳无效。
        docs: [docs/55-agent-native-debugging.md]
    code:
      - tools/rungic_trace.py
      - tools/rungic_trace_report.py
      - system/diagnostics/sys-kernel-tracing.conf
      - tools/tests/test_trace_markers.py
    docs: [docs/55-agent-native-debugging.md, docs/56-kwin-vulkan-quantification.md]

  - id: delivery.integrity
    title: 完整性与漂移检查
    scenario: delivery.diagnose
    status: live
    platform: linux
    interfaces: []
    summary: rungic-integrity 只读核对 rootfs 与 dpkg、发布元包和本机配置清单是否一致。部署前后各运行一次。MCP 通过 integrity 工具提供同一检查。
    experience:
      - id: E1
        text: 一次只读检查给出 clean、drift 或 development 的结论，并逐项列出：被改或缺失的包文件、本项目的 divert、无主文件、属主与模式异常、本机配置是否在、该启用的单元、用户配置里强制软件渲染的覆盖。
        evidence:
          - {doc: docs/61-delivery-diagnostics-plan.md, date: 2026-09-26, note: "首轮发现 13 个缺失翻译和一个被改的文件，重装后修复"}
      - id: E2
        text: 结果里没有噪声：dpkg 的 path-exclude 规则生效，最小化镜像本来就没装的文件不报。
        evidence:
          - {doc: docs/61-delivery-diagnostics-plan.md, date: 2026-09-26, note: "直接 dpkg --verify 35540 行，过滤后 2 项"}
      - id: E3
        text: 认识开发覆盖：release.dev 列出基线和覆盖，state 为 development，开发覆盖自己写的 apt 文件不算无主文件。
        evidence:
          - {doc: docs/97-local-development-deploy.md, date: 2026-09-30}
      - id: E4
        text: 本机配置与凭据（代理、音频 cookie、账户、API Key）只按路径、属主、权限声明和检查，不保存内容。
    pitfalls:
      - text: 曾发现容器 /、/usr 属 UID 1000 且模式 775，桌面用户等于拿到容器 root（暂存树带着构建者 UID 解包）。ownership 检查就是为此加的。
        docs: [docs/55-agent-native-debugging.md]
      - text: drift 里可能有部署前就存在的项（如不属于任何包的 /usr/lib/rungic-cua/rungic_cua/keyring.py），每次要逐项区分新旧。
        docs: [docs/96-desktop-recovery-after-apk-restart.md, docs/97-local-development-deploy.md]
    code:
      - system/diagnostics/rungic-integrity
      - system/diagnostics/rungic-local-config.json
      - tools/system/tests/integrity_drift.py
    docs: [docs/61-delivery-diagnostics-plan.md]

  - id: delivery.ui-automation
    title: 按控件名操作桌面
