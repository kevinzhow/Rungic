  - id: delivery.probes
    title: 诊断探针
    scenario: delivery.diagnose
    status: live
    platform: linux
    interfaces: [kwin-android-host, audio, camera]
    summary: rungic-plasma-diagnostics 安装一组诊断探针和复现脚本。它们检查 Wayland 协议、输入法、屏幕、文件系统能力和媒体问题。
    experience:
      - id: E1
        text: idle-probe 持有空闲抑制期间手机屏幕保持常亮（冒烟验收 idle.inhibit 用它）。
        device: 屏幕常亮是宿主 APK 把 KWin 经 zwp_idle_inhibitor_v1 转来的空闲抑制变成窗口 FLAG_KEEP_SCREEN_ON 的结果。无头 KWin 没有 Android 后端和屏幕，熄不熄屏只有手机能看出（验收 idle.inhibit）
        evidence:
          - {doc: docs/94-build-fingerprints.md, date: 2026-09-30, note: "9 项 smoke 含空闲抑制"}
      - id: E2
        text: 输入探针只记录提交文字的长度和是否有中文，不记录文字本身。
      - id: E3
        text: rungic-fs-audit 对每个目录跑桌面程序依赖的文件操作，列出哪些不可用、影响哪类程序。必需项失败时退出码为 1。
        evidence:
          - {doc: docs/69-filesystem-capabilities.md, date: 2026-09-25, note: "~/Documents、~/Desktop 两处 24/24"}
      - id: E4
        text: 媒体复现脚本能稳定复现并对照问题：pa-gap 测出 Qt 原版缓冲参数下的播放断点，camerabin-record 测出相机录像被截短。
        device: 复现的是手机上的媒体问题：pa-gap 录 Android 音频桥的 android.monitor，camerabin-record 用 Android 摄像头 rungic.camera.0。断点和截短来自 Android 音频与相机的时序，系统测试容器里没有这些后端
        evidence:
          - {doc: docs/73-reduce-upstream-changes.md, date: 2026-09-27, note: "第一阶段 1.2、1.3"}
    pitfalls:
      - text: 三个 probe 的源码原先只在手机的 /opt 里，2026-09-26 才收进仓库。新探针一开始就放进仓库。
        docs: [docs/61-delivery-diagnostics-plan.md]
      - text: 新增挂载先跑 rungic-fs-audit，问题在挂载层修，不逐个修应用。
        docs: [docs/69-filesystem-capabilities.md]
    code:
      - system/diagnostics/probes/
      - system/diagnostics/wayland-probes/
      - system/diagnostics/media-probes/
      - system/diagnostics/rungic-fs-audit
