  - id: delivery.dev-guide
    title: 开发者与开发 Agent 的项目指引
    scenario: delivery.repository
    status: live
    platform: linux
    interfaces: []
    summary: README（产品主页）、docs/README.md（开发者指南和文档索引）、AGENTS.md（用户要求与工程约定）和 .agents/skills 下的项目技能。
    experience:
      - id: E1
        text: 开发 Agent 进入仓库后可以读取 AGENTS.md 中按日期记录的用户要求和工程约定。Agent 按任务调用 $rungic-three-stage-image 和 $rungic-dev-release 等项目技能。Claude Code 通过 .claude/skills 链接调用技能。
      - id: E2
        text: docs/README.md 的文档索引列出每一篇现有文档。
      - id: E3
        text: README 的产品展示图只用挑选过、缩小、确认不含隐私的成品，原始录像和截图留在 .work/readme/。
    pitfalls:
      - text: docs/README.md 的索引落后：91–104 篇及 research/ 下多篇新文档（共 24 篇）没有列入。
        docs: [docs/README.md]
      - text: 新遇到的失败、修复和实机证据要及时写进对应文档。研究结论、离线校验和实机验收必须分开标注。
        docs: [AGENTS.md]
    code:
      - AGENTS.md
      - README.md
      - .agents/
      - .claude/
      - docs/images/
      - tools/tests/test_dev_guide.py
    docs: [docs/README.md]

  - id: delivery.feature-inventory
    title: 功能清单与质量治理
    scenario: delivery.repository
    status: experimental
    platform: linux
    interfaces: []
    summary: quality/ 记录功能的体验要求、代码、文档和测试。tools/feature_inventory.py 检查引用、文件认领和检查覆盖，并生成 docs/feature-inventory.md。
    experience:
      - id: E1
        text: check 将断裂引用报为错误，包括不存在的文件、未知功能、未知体验和未知接口。它将无人认领的文件、未检查的体验、退役功能残留和被取代的文档报为警告。--strict 按 quality/README.md 的结构性警告和测试欠账规则判定失败。
      - id: E2
        text: owner PATH 说出一个文件归哪些功能，feature ID 列出它的体验、检查、代码和文档。
      - id: E3
        text: 生成的 docs/feature-inventory.md 与数据不一致时 check 失败，提示 render --write。
    pitfalls:
      - text: 测试要在被检查的地方声明 covers，只在真的检查了那条体验时才写。没有测试的体验如实留作未检查或写明 gap。
        docs: [quality/README.md]
    code:
      - quality/
      - tools/feature_inventory.py
      - tools/test_feature_inventory.py
      - docs/feature-inventory.md
    docs: [quality/README.md, docs/105-test-debt-2026-10-03.md]

  - id: delivery.system-tests
    title: 不接手机测试系统功能
    scenario: delivery.try-on-phone
    status: experimental
    platform: linux
    interfaces: [platform-bridge]
    summary: 与 Android 无关的 Linux 功能在 Mac mini 的无头 KWin 中测试。跨系统接口的使用方和提供方分别按同一契约检查。Linux 使用方对着替身检查，Android 提供方在手机上检查。
    experience:
      - id: E1
        text: tools/system_test.py 在 Mac mini 的一次性 arm64 容器里用工作区的代码构建并运行系统测试，不碰手机。结果逐条写进 .work/system-tests/。
        evidence:
          - {doc: quality/README.md, date: 2026-10-03, note: "desktop_mode_fullscreen 4 秒通过；在修复前的 e6693dd 上失败"}
      - id: E2
        text: 接口契约（quality/contracts/）给出每个查询和使用方依赖的回复字段。替身按契约回答并记下请求，同一份契约在手机上核对提供方。
      - id: E3
        text: Linux 程序都经 RUNGIC_PLATFORM_SOCKET 找平台桥，测试可以换成替身。不设时仍是手机上的路径。
    pitfalls:
      - text: 测试 KWin 要 KWIN_WAYLAND_NO_PERMISSION_CHECKS=1 才接受模拟输入，容器要 --cap-add SYS_NICE（kwin_wayland 带文件能力）。Docker 构建上下文要 USTAR 格式的 tar。
        docs: [quality/README.md]
      - text: 在手机上核对提供方的检查只能读不能切换：桌面模式的第一版检查把状态读成空，关掉了用户正在用的桌面。
        docs: [quality/README.md]
    code:
      - tools/system_test.py
      - tools/system/
      - tools/contracts.py
      - quality/contracts/
      - tools/tests/test_contract_*.py   # interface contracts: consumers against stand-ins, the provider check
      - tools/tests/contract_*
      - tools/test_system_test.py
    docs: [quality/README.md]

  - id: delivery.rebrand
    title: Rungic 改名迁移
    scenario: delivery.repository
    status: live
    platform: android
    interfaces: []
    summary: 2026-09-26/27 的改名工具将 moto 迁移为 Rungic。工具包括 rebrand.py 规则替换、用户与系统状态的双向迁移，以及 rungic_cutover.py 的 Android 侧切换。迁移工具仍随会话包发布，回滚到改名前的发布也依赖它们。B、C 阶段已完成，清理残留的 D 阶段尚未执行。
    experience:
      - id: E1
        text: 跨越改名的升级和回滚两个方向都可用：用户设置、目录和单元启用状态迁到新名称，回滚到改名前的发布时迁回，往返后配置逐字节相同。
        evidence:
          - {doc: docs/70-rungic-rebrand.md, date: 2026-09-27, note: "20260926.20 ⇄ 20260927.5"}
      - id: E2
        text: 已安装的包、单元和包名中不再出现 moto 名称（硬件名称和 D 阶段的残留除外）。
        evidence:
          - {doc: docs/70-rungic-rebrand.md, date: 2026-09-27, note: "rebrand.residue 通过；C2 后容器与 Android 侧 0 项失败"}
    pitfalls:
      - text: D 阶段没做：兼容挂载 /var/lib/moto-*、moto-gpu-alloc 链接、投屏厂商 Moto、停用的旧 APK、/data/adb/rungic-cutover、moto-* 的 rc 残留和 /home/linux 链接仍在。rungic_release.py 的 rebrand_down、rungic_device 的旧名回退、rungic-rebrand-user 也要随之删除。
        docs: [docs/70-rungic-rebrand.md]
      - text: rebrand.py apply 只运行过一次。审查时恢复的旧名称会让 list 再次列出那些文件，不能再次 apply。
        docs: [docs/70-rungic-rebrand.md]
    code:
      - tools/rebrand.py
      - tools/rungic_cutover.py
      - tools/test_rebrand_user.py
      - desktop/rebrand-user.py
      - system/rebrand-system.sh
      - lxc/termux-lxc          # rungic_cutover 回滚时装回的旧 Android 侧文件
      - lxc/alpine.config
    docs: [docs/70-rungic-rebrand.md]

