  - id: delivery.repo-scope
    title: 仓库范围、来源记录与开发签名
    scenario: delivery.repository
    status: live
    platform: linux
    interfaces: []
    summary: 私有仓库同步源码、文档、基准数据和来源记录。本地产物放在 .work/，上游来源和校验值记录在 provenance/。开发 APK 签名密钥是唯一随仓库同步的密钥。
    experience:
      - id: E1
        text: 提交前的候选检查用 Git 实际的忽略规则，在临时 Git 目录里列出候选文件，标出敏感文件名、令牌格式、大文件和指向仓库外的链接，只放行指定的开发签名密钥。不改工作区索引。
        evidence:
          - {doc: docs/52-git-repository-scope.md, date: 2026-09-23, note: "约 1031 个候选、17.6 MiB，无发现"}
      - id: E2
        text: 下载、构建产物、日志、截图、实机媒体和其他密钥都在 .work/，被忽略的文件不出现在 .work/ 之外。
      - id: E3
        text: APK 默认用仓库里的开发签名身份签名，换一台机器构建签名不变。
        evidence:
          - {doc: docs/52-git-repository-scope.md, date: 2026-09-30, note: "APK 编译、打包和签名校验通过"}
      - id: E4
        text: 上游来源、版本、校验值和许可证有记录。审计只按精确哈希豁免已核对的上游公开文件。
    pitfalls:
      - text: 2026-09-30 的历史改写改变了所有提交号。发布记录和文档里的旧提交号按 provenance/history-rewrite-20260930/commit-map.txt 查找，不要再推送基于旧历史的分支。
        docs: [docs/52-git-repository-scope.md]
      - text: 候选检查只是有限的模式检查，不表示仓库适合公开：文档里仍有设备身份、本机路径和局域网地址。
        docs: [docs/52-git-repository-scope.md]
      - text: 只有 signing/development/launcher-signing.p12 和 docs/images/readme/ 的成品图是 .work/ 规则的指定例外，其他密钥和原始媒体不入库。
        docs: [AGENTS.md, signing/development/README.md]
    code:
      - tools/audit_git_scope.py
      - provenance/
      - signing/
      - .gitignore
      - .gitattributes
      - tools/test_repo_scope.py
    docs: [docs/52-git-repository-scope.md, docs/53-remote-system-development.md]

