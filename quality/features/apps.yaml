    title: 微信
    scenario: apps.media
    status: live
    platform: linux
    interfaces: []
    summary: arm64 的 Linux 微信能登录、保留聊天数据，通话声音可以交给程序接管。
    experience:
      - id: E1
        text: 打开微信直接进入主界面，不会反复提示“数据库损坏”并修复。
