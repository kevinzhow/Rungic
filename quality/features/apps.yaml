  - id: apps.phone-audio
    title: 应用用手机的扬声器和麦克风
    scenario: apps.media
    status: live
    platform: linux
    interfaces: [audio]
    summary: 所有 Linux 应用共用 PulseAudio 默认设备。默认输出是 Android 的 android，默认输入是手机麦克风 android_microphone。
    experience:
      - id: E1
        text: 默认输出是 android、默认输入是 android_microphone。android.monitor 不会被当作麦克风。
        evidence:
          - {doc: docs/62-linux-virtual-audio.md, date: 2026-09-25, note: "创建虚拟设备后默认设备不变"}
      - id: E2
        text: 播放流进入默认输出，播完后输出重新挂起。播放—空闲—恢复反复多次都能出声。
        evidence:
          - {doc: docs/40-plasma-mobile-integration.md, date: 2026-09-23, note: "10 轮播放—空闲 5 秒—恢复"}
      - id: E3
        text: 只在有应用录音时才打开安卓 AudioRecord，录到非零电平，录音结束后麦克风停止、源挂起。
      - id: E4
        text: Qt Multimedia 应用（KRecorder 等）播放的声音没有周期性插零，与参考 PCM 相关性约 1.0。
        evidence:
          - {doc: docs/48-plasma-media-pipelines.md, date: 2026-09-23, note: "Qt 公共库实际构建样本相关性 0.99999953"}
      - id: E5
        text: 安卓一侧的专用 PulseAudio 卡住后能自动恢复（约 30 秒），持久化的旧 PID 被别的进程复用时不会误杀它。
        gap: 由 system/android-audio 的测试（tools/ci/test_android_audio.py）和 X70 冷启动记录（docs/93）覆盖，归属另一领域
      - id: E6
        text: 录屏、录像的音频支路不会因负的段偏移跳过环形缓冲而丢声。
        gap: 只有录屏验收场景间接覆盖（patch 声明 L3:recording.quicksetting）
    pitfalls:
      - text: Qt 6.10 的 PulseAudio sink 以 1024 帧设 maxlength，转发链路的请求块超过它时每 1024 个样本插入 62 个零。修复在 Qt 公共库，不改录音机。Qt 6.11.2 仍是同样写法。
        docs: [docs/48-plasma-media-pipelines.md]
      - text: PulseAudio 17 的 module-tunnel-sink-new 没有 latency_msec 参数，不能套用旧 tunnel 文档。
        docs: [docs/48-plasma-media-pipelines.md]
      - text: 中文应用名会触发 PA17 JSON exporter 错误。消费者检测用 LC_ALL=C 的 pactl 文本输出。
        docs: [docs/research/33-capture-integration.md]
      - text: 用默认缓冲录音时结束录音进程会丢尾部数据。测量要用 --latency-msec=20。
        docs: [docs/62-linux-virtual-audio.md]
      - text: 物理麦克风是单声道，应用录成双声道不等于立体声采集。没有回声消除、耳机/蓝牙路由与长会议验收。
        docs: [docs/research/33-capture-integration.md]
    code:
      - shared/media/media-bridge.py
      - shared/media/audio-follow.py
      - android/app/src/com/rungic/plasma/CaptureBridge.java
      - android/app/src/com/rungic/plasma/CaptureService.java
      - packages/qt6-multimedia/
      - packages/gst-plugins-base1.0/
      - system/diagnostics/media-probes/pa-gap.py
      - tools/system/tests/media_audio.py
      - tools/system/android_media.py
      - tools/system/build-media.sh
    docs: [docs/48-plasma-media-pipelines.md, docs/research/33-capture-integration.md]

  - id: apps.virtual-audio
    title: Linux 扬声器与 Linux 麦克风（虚拟音频设备）
    scenario: apps.media
    status: live
    platform: linux
    interfaces: [audio]
    summary: 系统提供名称中性的虚拟输出和虚拟麦克风，供程序接收和发送声音。例如助理代接通话或代发语音消息。
    experience:
      - id: E1
        text: 安卓输出出现后才创建 Linux 扬声器、Linux 麦克风。它们不会成为默认设备，落到它们上时立即交还 android / android_microphone。
        evidence:
          - {doc: docs/62-linux-virtual-audio.md, date: 2026-09-25}
      - id: E2
        text: 往“Linux 麦克风输入”播放的声音从 Linux 麦克风无损录回（增益 1）。播到 Linux 扬声器的声音能从其 monitor 录到。
        evidence:
          - {doc: docs/62-linux-virtual-audio.md, date: 2026-09-25, note: "1 kHz 正弦有效值 7069/7071"}
      - id: E3
        text: 虚拟设备创建失败只记警告，安卓麦克风和“手机本机”输出照常工作。
      - id: E4
        text: rungic-audio-route 运行期间把指定程序的流（含之后新建的流）移到虚拟设备，收到 SIGTERM/SIGINT 或标准输入关闭时把每条流移回原设备。第一行输出总是 ready。
        evidence:
          - {doc: docs/62-linux-virtual-audio.md, date: 2026-09-25, note: "代发语音后微信没有残留录音流，默认输入仍为 android_microphone"}
      - id: E5
        text: 代发语音时，应用的录音流没有在 4 秒内移到 Linux 麦克风就不播放、点取消并报错，真麦克风录到的内容不会被发出。
    pitfalls:
      - text: 描述里有空格时整个属性列表要加引号，否则 Module initialization failed。
        docs: [docs/62-linux-virtual-audio.md]
      - text: 首版把虚拟设备创建失败当成音频服务不可用，连带停掉了手机输出。虚拟设备必须与原有设备隔离。
        docs: [docs/62-linux-virtual-audio.md]
      - text: stream-restore 要设 restore_device=false，否则 pactl move 会按应用名记住设备、波及同名的其他应用。
        docs: [docs/62-linux-virtual-audio.md]
      - text: 安卓一侧的 PulseAudio 停掉时隧道 sink android 随之消失，PulseAudio 把默认输出改到 linux_speaker（2026-10-03 系统测试里停掉替身时看到），这段时间应用的声音进了无声的虚拟设备。桥只在创建虚拟设备时交还默认设备，隧道回来后是 PulseAudio 自己切回 android。停掉期间该落到哪里（例如“手机本机”）尚未决定。
        docs: [docs/62-linux-virtual-audio.md]
      - text: 按住说话（hold）的代发语音没在 4 秒内移到 Linux 麦克风时只能松开，而松开就是发送，真麦克风录到的那几秒可能被发出。点按模式会点取消。这类应用怎样取消录音尚未知道。
        docs: [docs/62-linux-virtual-audio.md]
    code:
      - shared/media/media-bridge.py
      - shared/media/audio-route.py
      - tools/tests/test_voice_message_routing.py
      - tools/system/tests/media_audio.py
    docs: [docs/62-linux-virtual-audio.md]

  # ---- 硬件编解码 ---------------------------------------------------------------------------------
  - id: apps.hw-codec
    title: 视频硬件编解码（GStreamer 与 FFmpeg）
    scenario: apps.media
    status: live
    platform: linux
    interfaces: [codec]
    summary: Linux 的 GStreamer 播放器、相机、录屏和私有 FFmpeg 通过 APK 使用 Android MediaCodec（高通 c2.qti）。它们支持 H.264/HEVC 编解码及 VP9 解码，包括 10bit 解码。
    experience:
      - id: E1
        text: playbin3 播放 H.264/HEVC/VP9 时自动选中硬件解码元素（rungich264dec 等，rank PRIMARY+32），seek、暂停/恢复、EOS 正常。
        evidence:
          - {doc: docs/40-plasma-mobile-integration.md, date: 2026-09-23, note: "Showtime 实际播放有画面"}
      - id: E2
        text: 硬件 H.264 编码 90 帧测试图样后，经私有 FFmpeg 的 h264_rungic 解码，帧数、时长、分辨率都对。
        device: 编码由安卓的 c2.qti.avc.encoder 完成（替身不编码），解码用的私有 FFmpeg 只在手机上构建（rungic-codec 的 build 为 device）
      - id: E3
        text: 要求硬件的编码器（rungich264enc、h264_rungic）在拿不到硬件组件时报错，不悄悄换成软件编码。混合编码器 h264_rungic_auto 打开失败时回退软件。
        evidence:
          - {doc: docs/research/35-hardware-codec-integration.md, date: 2026-09-23, note: "Phosh 时期（Alpine）同一份适配代码：私有 FFmpeg 故障注入，混合编码器打开失败回退软件"}
      - id: E4
        text: 带 B 帧的 H.264 解码时间戳正确。seek 后 FLUSH 不会让后续响应错位。
        evidence:
          - {doc: docs/research/35-hardware-codec-integration.md, date: 2026-09-23, note: "Phosh 时期（Alpine）同一份传输代码：带 B 帧 H.264 720p 300 帧；seek 时 FLUSHING 的协议错位已修复"}
      - id: E5
        text: 编码跟不上设定帧率时丢掉编码前的帧而不是积压，停止后收尾在 1 秒内完成。
        evidence:
          - {doc: docs/48-plasma-media-pipelines.md, date: 2026-09-27, note: "录屏收尾 0.29 秒，连续 3 次快捷设置验收通过"}
        device: 编码跟不上取决于手机硬件编码器经宿主桥接的吞吐（约 50 fps），收尾时间也是手机上的时序
      - id: E6
        text: 解码帧留在解码器自己的缓冲里（DMA-BUF，每个缓冲只传一次描述符、只映射一次），APK 里不再复制。GStreamer 直接输出 NV12（下游不接受时 I420），与 FFmpeg 软解逐字节一致。
        evidence:
          - {doc: docs/108-codec-bridge-buffers.md, date: 2026-10-04, note: "G100 S：H.264/HEVC/VP9 1080p 与软解 md5 一致"}
      - id: E7
        text: 10bit 的 HEVC Main10、VP9 Profile 2 由硬件解码，输出 P010，不悄悄压成 8bit。不支持时打开失败，交给软件解码。
        evidence:
          - {doc: docs/108-codec-bridge-buffers.md, date: 2026-10-04, note: "G100 S：HEVC Main10 1080p 与软解 P010 md5 一致"}
      - id: E8
        text: 新的 Linux 端遇到旧 APK（通道版本 1）自动退回共享内存，8bit 照常硬件解码。手机的解码缓冲读不了时同样退回。
        evidence:
          - {doc: docs/108-codec-bridge-buffers.md, date: 2026-10-04, note: "APK 2.30 配新 Linux 端，H.264/HEVC/VP9 与软解 md5 一致"}
      - id: E9
        text: 手机具有高通 msm_vidc 解码节点（/dev/video32）时，解码直接使用 V4L2，不经过 APK。实时 1080p60 约占单核的 23%，MediaCodec 桥约为 105%。1080p 吞吐约 240 帧/秒。节点缺失、显式关闭直通或在 Firefox 沙箱内时，解码仍使用 MediaCodec 桥。
        evidence:
          - {doc: docs/108-codec-bridge-buffers.md, date: 2026-10-04, note: "G100 S 容器内 GStreamer：H.264/HEVC/VP9/Main10 与软解 md5 一致，无固件错误"}
      - id: E10
        text: 手机具有 msm_vidc 编码节点（/dev/video33）时，H.264/HEVC 编码直接使用 V4L2。1080×2400@30 录屏能实时编码，编码约占单核的 2–3%。MediaCodec 桥约占 75% 以上，且无法跟上 30 帧。编码器单独提供参数集，支持强制关键帧，并原样接收 NV12 输入。GPU 执行录屏颜色转换，再将纹理直接写入编码器输入缓冲。KWin 提供 DMA-BUF 画面，全程没有 CPU 拷贝。
        evidence:
          - {doc: docs/108-codec-bridge-buffers.md, date: 2026-10-04, note: "G100 S：录屏快捷设置验收通过（视频+音频），codec.hw 通过"}
          - {doc: docs/108-codec-bridge-buffers.md, date: 2026-10-04, note: "G100 S 零拷贝录屏 864×1920@60：进程约 120%→80%，截帧方向颜色正常，GL 直写与读回编码逐字节一致"}
          - {doc: docs/108-codec-bridge-buffers.md, date: 2026-10-04, note: "G100 S RGBA 纹理在编码器内转换：录屏进程约 80%→49%，与 NV12 路径解码比较亮度 PSNR 91 dB"}
      - id: E11
        text: 用系统 FFmpeg 的应用（mpv/Haruna、VLC、Qt Multimedia、缩略图）默认选中硬件解码器 h264/hevc/vp9_rungic，打不开硬件时回退软件。应用默认的软件编码器不变。
        evidence:
          - {doc: docs/108-codec-bridge-buffers.md, date: 2026-10-04, note: "G100 S：libmpv 选中 h264_rungic，10 秒 1080p60 CPU 17.2 秒降到 3.2 秒"}
      - id: E12
        text: Flatpak 里用 GStreamer 的应用（Freedesktop/GNOME 运行时）经扩展 org.freedesktop.Platform.GStreamer.rungic 用上 V4L2 硬件编解码。没有设备权限的应用照常软件解码。
        evidence:
          - {doc: docs/108-codec-bridge-buffers.md, date: 2026-10-04, note: "G100 S：--device=all 选中 msm_vidc_decoder，--device=dri 回退软件"}
      - id: E13
        text: MediaCodec 桥解码用于 Firefox 和没有 msm_vidc 的手机。解码在 APK 原生线程运行，使用 AMediaCodec 异步回调、AImageReader 和原生 socket。协议与 Java 会话相同，编码仍由 Java 执行。各格式（含 10bit）的解码与软解逐字节一致。APK 中我们自己的代码不到 1%。
        evidence:
          - {doc: docs/108-codec-bridge-buffers.md, date: 2026-10-04, note: "G100 S APK 2.34 同进程交替：实时 1080p60 APK 49%→40%，300 帧 APK CPU 2.24→1.95 秒"}
    pitfalls:
      - text: Mozilla 官方 arm64 Firefox 没有启用 MOZ_ENABLE_V4L2，RDD 的沙箱 broker 拒绝打开 /dev/video*。Firefox 仍走 MediaCodec 桥。沙箱前预开 DMA 堆不解决问题，还会把它交给所有内容进程，不要这么做。
        docs: [docs/108-codec-bridge-buffers.md]
      - text: 安卓宿主的缓冲租借（gpu_allocator.rs）只给 RGBA 顺序（ABGR8888/XBGR8888）。KWin 录屏原来只按输出格式 ARGB8888 要 DMA-BUF，要不到就悄悄退回 memfd，每帧 CPU 读回再上传。补丁 screencast-dmabuf-other-rgb-format 改为换格式再试。
        docs: [docs/108-codec-bridge-buffers.md]
      - text: 编码元素直接用 GLMemory 的纹理 ID 前必须以 GST_MAP_GL 映射。经过直通元素时 GStreamer 推迟上传，纹理是空的（编出几乎不变的画面）。
        docs: [docs/108-codec-bridge-buffers.md]
      - text: 不要在手机上把整段原始视频写进容器 /tmp（3.7 GB tmpfs）或整块读入比较：2026-10-04 因此内存耗尽，VPN 被杀、内核 panic 重启。只抽少量帧，或传回电脑计算。
        docs: [docs/108-codec-bridge-buffers.md]
      - text: NDK 的 AImageReader 按配置格式严格检查缓冲：配成 YCBCR_P010 时会拒收高通解码器自己的 P010（0x7fa30c0a），第二帧起取不到图（Java 的 ImageReader 不拒）。10bit 用 PRIVATE 格式的 reader。
        docs: [docs/108-codec-bridge-buffers.md]
      - text: mpv 默认在主线程解码，硬件解码器的出帧时序抖动让约 10% 的帧在 vo 端被判来晚丢掉（解码速度足够，vd-queue-enable=yes 时为 0）。
        docs: [docs/108-codec-bridge-buffers.md]
      - text: msm_vidc 的 V4L2 编码器必须先开图像（OUTPUT）流、再开码流（CAPTURE），两路都开流后才能排缓冲。先排码流缓冲再送第一张图，固件同样断言复位。
        docs: [docs/108-codec-bridge-buffers.md]
      - text: msm_vidc 的 V4L2 解码只收 DMA-BUF。OUTPUT 开流前排入码流、或 CAPTURE 配好前排入第二个码流单元，会让固件断言并复位整个视频核心（Android 正在用的解码一起中断）。codec-v4l2.c 严格按“开 OUTPUT → 一个单元 → 等 SOURCE_CHANGE → 配 NV12/P010 的 CAPTURE”的顺序，刷新时整段重开。
        docs: [docs/108-codec-bridge-buffers.md]
      - text: 经 APK 的 MediaCodec 桥，CPU 大头是 Codec2 框架和高通编解码服务每帧的消息、binder 和缓冲交接（每帧约 12 ms CPU）。去掉复制、改异步只省了约 10%，实时 1080p60 仍约一个核，吞吐被 Codec2 按码流帧率设定的时钟限在约 83 帧/秒。这是 V4L2 直通的理由，桥只作回退。
        docs: [docs/108-codec-bridge-buffers.md]
      - text: 渲染到 Surface 时高通解码器默认写 UBWC 压缩格式，要设 vendor.qti-ext-dec-forceNonUBWC.value=1。读平面布局不能用 Image.getPlanes()，遇到 UBWC 缓冲框架会直接 abort，连同桌面一起崩溃。
        docs: [docs/108-codec-bridge-buffers.md]
      - text: 解码输入块设成 16 MiB 时，Codec2 每帧映射、解映射一次，光解映射就占 APK 解码线程约 1/5。按分辨率设置。
        docs: [docs/108-codec-bridge-buffers.md]
      - text: 硬件编码经宿主桥接的吞吐约 50 fps：1080×2400@60 单路被拒，两路大分辨率同时编码第二路 CodecException。多屏或 60 fps 时把每路缩到长边 ≤1920。
        docs: [docs/48-plasma-media-pipelines.md]
      - text: Android SharedMemory 可能是 st_size=0 的 ashmem 字符设备，不能只接受普通 memfd。
        docs: [docs/research/35-hardware-codec-integration.md]
      - text: 做成 VA-API 驱动换不掉 FFmpeg 补丁、Snapshot 补丁和 Firefox 预加载（Firefox 的 glxtest 在 KGSL 软件 EGL 设备处就关掉 VA-API），维持现状。VA-API 只能作为另一项新能力单独立项。
        docs: [docs/research/74-vaapi-feasibility.md]
      - text: 上游 Iris 驱动不支持 parrot，也不能和原厂 msm_video 共存。用的是原厂驱动的 V4L2 接口（容器只多映射了 /dev/video32，DMA 堆本来就为 GPU 映射了）。
        docs: [docs/108-codec-bridge-buffers.md, docs/research/34-hardware-codec-audit.md]
      - text: VP8、AV1 在本机只有软件组件，不能宣称硬件编解码。没有 4K（上限 2560×1440）、HDR 显示和 DRM 视频。10bit 只在解码侧。
        docs: [docs/research/34-hardware-codec-audit.md]
      - text: broker 只允许 UID 0/1000，最多 64 条连接、6 个活动 codec，只接受编解码固定命令。
        docs: [docs/research/35-hardware-codec-integration.md]
    code:
      - shared/media/codec-client.c
      - shared/media/codec-client.h
      - shared/media/gst-rungic-codec.c
      - shared/media/ffmpeg-rungic-codec.c
      - android/app/src/com/rungic/plasma/CodecBridge.java
      - android/app/src/com/rungic/plasma/MediaBuffers.java
      - android/app/jni/media/
      - shared/media/codec-v4l2.c
      - shared/media/codec-v4l2.h
      - packaging/rungic-flatpak-codec/
      - packages/ffmpeg-ubuntu/
      - tools/tests/codec_v4l2_driver.c
      - tools/tests/test_codec_v4l2.py
      - tools/tests/test_codec_packaging.py
      - packages/ffmpeg/
      - packaging/rungic-codec/
      - tools/system/tests/media_codec.py
      - tools/tests/test_codec_client.py
      - tools/system/android_media.py
      - tools/system/build-media.sh
    docs:
      - docs/research/34-hardware-codec-audit.md
      - docs/research/35-hardware-codec-integration.md
      - docs/research/74-vaapi-feasibility.md
      - docs/108-codec-bridge-buffers.md

  - id: apps.screen-sharing
    title: 屏幕共享门户
    scenario: apps.media
    status: live
    platform: linux
    interfaces: []
    summary: 网页和会议应用通过 xdg-desktop-portal ScreenCast 请求屏幕共享。用户在权限框选择屏幕，应用通过 PipeWire 流接收画面。
    experience:
      - id: E1
        text: ScreenCast 弹出权限框，用户选屏后三个阶段都返回 Response=0，PipeWire 收到画面帧。
        evidence:
          - {doc: docs/42-plasma-runtime-acceptance.md, date: 2026-09-23, note: "选 WL-0，收到 20 帧"}
      - id: E2
        text: 门户的权限框在手机上不超出屏幕宽度。
        evidence:
          - {doc: docs/42-plasma-runtime-acceptance.md, date: 2026-09-23}
    pitfalls:
      - text: 测试管线必须约束 video/x-raw，不约束时 WirePlumber 判断不了 media.type，造成假失败。
        docs: [docs/42-plasma-runtime-acceptance.md]
      - text: 门户的 desktop 元数据要保留 X-KDE-Wayland-Interfaces，否则 KWin 的受限接口允许列表拒绝它，CreateSession 失败。
        docs: [docs/42-plasma-runtime-acceptance.md]
      - text: 门户后端自己要设 QT_NO_XDG_DESKTOP_PORTAL=1，避免注册时再次激活等待中的门户。
        docs: [docs/42-plasma-runtime-acceptance.md]
      - text: 只验证了标准门户，不代表所有网站各自兼容。
        docs: [docs/40-plasma-mobile-integration.md]
    code:
      - packages/xdg-desktop-portal-kde/
    docs: [docs/42-plasma-runtime-acceptance.md]

  # ---- Firefox ------------------------------------------------------------------------------------
  - id: apps.firefox
    title: Firefox 浏览器
    scenario: apps.web
    status: live
    platform: linux
    interfaces: [camera, audio]
    summary: 浏览器使用 Mozilla 官方 APT 的 Firefox 156，并通过 GPU 运行 WebRender。手机使用 mobile-config-firefox 的移动界面和 Android UA。独立桌面和工作区使用桌面界面。
    experience:
      - id: E1
        text: 手机上 Firefox 是移动版：UA 为 Android 16; Mobile，maxTouchPoints 为 1，网站会跳到移动版（m.bilibili.com）。
        evidence:
          - {doc: docs/research/97-headless-agent-work.md, date: 2026-10-03, note: "§19.8 不设 RUNGIC_WORKSPACE 时"}
      - id: E2
        text: 独立桌面和 Agent 工作区里（RUNGIC_WORKSPACE 非空）不加载移动配置：Linux 桌面 UA、maxTouchPoints 为 0、没有 about:mobile。
        evidence:
          - {doc: docs/research/97-headless-agent-work.md, date: 2026-10-03, note: "§19.8 后台无头实测；界面待用户实测"}
      - id: E3
        text: 屏幕键盘在地址栏输入英文和中文候选都能提交，不崩溃。
        evidence:
          - {doc: docs/40-plasma-mobile-integration.md, date: 2026-09-23}
      - id: E4
        text: WebRender 和 WebGL 1/2 在 FD710 上运行，浏览器内容沙箱保持开启。
        gap: Firefox 156 上 WebRender、WebGL 1/2 与内容沙箱没有当前版本的检查记录（research/30 的结果是 Phosh 时期的 Firefox 154）。要在手机的 FD710 上看，系统测试镜像也没有 Firefox
      - id: E5
        text: 网站经正常授权使用 PipeWire 摄像头和麦克风，同步录制。
        gap: 40 篇（2026-09-23）记有浏览器前后摄、麦克风采集通过，没有记音画同步的录制。要手机的真实摄像头和麦克风，本轮不碰手机
      - id: E6
        text: 浏览器按系统代理联网，界面是中文。
        gap: 40 篇记有 Firefox 156 的中文界面，按系统代理联网只有 Phosh 时期的记录（research/30）。系统测试镜像没有 Firefox，要在手机上核对
    pitfalls:
      - text: 自动化把 focusmanager.testmode=true 留在日常 profile，会让 Firefox 在输入法提交时空指针崩溃。自动化只用独立测试 profile，验收后要核对日常 profile 里没有测试偏好。
        docs: [docs/36-firefox-input-fix.md]
      - text: KGSL 没有 DRM 节点，Firefox 会误判软件显卡。策略里把 gfx.webrender.all 设为可更改的默认 true。
        docs: [docs/research/74-vaapi-feasibility.md]
      - text: 用 RUNGIC_WORKSPACE 判断桌面，不能用 PLASMA_PLATFORM（它会由 startplasma 串进工作区的 systemd 环境）。Firefox 不能在两边同时运行。
        docs: [docs/research/97-headless-agent-work.md]
      - text: 用户在 about:mobile 或 about:config 里改的设置两边都生效。网站记在 cookie 里的移动版可能还会跳。
        docs: [docs/research/97-headless-agent-work.md]
      - text: Firefox 156 的 WebRender 在 Linux 上只有 OpenGL 和软件路径，没有 Vulkan 合成选项。
        docs: [docs/56-kwin-vulkan-quantification.md]
    code:
      - packaging/rungic-firefox/
      - packages/mobile-config-firefox/
      - desktop/firefox-policies.json
      - desktop/mozilla.pref
      - desktop/mozilla.sources
    docs: [docs/36-firefox-input-fix.md]

  - id: apps.firefox-hw-video
    title: Firefox 硬件视频与 WebRTC
    scenario: apps.web
    status: live
    platform: linux
    interfaces: [codec]
    summary: 网页视频、WebCodecs 和 WebRTC 的 H.264 经私有 FFmpeg 用安卓硬件编解码，浏览器沙箱不放宽。
    experience:
      - id: E1
        text: 网页 H.264 / VP9 视频由高通硬件解码播放，seek、暂停正常，内容和 RDD 沙箱保持开启。
        evidence:
          - {doc: docs/40-plasma-mobile-integration.md, date: 2026-09-23}
        device: 网页视频由高通硬件解码，要手机的 MediaCodec。Firefox 156 与私有 FFmpeg 只装在手机上
      - id: E2
        text: WebCodecs（no-preference）H.264 编码再解码，帧数和时间戳完整。
        evidence:
          - {doc: docs/40-plasma-mobile-integration.md, date: 2026-09-23}
        device: WebCodecs 的 H.264 编码用安卓的硬件编码器，要手机的 MediaCodec
      - id: E3
        text: WebRTC 协商 H.264 并使用硬件编码，结束后高通组件释放。
        evidence:
          - {doc: docs/40-plasma-mobile-integration.md, date: 2026-09-23}
        device: WebRTC 的硬件编码与高通组件的释放都在手机的 MediaCodec 上
      - id: E4
        text: 硬件打开失败时编解码回退软件，播放和 WebCodecs 仍可用。
        gap: 回退软件只在 Phosh 时期（Firefox 154、Alpine）做过故障注入（research/35，2026-09-23）。当前的 Firefox 156 与私有 FFmpeg 只装在手机上，系统测试镜像里没有
      - id: E5
        text: MediaRecorder 录 WebM（VP8/Opus）可用。MP4 AVC 如实报告不支持。
        gap: 40 篇（2026-09-23）记有 MediaRecorder WebM 可用、MP4 返回不支持。系统测试镜像没有 Firefox 156，暂无可重复的检查
    pitfalls:
      - text: 只设 LD_LIBRARY_PATH/LD_PRELOAD 不够：部分内容进程从应用目录另行加载发行版 FFmpeg，私有 FFmpeg 的运行库要放进 /usr/lib/firefox。/usr/bin/firefox 被转移为包装入口。
        docs: [docs/research/35-hardware-codec-integration.md]
      - text: 内容/RDD 沙箱禁止新建 codec.sock 连接。包装预加载传输库，在沙箱建立前预连 broker，fork 出的子进程各建一条，不关闭沙箱。
        docs: [docs/research/35-hardware-codec-integration.md, docs/research/74-vaapi-feasibility.md]
      - text: 私有库里把 x264 改名为 libx264_sw，否则 Firefox 按名字直接选 x264、绕过混合编码器。
        docs: [docs/research/35-hardware-codec-integration.md]
      - text: Firefox 日志可能把混合编码器归为 software，判断是否硬件要看 MotoCodec/RungicCodec OPEN c2.qti.* 和实际帧数。
        docs: [docs/research/35-hardware-codec-integration.md]
      - text: WebRTC 短测约 20 fps 发送、13 fps 接收，有丢帧，不能宣称满 30 fps 或长会议已验收。prefer-hardware 分类不支持。
        docs: [docs/research/35-hardware-codec-integration.md]
      - text: 升级 Firefox 或 FFmpeg 后要重新核验包装、私有库 ABI 和偏好。不要沿用早期针对 Firefox main 的远程编码 pref。
        docs: [docs/research/35-hardware-codec-integration.md]
    code:
      - desktop/firefox
      - desktop/firefox-codec-prefs.js
      - packaging/rungic-firefox/
      - shared/media/ffmpeg-rungic-codec.c
    docs: [docs/research/35-hardware-codec-integration.md]

  # ---- 文件 ---------------------------------------------------------------------------------------
  - id: apps.shared-storage
    title: 与安卓共享的文件目录（~/Shared）
    scenario: apps.files
    status: live
    platform: android
    interfaces: []
    summary: Android 内部存储的 Plasma 目录通过 bindfs 挂载为 ~/Shared。下载、图片、视频、音乐、模板和公共目录链接到这里。文档和桌面目录保留在本地。
    experience:
      - id: E1
        text: 新账户第一次登录就有 8 个标准目录：下载、音乐、图片、视频、模板、公共链接到 Shared，文档和桌面是本地目录。重复运行结果不变。
        evidence:
          - {doc: docs/69-filesystem-capabilities.md, date: 2026-09-28, note: "X70 实机 XDG、qtpaths6、GLib 都返回 Pictures"}
      - id: E2
        text: 已有的目录内容、自定义链接和同名文件不会被覆盖或删除。
      - id: E3
        text: 共享存储没挂上时明确失败，不在主目录里造出假目录。
      - id: E4
        text: ~/Shared 上可写共享映射和 SQLite WAL 正常，rungic-fs-audit 的必需项全部通过。
        evidence:
          - {doc: docs/69-filesystem-capabilities.md, date: 2026-09-25}
      - id: E5
        text: 会话启动后标准目录不会被 xdg-user-dirs-update 改回主目录，录屏、截图、下载存到对应目录。
        evidence:
          - {doc: docs/48-plasma-media-pipelines.md, date: 2026-09-24, note: "容器重启后 xdg-user-dir VIDEOS 为 ~/Videos"}
      - id: E6
        text: 安卓一侧改过的文件，Linux 下次打开时就能看到。bindfs 意外退出留下的断开挂载在服务重启时被清掉，不会无限重启。
    pitfalls:
      - text: bindfs 不能带 --direct-io：FUSE 对 direct-io 拒绝可写共享映射，SQLite WAL、LMDB、MMKV 都会 I/O error。
        docs: [docs/69-filesystem-capabilities.md]
      - text: 共享存储不支持符号链接、硬链接、区分大小写、执行、chmod、xattr、Unix 套接字和 FIFO。应用私有数据、数据库、源码仓库和可执行程序放本地目录。
        docs: [docs/69-filesystem-capabilities.md]
      - text: 下载到共享存储的 AppImage 不能直接运行（两层 noexec，安卓 FUSE 存不下执行位），尚未决定。
        docs: [docs/69-filesystem-capabilities.md]
      - text: bindfs 在前台运行时 systemd 会在挂载完成前就判定服务已启动，会话抢先启动导致目录被重置。服务要等挂载点就绪。
        docs: [docs/48-plasma-media-pipelines.md]
      - text: 新增挂载或某个应用只在某目录出问题时，先跑 rungic-fs-audit，结果记入 69 篇。
        docs: [docs/69-filesystem-capabilities.md]
      - text: Documents、Desktop 已改为本地目录，在安卓上不再可见。
        docs: [docs/69-filesystem-capabilities.md]
    code:
      - system/shared-storage
      - system/user-dirs
      - system/diagnostics/rungic-fs-audit
      - tools/tests/test_shared_storage_mount.py
    docs: [docs/69-filesystem-capabilities.md]

