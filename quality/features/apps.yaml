          - {doc: docs/69-filesystem-capabilities.md, date: 2026-09-25, note: "Documents 改为本地目录后重新打开"}
        device: 数据库损坏出在安卓共享存储（MediaProvider 的 FUSE，经 bindfs）上的 SQLite WAL，系统测试没有安卓的 FUSE。Linux 一侧（文档目录在本地、bindfs 不带 direct-io）由 test_user_dirs 与 test_shared_storage_mount 检查
      - id: E2
        text: 微信通话的录音流和播放流可以临时切到 Linux 麦克风和 Linux 扬声器，挂断后回到原设备，不影响其他 Chromium/Electron 应用。
