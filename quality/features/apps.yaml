        docs: [docs/69-filesystem-capabilities.md]
      - text: 微信 4.1 的通话音频在 PulseAudio 里叫通用的 “Chromium”。用 pactl move 会被 stream-restore 按名字记住、波及其他应用，要按 application.process.binary 匹配并用不保存的移动。
        docs: [docs/62-linux-virtual-audio.md]
      - text: 微信包是 arm64 的 .deb，不要按安卓理解成“手机装不了”。
        docs: [docs/59-voice-agent.md]
    code: []
    docs: [docs/69-filesystem-capabilities.md, docs/62-linux-virtual-audio.md]

  # ---- 相机与声音 ---------------------------------------------------------------------------------
  - id: apps.camera
    title: Linux 应用使用手机相机
    scenario: apps.media
    status: live
    platform: linux
    interfaces: [camera]
    summary: 手机前后摄像头以 PipeWire Video/Source 节点提供，名称为 rungic.camera.0/1。PipeWire 应用可以按需使用相机。
    experience:
      - id: E1
        text: 前后两个摄像头节点都能送出画面：有变化的帧、时间戳递增，约 30 fps、720×1280。
        evidence:
          - {doc: docs/48-plasma-media-pipelines.md, date: 2026-09-23, note: "经 PipeWire 后摄节点的 libcamera cam 连续 30 帧，约 30fps"}
      - id: E2
        text: 只在有应用使用时才打开安卓相机，应用停止后节点回到 idle/suspended，相机被释放。
      - id: E3
        text: 离开 Linux 桌面（APK 到后台）时释放相机，安卓 CameraService 里没有活动客户端。回到前台后节点重新出现。
      - id: E4
        text: 节点只暴露已实现的能力（尺寸、自动拍摄）。画面方向随 Android 旋转元数据转正。
    pitfalls:
      - text: 没有 RTKit 的容器里 Realtime portal 返回 RTTimeUSecMax=0，视频客户端的 module-rt 把 RLIMIT_RTTIME 设为 0 后被内核 SIGKILL。视频客户端要 module.rt=false。
        docs: [docs/research/33-capture-integration.md]
      - text: 帧时间戳不能是 -1，否则预览正常但 MP4 没有有效时间戳。源写入收到帧时的 CLOCK_MONOTONIC，不等于传感器曝光时间。
        docs: [docs/research/33-capture-integration.md]
      - text: 一次只占一个物理摄像头。背面贴桌时后摄黑画面是真实输入，不是故障。
        docs: [docs/research/33-capture-integration.md]
      - text: 照片也取自 720p 这一路，不是原厂全分辨率。没有 HDR、多镜头和横屏方向协商。
        docs: [docs/research/33-capture-integration.md, docs/48-plasma-media-pipelines.md]
      - text: WirePlumber 的 libcamera 硬件发现保持禁用，避免与 libcamera virtual 管线反向重复发现。
        docs: [docs/48-plasma-media-pipelines.md]
      - text: 只认 V4L2 的程序不在支持范围内。没有新增 v4l2loopback 或 /dev/video 节点。
        docs: [docs/48-plasma-media-pipelines.md, docs/research/33-capture-integration.md]
    code:
      - shared/media/camera-source.cpp
      - shared/media/media-bridge.py
      - android/app/src/com/rungic/plasma/CaptureBridge.java
      - android/app/src/com/rungic/plasma/CaptureService.java
      - tools/system/tests/media_camera.py
      - tools/system/android_media.py
      - tools/system/build-media.sh
    docs: [docs/research/33-capture-integration.md, docs/48-plasma-media-pipelines.md]

  - id: apps.snapshot
    title: 相机应用 Snapshot 拍照录像
    scenario: apps.media
    status: live
    platform: linux
    interfaces: [camera, codec]
    summary: GNOME Snapshot 51 支持切换前后摄、拍照和录制带声音的视频。启用“硬件编码”时，应用使用 Android H.264 硬件编码器。文件保存到图片和视频目录。
    experience:
      - id: E1
        text: 前后摄可切换，JPEG 照片和带声音的 H.264 录像保存到共享的图片、视频目录。
        evidence:
          - {doc: docs/40-plasma-mobile-integration.md, date: 2026-09-23}
        device: 前后摄、照片和有声录像来自安卓的相机、麦克风与高通编码器
      - id: E2
        text: 开着硬件编码开关时录像实际用 rungich264enc（高通 c2.qti.avc.encoder），关掉时不用它。
        gap: 要构建 Snapshot（Rust，捆绑 Cargo 依赖）并有相机输入，系统测试镜像都没有。开关打开时用高通编码器只有 Phosh 时期的实机记录（research/35，2026-09-23，帧数吻合），关掉时不用它没有记录
      - id: E3
        text: 正常停止的录像能完整解码，音视频时长接近，没有零字节文件。
        gap: 要 Snapshot 与相机、麦克风录一段再解码核对时长，系统测试镜像没有 Snapshot。research/35 只记了两次有声 MP4 的帧数（Phosh 时期）
    pitfalls:
      - text: 录像要先点停止、等保存完，再切回安卓：离开桌面会释放相机，Snapshot 取消录像，中断的文件缺 moov 不能播放。没有后台录像。
        docs: [docs/research/33-capture-integration.md, docs/research/35-hardware-codec-integration.md]
      - text: 安卓相机源不提供自己的管线时钟（provide-clock=false、do-timestamp=true），否则增减音频源时出现 EOS 等待和零字节文件。
        docs: [docs/research/35-hardware-codec-integration.md]
      - text: 第一次前摄拍照曾等待约 14 秒。录像音频编码是软件。
        docs: [docs/40-plasma-mobile-integration.md]
    code:
      - packages/snapshot/
      - packaging/rungic-snapshot/
      - system/diagnostics/media-probes/camerabin-record.py
    docs: [docs/research/35-hardware-codec-integration.md]

