  # ---- 开发与系统工具 -----------------------------------------------------------------------------
  - id: apps.docker
    title: 容器里的 rootless Docker
    scenario: apps.tools
    status: live
    platform: linux
    interfaces: []
    summary: 每个用户可以在容器内运行 rootless Docker 和 Compose，并在设置→服务中开关。容器无需恢复 net_admin 权限，也不改变 Android 网络。
    experience:
      - id: E1
        text: hello-world、镜像已有目录写入、bridge 网络出网、Compose 按服务名互访都能用。
        evidence:
          - {doc: docs/85-lxc-rootless-docker.md, date: 2026-09-28}
        device: rootless Docker 的网络（iptables-legacy、自加 MASQUERADE、slirp4netns 与 TUN）是按手机内核（没有 nftables、xt_addrtype）和 LXC 的设备许可做的。无特权的系统测试容器里 rootlesskit/dockerd 跑不起来，也不代表手机
      - id: E2
        text: -p 发布的端口在容器内和安卓的 127.0.0.1 都能访问。
        evidence:
          - {doc: docs/85-lxc-rootless-docker.md, date: 2026-09-28}
        device: 端口要在安卓的 127.0.0.1 上访问，只有手机有安卓的网络
      - id: E3
        text: 桌面的 /proc/sys 仍只读。rootless 一侧的进程写安卓的网络参数被拒，安卓的转发设置不变。
        evidence:
          - {doc: docs/85-lxc-rootless-docker.md, date: 2026-09-28}
        device: /proc/sys 只读、写安卓网络参数被拒，取决于手机 LXC 的 proc 挂载和与安卓共用的网络命名空间
      - id: E4
        text: 在设置→服务里开启时先确认再弹密码框，密码晚于 25 秒输入也能当场启动。关闭时当场停止，页面状态与实际一致。
        evidence:
          - {doc: docs/85-lxc-rootless-docker.md, date: 2026-09-28, note: "KAuth 超时改为 10 分钟后，37 秒后输入"}
      - id: E5
        text: 开机自动准备 /dev/net/tun、从属 UID/GID 段和按 UID 的数据目录。账户改名后数据不丢、从属 ID 段随之迁移。
        evidence:
          - {doc: docs/85-lxc-rootless-docker.md, date: 2026-09-28}
      - id: E6
        text: rootful 的 docker.service、containerd.service 被屏蔽，不会开机失败。
        evidence:
          - {doc: docs/85-lxc-rootless-docker.md, date: 2026-09-28}
    pitfalls:
      - text: 容器与安卓共用网络命名空间且没有 net_admin/net_raw，rootful Docker 不可用。不要为它把 net_admin 还给整个容器。
        docs: [docs/85-lxc-rootless-docker.md]
      - text: 曾把可写的 /proc/sys/net 绑到整个容器，容器 root 实际能写安卓的网络 sysctl。只能在 rootless Docker 自己的 mount namespace 里绑定。
        docs: [docs/85-lxc-rootless-docker.md]
      - text: 安卓把 memory/cpu 等控制器放在 cgroup v1，Docker 的 --memory 等单容器资源限制不生效。
        docs: [docs/85-lxc-rootless-docker.md]
      - text: 内核没有 nftables 和 xt_addrtype：要 iptables-legacy、--iptables=false 并自己加 MASQUERADE。pasta 端口不可达，用 slirp4netns 加 builtin 端口驱动。不加 --pidns。
        docs: [docs/85-lxc-rootless-docker.md]
      - text: /home 是安卓的 f2fs，overlayfs 不接受，数据目录放在 /var/lib/rungic-docker/<UID>。
        docs: [docs/85-lxc-rootless-docker.md]
      - text: usermod --login 不迁移 /etc/subuid、/etc/subgid 里按登录名记的段，账户改名要另外迁移。
        docs: [docs/85-lxc-rootless-docker.md]
    code:
      - system/docker/
      - packaging/rungic-docker/
      - tools/system/tests/docker_prepare.py
    docs: [docs/85-lxc-rootless-docker.md]

