  - id: apps.system-monitor
    title: 系统监视器里的 GPU 与磁盘
    scenario: apps.tools
    status: live
    platform: linux
    interfaces: []
    summary: 系统监视器和小组件显示 GPU 饼图、曲线和磁盘条。ksystemstats 从 KGSL sysfs 和 mountinfo 读取数据。
    experience:
      - id: E1
        text: 概览和历史页不再提示 “This page is missing some sensors”。
        evidence:
          - {doc: docs/104-system-monitor-gpu-disks.md, date: 2026-10-03, note: "用户打开系统监视器确认"}
        device: 传感器齐不齐取决于手机 KGSL 的 sysfs（gpu_clock_stats、频率、温度）与容器的 mountinfo。补丁里的 kgsltest、mountinfotest 用的是固定样本
      - id: E2
        text: GPU 名称显示 Adreno 710。使用率与 KGSL 的 gpu_clock_stats 增量一致（满载 85–89%，空闲约 0），还有频率和温度。不编造显存和功耗。
        evidence:
          - {doc: docs/104-system-monitor-gpu-disks.md, date: 2026-10-03}
      - id: E3
        text: 磁盘显示“系统”和“主目录”两个卷，容量与 df 一致，读写速率随实际读写变化。同一设备挂多处只算一次。
        evidence:
          - {doc: docs/104-system-monitor-gpu-disks.md, date: 2026-10-03}
      - id: E4
        text: 手机会话和独立桌面（工作区 0）的 ksystemstats 给出相同的传感器和数值。
        evidence:
          - {doc: docs/104-system-monitor-gpu-disks.md, date: 2026-10-03}
        device: 两个会话在手机上读同一块 KGSL 的 sysfs，要在手机上同时看两边
      - id: E5
        text: 只在传感器被订阅时才读 sysfs 和 diskstats，打开概览页时 ksystemstats 的 CPU 不超过单核 1%。
        evidence:
          - {doc: docs/104-system-monitor-gpu-disks.md, date: 2026-10-03, note: "0.85%、0.88%"}
        device: CPU 占用是手机上的性能
    pitfalls:
      - text: 上游 GPU 插件只认 DRM 设备，KGSL 没有 DRM 节点，sysfs 的 card0 是显示控制器。上游 MR !149 的 msm DRM 方案不能直接用。
        docs: [docs/104-system-monitor-gpu-disks.md]
      - text: 不要读 devfreq/gpu_load：读取会重置调频器的统计。gpubusy 按上电时间计，会放大短暂负载，只作后备。
        docs: [docs/104-system-monitor-gpu-disks.md]
      - text: 容器里没有 udev 和 UDisks2，Solid 列不出卷。不要为监视器补整套设备管理，mountinfo 只在 Solid 没有卷时作后备。
        docs: [docs/104-system-monitor-gpu-disks.md]
      - text: 根文件系统镜像本身是 userdata 上的文件，disk/all/total 的物理空间有重叠。没有按进程的 GPU 使用。挂载只在 ksystemstats 启动时读一次。
        docs: [docs/104-system-monitor-gpu-disks.md]
      - text: 补丁里的单元测试（kgsltest、mountinfotest）只在单独的测试构建里跑，Ubuntu 打包关闭了测试。
        docs: [docs/104-system-monitor-gpu-disks.md]
    code:
      - packages/ksystemstats/
    docs: [docs/104-system-monitor-gpu-disks.md]
