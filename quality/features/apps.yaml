area: apps
title: 应用、图形与媒体
summary: 在手机上安装、运行 Linux 应用，并让它们用上手机的 GPU、相机、麦克风、扬声器、硬件编解码和安卓共享存储。
scenarios:
  - id: apps.install
    title: 安装和打开 Linux 应用
    summary: 用 Discover、pkgcli 或 Flatpak 装应用，输入一次系统密码，装好的应用能打开、能用。
  - id: apps.graphics
    title: 用 GPU 画画面的应用
    summary: 浏览器、绘图、3D、聊天和 X11 老程序都在 Adreno GPU 上绘制，不退回 CPU 软件渲染。
  - id: apps.media
    title: 拍照、录像、听和说
    summary: Linux 应用用手机的相机拍照录像，用手机的扬声器和麦克风，视频用硬件编解码，屏幕可以分享给网页或会议。
  - id: apps.web
    title: 上网
    summary: 用 Firefox 浏览网页、看视频、开视频会议，手机上是移动版，桌面里是桌面版。
  - id: apps.files
    title: 文件与安卓互通
    summary: 下载、图片、视频、音乐放在安卓共享存储里，两边都能看到。应用的保存对话框在手机上好用。
  - id: apps.tools
    title: 开发与系统工具
    summary: 在容器里跑 Docker、写代码、看系统监视器里的 CPU、GPU 和磁盘。
features:
  # ---- 安装应用 -----------------------------------------------------------------------------------
  - id: apps.store
    title: 应用商店与 pkgcli 安装应用
    scenario: apps.install
    status: live
    platform: linux
    interfaces: []
    summary: Discover 的 PackageKit APT 后端和 pkgcli 提供 Ubuntu ARM64 应用的搜索、安装和卸载。授权使用系统密码框。
    experience:
      - id: E1
        text: Discover 能显示应用的介绍、版本和安装按钮（AppStream/DEP11 元数据与图标已下载）。
        evidence:
          - {doc: docs/45-plasma-app-store.md, date: 2026-09-23, note: "Plasma Mobile 推荐的 12 个应用都有包并已经同一 PackageKit 后端装上"}
      - id: E2
        text: 从 Discover 用 APT 装应用，同一进程约 5 分钟内只问一次密码（auth_admin_keep），不会每一步都要密码。
        evidence:
          - {doc: docs/45-plasma-app-store.md, date: 2026-09-24, note: "会话挂到 seat0 后 pkcheck 结果"}
      - id: E3
        text: 管理员账户在本地会话里装、卸 Flatpak 应用不用密码，一个应用拆成多个 ref 也不会连问多次。
        evidence:
          - {doc: docs/45-plasma-app-store.md, date: 2026-09-24}
      - id: E4
        text: 卸载 APT 软件包每次都要求密码（上游默认 auth_admin），不会被无密码规则放行。
        evidence:
          - {doc: docs/45-plasma-app-store.md, date: 2026-09-24}
      - id: E5
        text: 系统的定制 Mesa、KWin 等包不会被一次普通的 PackageKit 更新换回发行版版本。
        gap: 只核对过当时的更新清单，没有覆盖第三方源的依赖求解
    pitfalls:
      - text: 会话由服务经 PAM 创建时没有 seat，logind 当它是非本地会话，polkit 对 Discover、Flatpak 一律 auth_admin，每步都要密码。服务里必须有 XDG_SEAT=seat0。
        docs: [docs/45-plasma-app-store.md]
      - text: 带 http_proxy 的 pkgcli 在 LXC attach 上下文会报 “failed to get the session”。批量 CLI 去掉代理环境，下载交给 APT 已配置的代理。
        docs: [docs/45-plasma-app-store.md]
      - text: 用户明确要求真实用户名密码，不要加免密码的 polkit 规则。
        docs: [docs/45-plasma-app-store.md]
      - text: Kalk 的 AppStream 地址是 appstream://org.kde.kalk，带 .desktop 会匹配失败。
        docs: [docs/45-plasma-app-store.md]
      - text: 安装成功不等于功能可用：Angelfish、KClock 定时唤醒、Marble 自动定位等仍各有缺口，要单独验收。
        docs: [docs/45-plasma-app-store.md]
    code: []
    docs: [docs/45-plasma-app-store.md]

  - id: apps.flatpak
    title: Flatpak 应用能装、能在沙箱里运行
    scenario: apps.install
    status: live
    platform: linux
    interfaces: []
    summary: Flatpak 在 LXC 容器内建立 bubblewrap 沙箱。用户可以安装和运行 Flathub 应用。
    experience:
      - id: E1
        text: 从 Discover 装 extra-data 类型的 Flatpak 应用（VS Code）能完整装完，不会在部署应用本体时失败并回滚运行时。
        evidence:
          - {doc: docs/45-plasma-app-store.md, date: 2026-09-24, note: "容器重启后 VS Code 完整安装，flatpak run 出窗口"}
        device: 装应用时 bubblewrap 要在手机的 LXC 容器里建沙箱，成败取决于容器的 proc:mixed 挂载、/proc/sys/user 与安卓内核的用户命名空间。系统测试的 Docker 容器没有这些限制，测不出它们
      - id: E2
        text: 沙箱的防逃逸限制仍然有效：沙箱里写全局 sysctl 被拒，嵌套的 unshare -U 被禁止。
        evidence:
          - {doc: docs/45-plasma-app-store.md, date: 2026-09-24}
        device: 防逃逸限制靠手机 LXC 容器只读的 /proc/sys 与安卓内核的命名空间设置。Docker 测试容器的 /proc 与权限不同，结果不代表手机
      - id: E3
        text: 容器 init 准备沙箱条件失败时只记日志，容器和桌面照常启动。
    pitfalls:
      - text: LXC 的 proc:mixed 把 /proc/sys 挂为只读，bwrap 写 user.max_user_namespaces 失败。只把 /proc/sys/user 重挂可写，其余保持只读。
        docs: [docs/45-plasma-app-store.md]
      - text: 新 PID 命名空间挂 proc 要求有一个完全可见的 proc。LXC 的遮盖挂载让 /proc 不完全可见，要在仅 root 可进的 /run/rungic-proc 另挂一个。
        docs: [docs/45-plasma-app-store.md]
      - text: flatpak 以 root 跑的安装后触发器用 --unshare-net，容器没有 net_admin，会报 loopback RTM_NEWADDR 错误。应用本身不受影响。
        docs: [docs/45-plasma-app-store.md]
      - text: Qt 的 Flatpak 应用看到 AT_SPI_BUS_ADDRESS 就无条件开无障碍桥，Telegram 因此一直提示读屏模式。共享层不接无障碍总线会让 rungic-cua 无法自动化它们，尚未决定。
        docs: [docs/49-plasma-performance.md]
    code:
      - packages/flatpak/
      - tools/system/tests/flatpak_init.py
    docs: [docs/45-plasma-app-store.md]

  # ---- GPU ----------------------------------------------------------------------------------------
  - id: apps.gpu
    title: 应用在手机 GPU 上绘制（OpenGL / GLES）
    scenario: apps.graphics
    status: live
    platform: linux
    interfaces: [kwin-android-host]
    summary: 桌面和原生 Wayland 应用通过本项目的 Mesa 使用 Adreno 710 渲染。Mesa 使用 KGSL 上的 freedreno。Qt Quick 和 GTK 默认使用 GL。
    experience:
      - id: E1
        text: 普通用户的应用拿到的是硬件 GL（渲染器 FD710，GLES 3.2 / GL 4.6），不是 llvmpipe 或 softpipe。
        evidence:
          - {doc: docs/40-plasma-mobile-integration.md, date: 2026-09-23, note: "UID1000 实载 FD710 / GLES3.2"}
          - {doc: docs/research/93-xwayland-kgsl-gpu.md, date: 2026-09-30, note: "Krita 6 原生 Wayland 下渲染器 FD710"}
        device: 渲染器是不是 FD710 取决于手机的 Adreno 710 与 /dev/kgsl-3d0。系统测试容器没有 GPU，只有软件渲染
      - id: E2
        text: Qt Quick 应用和 plasmashell 滚动、切换时没有整屏灰色闪帧（会话默认 QSG_RHI_BACKEND=opengl）。
        evidence:
          - {doc: docs/56-kwin-vulkan-quantification.md, date: 2026-09-26, note: "撤回 Vulkan 后 414 帧逐帧检测无闪屏"}
        device: 整屏灰色闪帧要在手机 GPU 上逐帧检测（docs/56）。会话默认的 GL 设置由 tools/tests/test_gpu_env.py 检查
      - id: E3
        text: 应用抽屉滑动时 Surface 呈现间隔超过 12.6 ms 的比例低于 1%（GLES 合成）。
        evidence:
          - {doc: docs/51-plasma-vulkan-benchmark.md, date: 2026-09-23, note: "GLES 0.57%，Zink 5.06%"}
        device: 呈现间隔是手机 GPU 与安卓刷新下的性能，只能在手机上量
      - id: E4
        text: 系统 Mesa 的包不会被发行版更新覆盖，升级 Mesa 后 KWin 不会因图形复位而中止。
        gap: 只能在手机上换包重启工作区验证。没有自动检查
    pitfalls:
      - text: KGSL 不是 DRM 设备，没有 /dev/dri。所有依赖 drmGetDevice2、DRM 渲染节点或 PCI 信息的路径（Firefox VA-API、wlroots、ksystemstats、Xwayland glamor）都要单独处理，不能伪造 DRM 节点。
        docs: [docs/research/74-vaapi-feasibility.md, docs/research/93-xwayland-kgsl-gpu.md]
      - text: 会话环境 gpu-env 必须带 MESA_LOADER_DRIVER_OVERRIDE=kgsl、FD_KGSL_ENABLE_DMABUF=1，并清掉 LIBGL_ALWAYS_SOFTWARE 和遗留的 QT_QUICK_BACKEND=software。
        docs: [docs/40-plasma-mobile-integration.md]
      - text: 2026-09-26 全局把 Qt Quick 改成 Vulkan 后语音助手整屏灰色闪帧，当天撤回。评估渲染后端必须做逐帧画面检测，不能只看帧间隔和 CPU。
        docs: [docs/56-kwin-vulkan-quantification.md]
      - text: KWin 经 Zink 合成更慢（慢帧 5.06% 对 0.57%），KWin 原生 Vulkan 只省约 0.7–1.5 ms/帧 CPU，不值得维护分支。桌面合成保持 GLES。
        docs: [docs/51-plasma-vulkan-benchmark.md, docs/56-kwin-vulkan-quantification.md]
      - text: Mesa 换到上游 main 的尝试失败：freedreno 一渲染就 GPU hang，工作区 KWin abort。已退回 lfdevs 分支 98f3d622 加 4 个补丁。再试前要先二分定位上游回归。
        docs: [docs/research/94-mesa-base.md]
      - text: lfdevs 分支的 Termux 专用改动（1274 修饰符、dri3_x11_connect 失败也返回成功）是 Flatpak 崩溃和 Xwayland 黑窗的来源，换底座或升级时要逐条核对。
        docs: [docs/research/94-mesa-base.md, docs/49-plasma-performance.md]
      - text: freedreno 的 OpenGL 在 Blender 按物体取数据的路径上出错（物体位置、大小、颜色串位），同一 GPU 的 Turnip 正确。具体出错位置未查明。
        docs: [docs/90-blender-vulkan-incident.md]
      - text: GPU 与 CPU 共用 7.3 GB 内存，EEVEE 一类 GPU 负载要多占约 1 GB，内存吃紧时安卓会按 LOW_MEMORY 结束进程。
        docs: [docs/90-blender-vulkan-incident.md]
      - text: 性能对照要交错执行、每轮重启并确认热状态为 0，不锁频不改温控。Surface 呈现间隔、Qt frameSwapped 与 GPU 执行时间是不同的量，不能混用。
        docs: [docs/51-plasma-vulkan-benchmark.md, desktop/bench/README.md]
    code:
      - packages/mesa/
      - desktop/mesa-meson-options
      - desktop/package-mesa.py
      - desktop/gpu-env
      - desktop/gpu-ahb-probe.c
      - shared/graphics/
      - desktop/bench/
      - desktop/build-shims/
      - tools/build_mesa.py
      - tools/analyze_plasma_gpu.py
      - tools/benchmark_plasma_compositor.py
      - tools/compare_plasma_gpu.py
      - tools/profile_plasma_frames.py
      - tools/kwin_pipeline_run.py
      - tools/compbench_run.py
      - benchmarks/
      - tools/tests/test_gpu_env.py
    docs:
      - docs/51-plasma-vulkan-benchmark.md
      - docs/56-kwin-vulkan-quantification.md
      - docs/research/94-mesa-base.md
      - desktop/bench/README.md
      - benchmarks/README.md

  - id: apps.vulkan
    title: Vulkan 应用（Turnip）
    scenario: apps.graphics
    status: live
    platform: linux
    interfaces: [kwin-android-host]
    summary: Vulkan 应用使用 Adreno 710 上的 Turnip Vulkan 1.4。应用包括 vkcube、Blender Vulkan 视口和选用 Vulkan 的 Qt 程序。
    experience:
      - id: E1
        text: 普通用户的 Vulkan 程序识别到 Turnip Adreno 710（API 1.4，不是 lavapipe），vkcube 经 Wayland WSI 正常显示。
        evidence:
          - {doc: docs/51-plasma-vulkan-benchmark.md, date: 2026-09-23}
        device: Turnip 驱动 Adreno 710 只在手机上有。系统测试容器里只有 lavapipe
      - id: E2
        text: 单个 Qt 程序设 QSG_RHI_BACKEND=vulkan 能用原生 Vulkan 显示，不影响其他应用。
        evidence:
          - {doc: docs/51-plasma-vulkan-benchmark.md, date: 2026-09-23, note: "Kalk"}
        device: 原生 Vulkan 显示要手机的 Turnip 与 KGSL
      - id: E3
        text: Vulkan 窗口在 KGSL 上呈现时没有整屏灰色闪帧。
        gap: 已知 Turnip WSI 在 KGSL 上会闪屏，原因未查（docs/56）。没有修复
    pitfalls:
      - text: Turnip 的 Wayland 呈现在 KGSL 上会闪出整屏灰色帧，可能与 WSI 同步有关，所以桌面和 Qt Quick 默认不用 Vulkan。
        docs: [docs/56-kwin-vulkan-quantification.md]
      - text: zink on Turnip 轻场景有约 10 ms 固定帧开销，超过 120 Hz 帧预算，不作为 GL 的替代。
        docs: [docs/research/94-mesa-base.md]
      - text: 只看 CPU 下降就切 Vulkan 会误判：plasmashell 切 Vulkan 后 GPU 提交合并成大块，曾让 SurfaceFlinger p95 从 16.7 ms 变到 33.4 ms。
        docs: [docs/56-kwin-vulkan-quantification.md]
    code:
      - desktop/gpu-env
    docs: [docs/51-plasma-vulkan-benchmark.md, docs/56-kwin-vulkan-quantification.md]

  - id: apps.xwayland-gpu
    title: X11 应用用 GPU（Xwayland glamor / DRI3）
    scenario: apps.graphics
    status: live
    platform: linux
    interfaces: [kwin-android-host]
    summary: 仅支持 X11 的应用通过 Xwayland 的 glamor 和 DRI3 使用 FD710 渲染，替代 softpipe。应用包括 Qt5、微信、Wine 和老游戏。
    experience:
      - id: E1
        text: Xwayland 提供 DRI3 和 Present，X11 GL 程序 direct rendering 为 Yes、Accelerated yes、渲染器 FD710。
        evidence:
          - {doc: docs/research/93-xwayland-kgsl-gpu.md, date: 2026-09-30, note: "xdpyinfo、glxinfo -B、eglinfo -p x11"}
        device: Xwayland 的补丁只在有 /dev/kgsl-3d0 时走 glamor/DRI3（KGSL 不是 DRM 设备）。系统测试容器没有 KGSL
      - id: E2
        text: X11 GL 窗口画出内容（不是黑窗），两个 GL 程序同时运行时各自内容正确、画面在动。
        evidence:
          - {doc: docs/research/93-xwayland-kgsl-gpu.md, date: 2026-09-30, note: "glxgears 与 glmark2 terrain 同时运行"}
        device: X11 GL 窗口在 KGSL 上导入、呈现缓冲，系统测试容器没有 KGSL
      - id: E3
        text: 纯 2D 的 X11 程序（以 xcb 运行的 Dolphin）由 glamor 绘制，显示正确。
        evidence:
          - {doc: docs/research/93-xwayland-kgsl-gpu.md, date: 2026-09-30}
        device: glamor 在 KGSL 上绘制，系统测试容器没有 KGSL
      - id: E4
        text: X11 下的 GL 性能与原生 Wayland 相当（glmark2 全套分数不低于原生 Wayland）。
        evidence:
          - {doc: docs/research/93-xwayland-kgsl-gpu.md, date: 2026-09-30, note: "X11 GL 218 / GLES 224，原生 193 / 185"}
        device: glmark2 分数是手机 GPU 的性能
      - id: E5
        text: 改变窗口大小、连续运行 30 分钟不卡死、画面不采样到旧内容。
        gap: research/93 列为未做，需实机长时间运行
    pitfalls:
      - text: KWin 的安卓宿主后端只提供 linux-dmabuf v3、没有 wl_drm，上游 Xwayland 因此直接放弃 glamor。补丁在 dmabuf v3 且有 /dev/kgsl-3d0 时用这个节点，跳过 drmGetDevice2 和认证。
        docs: [docs/research/93-xwayland-kgsl-gpu.md]
      - text: Mesa 分支把 LINEAR 写成 1274，gbm_bo_import 不认，DRI3 返回 BadAlloc。Xwayland 补丁里改回 LINEAR。
        docs: [docs/research/93-xwayland-kgsl-gpu.md]
      - text: 分支在 KGSL 上把未标共享的导入缓冲导出时影子复制成新缓冲，Present 翻页交出空缓冲，GL 窗口全黑。Mesa 补丁把导入标为共享。
        docs: [docs/research/93-xwayland-kgsl-gpu.md]
      - text: KGSL 不在 dma-buf reservation 上挂隐式 fence，Xwayland 拿不到有效等待。目前没发现问题，也没专门测过。
        docs: [docs/research/93-xwayland-kgsl-gpu.md]
    code:
      - packages/xwayland/
    docs: [docs/research/93-xwayland-kgsl-gpu.md]

  - id: apps.flatpak-gpu
    title: Flatpak 应用用 GPU
    scenario: apps.graphics
    status: live
    platform: linux
    interfaces: []
    summary: Flatpak 应用通过 GL 扩展 org.freedesktop.Platform.GL.rungic 使用本项目的 Mesa，在 KGSL 上渲染。GPU 不可用时，应用回退到软件渲染，不崩溃。
    experience:
      - id: E1
        text: Freedesktop 25.08 运行时的应用（Telegram、VS Code）用 FD710 绘制，不再是 llvmpipe。
        evidence:
          - {doc: docs/49-plasma-performance.md, date: 2026-09-28, note: "Telegram RHI 探测 FD710；VS Code GPU 进程持有 /dev/kgsl-3d0"}
        device: Flatpak 应用经 GL 扩展用 FD710，要手机的 Adreno 与 KGSL
      - id: E2
        text: 只声明 --device=dri 的应用在沙箱里也能看到 /dev/kgsl-3d0 和 /dev/dma_heap/system，安卓的其他 DMA 堆仍在沙箱外。
        evidence:
          - {doc: docs/49-plasma-performance.md, date: 2026-09-30, note: "Flathub Krita 5.3.3"}
        device: /dev/kgsl-3d0 与安卓的 DMA 堆是手机内核的设备节点，系统测试容器里没有
      - id: E3
        text: 拿不到 KGSL、或 X 服务器没有 DRI3 时，GL 程序退到扩展里的 softpipe 正常启动，不段错误、不卡住。
        evidence:
          - {doc: docs/49-plasma-performance.md, date: 2026-09-30, note: "krita --version 在 --device=dri 与 --nodevice=dri 下都 exit 0"}
      - id: E4
        text: 扩展只在存在时才启用（FLATPAK_GL_DRIVERS=rungic），从 Plasma 启动的 Flatpak 应用都继承它。
        gap: 只有会话环境的实机检查，没有离线测试
    pitfalls:
      - text: 系统 Mesa 链接 Ubuntu 的 glibc 2.43，运行时只有 2.42，不能把系统 Mesa 直接挂进沙箱。扩展要在 freedesktopsdk/sdk:25.08-aarch64 里用同一份补丁源码另行构建。
        docs: [docs/49-plasma-performance.md]
      - text: 扩展只为 25.08 分支构建。系统 Mesa 补丁更新后扩展要跟着重建，否则 X11 Flatpak 应用仍走旧路径（+rungic3 时尚未重建）。
        docs: [docs/49-plasma-performance.md, docs/research/93-xwayland-kgsl-gpu.md]
      - text: 只走 X11 的 Flatpak 应用要真正用上 GPU，还要 Xwayland 有 DRI3。
        docs: [docs/49-plasma-performance.md]
      - text: 不要逐个给应用加 LIBGL_ALWAYS_SOFTWARE 或放宽权限。缺设备就在 flatpak 的设备列表里补。
        docs: [docs/49-plasma-performance.md]
    code:
      - packaging/rungic-flatpak-gl/
      - packages/flatpak/
      - desktop/mesa-meson-options
      - desktop/gpu-env
    docs: [docs/49-plasma-performance.md]

  # ---- 具体应用 -----------------------------------------------------------------------------------
  - id: apps.blender
    title: Blender 渲染与视口
    scenario: apps.graphics
    status: live
    platform: linux
    interfaces: []
    summary: Blender 默认使用 CPU Cycles 渲染，并使用一半核心。编辑视口使用 Vulkan 正确显示。渲染过程中，画面逐步变清晰。
    experience:
      - id: E1
        text: 新场景默认 Cycles CPU，渲染时最多用一半 CPU 线程，脚本设成自动或 8 线程也被限制为 4。
        evidence:
          - {doc: docs/90-blender-vulkan-incident.md, date: 2026-09-29, note: "-b 与 --factory-startup 下 CYCLES CPU FIXED 4，实际占用 4.0 核"}
      - id: E2
        text: 编辑视口（实体、材质预览）里的物体位置、大小、颜色正确：每次以图形界面启动都把 GPU 后端偏好保持为 Vulkan，退出时自动保存的也是 Vulkan。
        evidence:
          - {doc: docs/90-blender-vulkan-incident.md, date: 2026-09-29, note: "关闭旧实例后重开小火箭，加载 libvulkan_freedreno，显示正确"}
        device: 视口画得对不对取决于 Adreno 上 freedreno/Turnip 的绘制，只有手机能看。保持 Vulkan 偏好的逻辑由 tools/tests/test_blender_render.py 检查
      - id: E3
        text: 在 Blender 的 config/rungic-gpu-backend 写 OPENGL 就保留 OpenGL，不被启动模块改掉。
      - id: E4
        text: 在界面里渲染时窗口保持响应，渲染窗口按批次（4、12、28、60 采样）换上预览，最终图与一次渲染无差别。
        evidence:
          - {doc: docs/90-blender-vulkan-incident.md, date: 2026-09-29, note: "第 6、8、13、22 秒出现预览，第 23 秒完成"}
    pitfalls:
      - text: 渲染在 Blender 主线程上时界面必然 Not Responding，这时关窗 KWin 会强制结束 Blender。渲染中不要关闭或结束它。
        docs: [docs/90-blender-vulkan-incident.md]
      - text: 只设一次 Vulkan 偏好会失效：还在用 OpenGL 的旧实例退出时会把 OpenGL 写回偏好。
        docs: [docs/90-blender-vulkan-incident.md]
      - text: “Vulkan 出故障、OpenGL 正常”曾是误判，真正的共同条件是内存吃紧。EEVEE 无论哪个后端都多占约 1 GB 共享内存。
        docs: [docs/90-blender-vulkan-incident.md]
      - text: Blender 5.0 后台合成器的 Denoise 实测不执行，渐进渲染第一版不降噪。Blender 不对外开放渲染中的像素，只能分批渲染。
        docs: [docs/90-blender-vulkan-incident.md]
      - text: Turnip 在 KGSL 上的闪屏可能也影响 Blender 窗口，尚未逐帧检测。
        docs: [docs/90-blender-vulkan-incident.md, docs/56-kwin-vulkan-quantification.md]
    code:
      - system/config/usr/lib/blender/
      - compatibility/entries/blender-cpu-policy.json
      - tools/tests/test_blender_render.py
    docs: [docs/90-blender-vulkan-incident.md]

  - id: apps.krita
    title: Krita 绘画
    scenario: apps.graphics
    status: live
    platform: linux
    interfaces: []
    summary: Ubuntu 的 Krita 6 使用原生 Wayland 和 GPU 渲染，“另存为”可以正常保存。Flathub 的 Krita 5 不再崩溃或卡住。
    experience:
      - id: E1
        text: Krita 6 原生 Wayland 下画布的渲染器是 FD710。
        evidence:
          - {doc: docs/research/93-xwayland-kgsl-gpu.md, date: 2026-09-30}
        device: 画布的渲染器 FD710 是手机的 GPU
      - id: E2
        text: 经门户“另存为”保存后文件写出，菜单和工具栏照常可点，不会被看不见的空壳对话框挡住。
        evidence:
          - {doc: docs/103-krita-save-dialog-hang.md, date: 2026-10-01, note: "工作区 1 端到端：门户与进程内对话框两条路径"}
      - id: E3
        text: Flathub Krita 5.3.3（只有 --device=dri）去掉 LIBGL_ALWAYS_SOFTWARE 也能启动，不段错误、不卡住。
        evidence:
          - {doc: docs/49-plasma-performance.md, date: 2026-09-30}
        device: 只声明 --device=dri 的 Krita 能否用上 KGSL、不段错误，取决于手机的 /dev/kgsl-3d0 与 GL 扩展
      - id: E4
        text: Flathub Krita 5（X11）画布用 GPU 绘制，不卡顿。
        gap: Flatpak GL 扩展还没用 +rungic3 重建，X11 Flatpak 应用 GPU 未验收（research/93）
    pitfalls:
      - text: Krita 在建 KisApplication 前用临时 QGuiApplication 探测 OpenGL。startplasmamobile 写死的 QT_QPA_PLATFORMTHEME=KDE 让 KDE 主题在临时应用里连上会话总线，恢复派发随临时应用一起被删，会话总线永久暂停，门户的 Response 信号收不到。
        docs: [docs/103-krita-save-dialog-hang.md]
      - text: 缺陷本身在 Qt（恢复派发挂在连接时的 qApp 上），上游未改。本项目改环境不改应用，Qt 补丁暂不做。
        docs: [docs/103-krita-save-dialog-hang.md]
    code: []
    docs: [docs/103-krita-save-dialog-hang.md]

