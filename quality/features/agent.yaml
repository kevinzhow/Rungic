  - id: agent.plan-two
    title: 方案二：无障碍树 + OCR + JEV 操作桌面
    scenario: agent.desktop-work
    status: experimental
    platform: linux
    interfaces: [ocr]
    summary: rungic-cua plan atspi 提供备用电脑操作方案。它读取应用无障碍树和手机 GPU OCR 结果，由 TypeSafe JEV 逐步选择控件。该方案也支持按读音找人。
    experience:
      - id: E1
        text: rungic-cua plan atspi 切换后，工具换成 desktop_observe、desktop_run、desktop_find_name 和 JEV 版的 desktop_goal。切回 luna 恢复（重启语音服务后生效）。
      - id: E2
        text: OCR 在手机 GPU 上识别整屏约 0.5 s（PP-OCRv6 Small，fp16）。模型还没下载好或 GPU 不可用时立即改用容器 CPU 上的 RapidOCR（约 2 s），不卡住。
        evidence:
          - {doc: docs/64-goal-computer-use.md, date: 2026-09-25, note: "det 640² 57 ms，整屏约 0.5 s"}
        device: 整屏约 0.5 s 是手机 Adreno GPU 上 LiteRT 的速度，OCR 在安卓应用里运行，系统测试里没有这块 GPU。CPU 约 2 s 也取决于手机 CPU
      - id: E3
        text: OCR 模型在第一次请求时由 Rungic 应用后台下载，按固定的地址和 SHA-256 校验。下载完成前请求立即返回错误。
        gap: 模型下载和 SHA-256 校验在 Rungic 应用的 OcrBridge.java 里，没有 Android 侧的离线测试，也没有实机记录。Linux 一侧收到“下载中”后立即改用 CPU 已由 tools/tests/test_cua_tools.py 检查（E2）
      - id: E4
        text: 语音识别写错的人名按读音找：同音得 1.0、近音 0.9，按分区标题区分联系人和搜索建议。两个不同的人都达到 0.9 时先问用户。
        evidence:
          - {doc: docs/60-computer-use.md, date: 2026-09-25, note: "find-name 周凯文 1.2 s，周楷雯 1.0"}
      - id: E5
        text: 一次观察约 0.5–1 s。控件坐标按窗口根节点换算，应用的错误窗口坐标（微信内置 Qt）和阴影边距不影响点击。
        evidence:
          - {doc: docs/60-computer-use.md, date: 2026-09-25, note: "微信子任务 2 步 7.2 s"}
        device: 一次观察 0.5–1 s 是手机上 AT-SPI 往返的耗时（每个属性约 50 ms，取决于手机和应用）。微信内置 Qt 的错误窗口坐标只有真实微信能复现，测试里是按其症状做的替身
    pitfalls:
      - text: Qt 没有实现 AT-SPI 缓存和 GetAll，逐个属性查询每个节点约 50 ms。改为同一层的请求一次发出。
        docs: [docs/60-computer-use.md]
      - text: 本机 Hexagon CDSP 关闭、没有 NNAPI，能用的加速器只有 Adreno（OpenCL）。模型卡称 fp16 下部分张量用例不过，请求可带 fp32。
        docs: [docs/64-goal-computer-use.md]
      - text: 需要 TypeSafe JEV 的 key。写手模型生成输入文字约 7–8 s。滚动固定在窗口中心，多窗格应用会滚错区域。
        docs: [docs/64-goal-computer-use.md]
      - text: 上游测试会清掉 CLICKER_PLATFORM，测试永远不会操作本机。Linux 适配器只在启动器设置该变量时启用。
        docs: [docs/64-goal-computer-use.md]
      - text: 60、64 篇里的 vendor/、plasma/native-apk 等路径已不存在，现为 packages/ 配方和 android/app/jni/ocr。
        docs: [docs/60-computer-use.md, docs/64-goal-computer-use.md]
    code:
      - agent/computer-use/rungic-clicker
      - agent/computer-use/rungic_clicker.py
      - agent/computer-use/typesafe/
      - agent/computer-use/rungic_cua/a11y.py
      - agent/computer-use/rungic_cua/backend.py
