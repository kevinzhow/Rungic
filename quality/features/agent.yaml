  # ---- 打电话、发语音 -----------------------------------------------------------------------------
  - id: agent.call-card
    title: 通话入口与通话卡片
    scenario: agent.calls
    status: experimental
    platform: linux
    summary: 用户说“打电话”时，Agent 使用手机卡。用户说“打微信电话”时，Agent 使用微信。每通电话有一张卡片，保留在发起通话的对话中。用户可以旁听、发送文字指示、接管或挂断。
    experience:
      - id: E1
        text: 通道由用户的说法决定：没说就不默认微信，指定的通道不可用时不自动换另一种。参数冲突在建立通话前就拒绝，不拨号。
      - id: E2
        text: 能力查询只读：报告账户、音频接口和应用路由前提。“接口可用”和“端到端已验证”分开显示，连不上的记为未知而不是不支持。
      - id: E3
        text: 每通电话一张卡，留在发起它的对话里：状态、转写、错误、文字指示、接管、挂断和结果。切到别的对话再回来还是同一张卡，计时从实际接通开始。
        evidence:
          - {doc: docs/research/cellular-call-agent.md, date: 2026-09-29, note: "第三次 10000 实验：切换对话后 call ID 与 connectedAt 不变"}
      - id: E4
        text: 旧卡片不能控制下一通电话，迟到的旧通话事件不会暂停新通话或在别的对话里播报。
      - id: E5
        text: 离开助理后，屏幕上的微缩通话条显示对象、通话状态和挂断按钮，不挡住其他应用的操作。
        evidence:
          - {doc: docs/research/cellular-call-agent.md, date: 2026-09-29, note: "微缩条显示与条外点击；拖动、接管未完成"}
    pitfalls:
      - text: 卡片转写的 delegate 曾把 text 同时用作模型角色和富文本输出，记录存在但屏幕留空。
        docs: [docs/research/cellular-call-agent.md]
      - text: 微信的早期验收不能推广到手机卡或其他应用。
        docs: [docs/63-call-proxy.md]
    code:
      - agent/assistant/call_backends.py
      - agent/assistant/skills/rungic-phone-desktop/calls.md
      - agent/assistant/app/qml/ChatEntry.qml
      - agent/assistant/app/qml/AssistantOverlay.qml
      - tools/tests/test_call_backends.py
      - tools/tests/test_call_cards.py
      - tools/tests/test_call_conversations.py
    docs: [docs/63-call-proxy.md, docs/research/cellular-call-agent.md, docs/agent-ready-interfaces.md]

  - id: agent.call-proxy
    title: 代打微信电话
    scenario: agent.calls
    status: experimental
    platform: linux
    interfaces: [audio]
    summary: 通话助理接收对方的声音，并作为对方听到的“麦克风”发声。助理开场说明自己是 AI。涉及约定或钱时，助理先询问用户。用户可以随时旁听或接管。
    experience:
      - id: E1
        text: 拨号前先核对聊天顶部就是这个联系人，否则什么都不按。以微信打开通话音频为拨出的依据，没拨出就如实报告。
      - id: E2
        text: 接通以通话窗口里出现走动的计时为准，彩铃和回铃音得不到回应。确认后约 2 秒开口。开场白播完前不被对方的“嗯”打断。
        evidence:
          - {doc: docs/63-call-proxy.md, date: 2026-09-25, note: "15:44 接通后约 2.3 s 播放开场白"}
      - id: E3
        text: 涉及约定、答应事情和钱时先问用户：对方原话转给用户，同一句只问一次，用户答复后再转达。挂断前要求对方在用户答复之后又说过话。
        evidence:
          - {doc: docs/63-call-proxy.md, date: 2026-09-25, note: "合成“对方”的离线流程：问用户、转达、道别、挂断并摘要"}
      - id: E4
        text: 点“我来接”后微信的声音切到手机本机的扬声器和麦克风，语音助手暂停，挂断后自动恢复。
        evidence:
          - {doc: docs/63-call-proxy.md, date: 2026-09-25, note: "只单独测了路由切换"}
      - id: E5
        text: 挂断时助理立即静音，在通话窗口里点挂断最多 3 次，以通话音频关闭为准。都失败时卡片提示去微信里挂断，并把通话转到手机本机。
      - id: E6
        text: 通话期间主助理不播报进度和长汇报，只有通话助理向用户的提问出声。结束后用一两句汇报结果。
    pitfalls:
      - text: PulseAudio 的 module-stream-restore 按应用名记住路由，微信通话流叫通用的“Chromium”，此后普通微信通话也会没声。改为 restore_device=false。
        docs: [docs/63-call-proxy.md]
      - text: convergentwindows 曾把微信的竖向通话窗口当成手机尺寸的窗口放大，黑边加挂断按钮被挡。只放大应用的第一个窗口。
        docs: [docs/63-call-proxy.md]
      - text: 测试时不要预设挂断：两次在用户已接听时挂断，对方突然没声。
        docs: [docs/63-call-proxy.md]
      - text: 通话中说什么、何时问用户、何时结束由 TypeSafe JEV 判断，没有它的 key 时没有完整的自主决策替代。
        docs: [docs/63-call-proxy.md, docs/research/cellular-call-agent.md]
      - text: 用户在自己会话里登录的微信不在 Agent 工作区里。微信相关操作在微信当前所在的会话里执行。
        docs: [docs/research/91-agent-workspaces.md]
    code:
      - agent/assistant/call_proxy.py
      - tools/tests/test_call_proxy.py
      - tools/tests/test_call_hang_up.py
    docs: [docs/63-call-proxy.md]

  - id: agent.cellular-call
    title: 代打手机电话（SIM）
    scenario: agent.calls
    status: experimental
    platform: android
    interfaces: [telephony]
    summary: Android Telecom 负责拨号。系统通话上行将 Agent 的声音发送给对方，下行提供对方的声音。手机卡通话复用同一个通话助理和卡片。
    experience:
      - id: E1
        text: 拨号前先建立实时会话，就绪前用户取消就不拨。响铃和彩铃期间不打开 Agent 的音频。
      - id: E2
        text: 对方能听懂 Agent 说的话。对方的声音传给 Agent。整个过程中系统静音保持，用户房间里的声音不会混进通话。
        evidence:
          - {doc: docs/research/cellular-call-agent.md, date: 2026-09-29, note: "第四次 10000 实验：说出“湖南电信”后远端进入业务菜单（仅 G100）"}
      - id: E3
        text: 点“我来接”保持原电话，释放 Agent 音频并恢复原静音状态。重复接管没有副作用。丢了 call ID 只交回、不重拨。
        evidence:
          - {doc: docs/research/cellular-call-agent.md, date: 2026-09-29, note: "原 call ID 仍 ACTIVE，静音恢复 false"}
      - id: E4
        text: 挂断以 Telecom 回到空闲为准（正在挂断 → 通话结束），不把控制请求当作挂断确认，结束后没有残留通话。
        evidence:
          - {doc: docs/research/cellular-call-agent.md, date: 2026-09-29, note: "calls=[]、phoneState/audioMode=0"}
          - {doc: docs/106-codex-desktop-operation.md, date: 2026-10-03, note: "10000 实际 connected 后 hang-up，call-ended，phoneState=0、calls=[]；不宣称双向音频通过"}
      - id: E5
        text: 通话音频握手不丢第一段 PCM，错误不会被当成音频播放，取消握手干净退出，打断时丢弃还没说出的音频。
      - id: E6
        text: 通话卡片或界面出错时，正在进行的通话和它的音频照常继续。
    pitfalls:
      - text: 系统通话音频拦截是隐藏 API（CALL_AUDIO_INTERCEPTION），能力查询返回 true 也不是双向通话验收。CALL_ASSISTANT 重定向在本机进 voice_tx 却没有远端响应，改用 VOICE_COMMUNICATION 加显式的 TELEPHONY 输出（INCALL_MUSIC）。
        docs: [docs/research/cellular-call-agent.md]
      - text: 只在 G100（portov_cn）上验证过。G100 S 没插 SIM，没做通话验收。不能推广到其他机型或运营商。
        docs: [docs/research/cellular-call-agent.md]
      - text: 不能为了让对方听到而解除静音，那会把用户房间的声音混进通话。旧 Qualcomm HAL 的静音行为只是线索，不是本机证据。
        docs: [docs/research/cellular-call-agent.md]
      - text: 自动开场可能打断语音菜单，对“保持安静”等指示可能多说一句。私下语音指令和独立旁听仍关闭。
        docs: [docs/research/cellular-call-agent.md]
      - text: 受限沙箱里 socket 测试被拒不是代码回归。Magisk root 上下文的 pm install 会遇到 Binder 失败，要在 Android shell 上下文安装。
        docs: [docs/research/cellular-call-agent.md]
    code:
      - agent/assistant/cellular_audio.py
      - agent/assistant/cellular_call.py
      - system/android-calls
      - android/app/src/com/rungic/telephony/
      - tools/tests/test_cellular_audio.py
      - tools/tests/test_cellular_state.py
    docs: [docs/research/cellular-call-agent.md, docs/63-call-proxy.md, docs/106-codex-desktop-operation.md]

  - id: agent.voice-message
    title: 代发语音消息
    scenario: agent.calls
    status: experimental
    platform: linux
    summary: Agent 在聊天应用里找到录音按钮，把合成的语音经虚拟麦克风录进去再发送。
    experience:
      - id: E1
        text: 录音以音频路由报告“应用开始录音”为准再播放语音，语音播完才点发送。前后留白合计约 1 秒多，不发出空的或截断的语音。
        evidence:
          - {doc: docs/68-luna-computer-use.md, date: 2026-09-25, note: "文件传输助手：6.7 s 语音成为 8 秒消息，留白约 1.3 s"}
      - id: E2
        text: 只点真正的录音按钮，不点“语音输入/听写”（它会把语音转成文字发出去）。
        gap: 录音按钮与“语音输入/听写”都会让应用经 Linux 麦克风录音，程序侧分不出。只靠当前执行模型看屏幕选对控件，需要真实模型在微信文件传输助手里验证，尚无记录
      - id: E3
        text: 发送前先经用户确认。
        gap: 发送前确认由 Agent 按 prompts/agent.md 执行，工具本身不拦截。离线没有真实模型无法检查，也还没有实机记录
    pitfalls:
      - text: 找发送按钮的模型调用曾排在语音播完之后，结尾多出约 9 秒静音。改为录音一开始就并行去找。
        docs: [docs/68-luna-computer-use.md]
      - text: 测试不要打扰真实联系人，用文件传输助手。
        docs: [docs/68-luna-computer-use.md]
    code:
      - agent/computer-use/rungic_cua/speech.py
      - agent/computer-use/voice-recording.cpp
      - tools/tests/test_voice_recording_native.py
      - tools/system/tests/voice_recording.py
      - agent/computer-use/rungic_cua/server.py
      - tools/tests/test_voice_message.py
    docs: [docs/68-luna-computer-use.md, docs/106-codex-desktop-operation.md]

  # ---- 主动照看 -----------------------------------------------------------------------------------
  - id: agent.care-ledger
    title: 问题记录与择机提醒
    scenario: agent.care
    status: live
    platform: linux
    summary: 系统记录崩溃、服务失败、存储不足、软件包问题和适配缺口。同一问题只保留一条记录。用户可以稍后处理、约定提醒时间或关闭提醒。
    experience:
      - id: E1
        text: 同一问题重复出现只更新原来那条记录，不新建、不重复提醒。同包同版本的崩溃可以合成一组展示，但各自的记录、调查和提醒保持独立。
        evidence:
          - {doc: docs/research/proactive-system-care.md, date: 2026-09-30, note: "两条真实历史崩溃显示为一个堆叠，打开为两条独立调查"}
      - id: E2
        text: “稍后”和约定的提醒跨重启保留。到时先复核问题是否仍在，再按系统通知设置提醒。提醒不会自动开始修复。错过的最多补发一次。
        evidence:
          - {doc: docs/research/proactive-system-care.md, date: 2026-09-30, note: "计算器在前台时到时通知真实出现，点开进入对应事项"}
      - id: E3
        text: “不再提醒”在问题重复出现、次数增加时仍然保持，用户可以恢复。
      - id: E4
        text: 普通的优化机会不在使用应用期间弹出。每条记录只在有意义的新进展时提醒一次，已展示过的同一进展离开桌面后不再通知。证据过期就不提醒。
        evidence:
          - {doc: docs/research/proactive-system-care.md, date: 2026-09-30, note: "20260930.10 只有进入视口的卡获得回执"}
      - id: E5
        text: 上游合入或调查完成都不等于本机问题解决。问题消失只表示观测不再匹配，再出现时重新打开并保留原证据。
      - id: E6
        text: 账本损坏时不覆盖。旧格式升级前先备份，保留用户的选择、对话和结果。
        evidence:
          - {doc: docs/research/proactive-system-care.md, date: 2026-09-30, note: "schema 1 已备份并迁移，旧结果和对话保留"}
      - id: E7
        text: 不把进程名当作应用实例：没有“应用关闭后提醒”这一项，服务也拒绝它。
      - id: E8
        text: 后台采集占用很小（服务约 13 MiB，单次采集 CPU 约 0.2 s），不在手机上自动编译、符号化或跑重负载探针。
        evidence:
          - {doc: docs/research/proactive-system-care.md, date: 2026-09-30, note: "RSS 约 12.6 MiB，单次 root 采集约 172 ms"}
        device: 常驻内存和单次采集的 CPU 时间取决于手机上真实的崩溃记录、软件包数量和 CPU，容器里量出的数不代表手机。采集器只调用 dpkg-query、dpkg --audit 和 systemctl --failed（collector.cpp）
    pitfalls:
      - text: 日志里的 error 只是线索。SIGKILL、无响应和没有 core 都不能单独推出崩溃原因。Blender 的 CPU 渲染是用户选的策略，不能提示“修复为 GPU”。
        docs: [docs/research/proactive-system-care.md]
      - text: 当前探针不覆盖 Android LMK、逐应用的 GPU/编解码实际使用和通话状态。通知只在 Plasma 里，Android 侧收不到。
        docs: [docs/research/proactive-system-care.md, docs/research/97-headless-agent-work.md]
      - text: 部署工具不会自动重启 rungic-suggestions 和 plasmashell，QML 或服务更新后要手动重启。默认冒烟包含摄像头探针，桌面验收要显式排除。
        docs: [docs/research/proactive-system-care.md]
      - text: 迟到的旧 ID 回执曾经由非 const 的 QJsonObject::operator[] 插入空记录。读取统一用 value()。
        docs: [docs/research/proactive-system-care.md]
    code:
      - agent/suggestions/CMakeLists.txt
      - agent/suggestions/main.cpp
      - agent/suggestions/service.cpp
      - agent/suggestions/service.h
      - agent/suggestions/model.cpp
      - agent/suggestions/model.h
      - agent/suggestions/collector.cpp
      - agent/suggestions/collector.h
      - agent/suggestions/client.cpp
      - agent/suggestions/client.h
      - agent/suggestions/com.rungic.Suggestions.service
      - agent/suggestions/rungic-suggestions.service
      - agent/suggestions/rungic-suggestions-collect.service
      - agent/suggestions/rungic-suggestions-collect.timer
      - agent/suggestions/po/
      - agent/suggestions/tests.cpp
      - packaging/rungic-suggestions/
      - tools/test_suggestions_integration.py
    docs: [docs/research/proactive-system-care.md, docs/agent-ready-interfaces.md]

  - id: agent.briefing
    title: 主屏上的 Agent 建议卡
    scenario: agent.care
    status: live
    platform: linux
    summary: Folio 主屏上方的原生小组件显示 Agent 整理出的少量卡片。每次显示一张，用户上下滑动查看下一张。点击卡片进入对话，由 Agent 逐项介绍。
    experience:
      - id: E1
        text: 小组件一次显示一张卡（最多 5 张），上下滑分页切换。底部收藏、壁纸留白、应用抽屉和原生编辑都照旧。
        evidence:
          - {doc: docs/research/proactive-system-care.md, date: 2026-09-30, note: "桌面显示 Codex 策展出的单张卡"}
      - id: E2
        text: 很多不同的崩溃合成一张卡。点卡片开一个对话，首条消息是卡片按钮的文字，Agent 在聊天里逐项介绍。同一张卡再点回到同一个对话，连点不会开出两个。
        evidence:
          - {doc: docs/research/proactive-system-care.md, date: 2026-09-30, note: "36 条记录合成一张卡；双击开两个对话已修正"}
      - id: E3
        text: 只有实质变化才重新整理：防抖 2 分钟、至少隔 1 小时（结果待查看或严重故障 10 分钟）、一天最多 12 次。没变化不发送。可以关掉后台整理。
      - id: E4
        text: 整理是不进会话列表的只读回合，输出严格校验。Agent 不可用、未登录、超限、超时或输出无效时显示回退卡，并分别说明是哪种情况。
      - id: E5
        text: 发给模型的是脱敏摘要（私人路径换成占位），不发 core 和完整日志。
      - id: E6
        text: “暂不”把卡片隐藏到相关记录有实质变化为止。这条反馈进入下一次整理。
      - id: E7
        text: 把小组件放上主屏时不覆盖用户已有的图标、组件和删除选择，满页时新增一页。用户删除后不再自动加回。
        evidence:
          - {doc: docs/research/proactive-system-care.md, date: 2026-09-30, note: "20260930.7 原生小组件部署"}
      - id: E8
        text: 卡片内滑动不会打开应用抽屉。在壁纸处上滑仍打开抽屉。长按进入原生调整。
        evidence:
          - {doc: docs/research/proactive-system-care.md, date: 2026-09-30, note: "20260930.13 实际触摸注入"}
    pitfalls:
      - text: 用户否定了全屏卡片主屏和逐记录卡片。建议放在原 Folio 上方的原生 widget 区域，由 Agent 决定展示哪几件事。
        docs: [docs/research/proactive-system-care.md, docs/research/96-agent-curated-briefing.md]
      - text: Folio 的 SwipeArea 会抢走组件内的上滑。组件用 MouseArea.preventStealing 接管视口内的拖动。
        docs: [docs/research/proactive-system-care.md]
      - text: 按钮行“按子项可见性决定自身可见”时永远隐藏。未整理的回退卡曾误称“Codex 不可用”。
        docs: [docs/research/proactive-system-care.md]
    code:
      - agent/suggestions/briefing.cpp
      - agent/suggestions/briefing.h
      - agent/suggestions/layout.cpp
      - agent/suggestions/layout.h
      - agent/suggestions/plasma-plasmashell.conf
      - agent/suggestions/applet/
      - agent/suggestions/gallery.cpp
      - agent/suggestions/preview.cpp
      - agent/suggestions/icons/rungic-agent-suggestions.svg
      - agent/suggestions/qml/BriefingCard.qml
      - agent/suggestions/qml/SuggestionsWidget.qml
      - agent/suggestions/qml/SuggestionStack.qml
      - agent/suggestions/qml/SuggestionCard.qml
      - agent/suggestions/qml/SuggestionsFeed.qml
      - agent/suggestions/qml/PresentationTracker.qml
      - agent/suggestions/qml/WidgetGallery.qml
      - agent/assistant/app/qml/SuggestionsPage.qml
      - tools/tests/test_briefing_curation.py
      - tools/tests/test_suggestions_widgets.py
    docs: [docs/research/96-agent-curated-briefing.md, docs/research/proactive-system-care.md]

  - id: agent.suggestion-tasks
    title: 让 Agent 调查和修复
    scenario: agent.care
    status: live
    platform: linux
    summary: 用户点“检查原因”后 Agent 在对话里调查，结论、计划、验证和回退写回记录。只有用户确认了具体方案才应用修复。
    experience:
      - id: E1
        text: 点“检查原因”后 Agent 在原对话里调查，结论、计划、验证和回退写回记录。关闭卡片或离开应用不取消任务。
        evidence:
          - {doc: docs/research/proactive-system-care.md, date: 2026-09-30, note: "真实 GPT-6 Luna 只读调查，结论“根因未知”，未修改系统"}
      - id: E2
        text: 只有具体方案、验证和回退都齐全时才能“应用修复”。确认框里的方案若已变化，旧确认被拒绝，Agent 只读用户确认的那份快照。
        evidence:
          - {doc: docs/research/proactive-system-care.md, date: 2026-09-30, note: "20260930.9 方案 A 改为 B 后应用按钮禁用、提交 A 被拒"}
      - id: E3
        text: 建议服务或 Agent 重启后，任务仍与原记录和原对话关联。迟到的旧任务事件不覆盖新任务。结果在送达界面前先保存。
        evidence:
          - {doc: docs/research/proactive-system-care.md, date: 2026-09-30, note: "调查期间重启建议服务，原任务 ID 与对话保持"}
      - id: E4
        text: 模型调用失败（包括未登录 401）显示为失败，保留原因和重试入口，不当作调查完成。
      - id: E5
        text: 停止只作用于对应的任务，不影响别的对话。停止失败时任务保持运行并可再试。
      - id: E6
        text: 问题在调查中消失，任务和它的结果不丢，结果仍可稍后查看。
    pitfalls:
      - text: 调查沿用用户既有的 Codex 执行权限，只读范围由任务指令约束，不是新增的系统沙箱。
        docs: [docs/research/proactive-system-care.md]
      - text: 集成测试的 Agent 传输是替身，不能当作真实模型验收。
        docs: [docs/research/proactive-system-care.md]
    code:
      - agent/assistant/rungic_voice_agent.py
      - tools/tests/test_suggestion_tasks.py
      - tools/tests/test_suggestion_errors.py
    docs: [docs/research/proactive-system-care.md]

  - id: agent.compat-knowledge
    title: 软件兼容性知识库
    scenario: agent.care
    status: live
    platform: linux
    summary: 仓库维护的兼容性条目随包发布，内容包括问题、优化和有意采用的策略。发现或调查问题时，先查询这些条目。上游协作的脱敏材料只在本机准备。
    experience:
      - id: E1
        text: 条目必须有证据和精确的版本，不能带可执行内容。不合规的条目在校验时被拒。
      - id: E2
        text: 版本精确匹配：已带本地修复的 Qt Multimedia 不被未打补丁的规则误报。Blender 的 CPU 渲染策略不生成故障建议。
        evidence:
          - {doc: docs/research/proactive-system-care.md, date: 2026-09-30, note: "20260930.3 知识匹配"}
      - id: E3
        text: 反馈只在本机生成脱敏的事实材料，不自动对外提交 issue 或 PR。上游状态由维护者记录，与本机是否解决分开。
        evidence:
          - {doc: docs/research/proactive-system-care.md, date: 2026-09-30, note: "facts.json 不含 core 和完整日志，未对外发"}
    pitfalls:
      - text: 没有记录表示未知，不能显示为“不兼容”。一个机型的测试不能推广到所有 Adreno。
        docs: [docs/research/proactive-system-care.md]
      - text: Mesa 现行规则禁止自主工具自动提交或参与 issue/MR，对外文字由维护者自己写。
        docs: [docs/research/proactive-system-care.md]
    code:
      - compatibility/
      - tools/system/tests/suggestions_collect.py
    docs: [docs/research/proactive-system-care.md]

  - id: agent.usage-widget
    title: Agent 用量小组件
    scenario: agent.care
    status: live
    platform: linux
    summary: 主屏和应用显示 Codex、Claude Code 等 Agent 的额度窗口、重置时间和本机 token 用量。每个 Agent 使用自己的标志。
    experience:
      - id: E1
        text: 订阅账户显示真实的额度窗口和重置时间。API Key 账户不显示虚构的订阅额度和重置时间，只显示 token。
        evidence:
          - {doc: docs/research/proactive-system-care.md, date: 2026-09-30, note: "API Key 显示无订阅重置；订阅账户只做了替身验证"}
      - id: E2
        text: 本机 token 统计不重复计数：服务重启、重读同一事件后数值不变，同一回合内的多次请求不重复也不遗漏。按账户分开。不含实时语音。
        evidence:
          - {doc: docs/research/proactive-system-care.md, date: 2026-09-30, note: "15,771 → 31,543，重启建议服务后不重复"}
      - id: E3
        text: 每个 Agent 是一个提供方，由描述文件声明（系统目录或用户目录），各带自己的标志。契约之外的字段丢弃。多个 Agent 用切换片。
      - id: E4
        text: Claude Code 的 token 来自其会话记录，每条消息只算一次。额度只取文档化的 statusline 数据，不用未文档化的接口。
      - id: E5
        text: 读取失败、离线、未登录各自显示，不编造额度。账户切换期间读到的旧响应被丢弃，别的账户的 token 不会算进来。
      - id: E6
        text: 额度的重置时间到了只标记“待刷新”，不在本地把已用额度清零。
      - id: E7
        text: 点用量进入应用的用量页，点像素标志回到 Agent 对话。
        evidence:
          - {doc: docs/research/proactive-system-care.md, date: 2026-09-30, note: "20260930.11 同一 Agent PID"}
