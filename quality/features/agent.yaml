      - android/app/src/com/rungic/plasma/OcrBridge.java
      - android/app/jni/ocr/
      - tools/system/tests/cua_find_name.py
    docs: [docs/64-goal-computer-use.md, docs/60-computer-use.md]

  - id: agent.workspaces
    title: Agent 自己的工作区
    scenario: agent.desktop-work
    status: live
    platform: linux
    interfaces: [platform-bridge, kwin-android-host]
    summary: 每个 Agent 使用独立的 KWin，默认无头运行。工作区有自己的 D-Bus、Xwayland、无障碍总线和声音。Agent 在工作区内打开和操作应用，不干扰用户的手机。
    experience:
      - id: E1
        text: Agent 打开的应用只出现在它的工作区里，第一帧就在那里。它的点击和打字不抢用户手机上的焦点、指针和当前屏。
        evidence:
          - {doc: docs/research/91-agent-workspaces.md, date: 2026-09-29, note: "Kalk 算 12×12，用户会话除浮窗外没有新窗口"}
      - id: E2
        text: 工作区默认无头：手机锁屏、息屏、Rungic 应用被冻结时，工作区照常启动、运行应用、截图和操作。
        evidence:
          - {doc: docs/research/97-headless-agent-work.md, date: 2026-10-02, note: "§10、§14：APK 冻结时启动、截图、录屏"}
        device: 截图要经 KWin 在手机 GPU 上渲染，容器里的 KWin 没有 GPU，ScreenShot2 一律取消。Android 锁屏、息屏和冻结 Rungic 应用也只在手机上发生
      - id: E3
        text: 宿主不响应时，需要宿主的工作区约 3 秒内明确失败并说明原因，Agent 能如实转告。冻结期间桌面工具每次约 1 秒，不每次等满超时。
        evidence:
          - {doc: docs/research/97-headless-agent-work.md, date: 2026-10-02, note: "§9 ensure 3.2 s 返回原因；§14 截图约 1.0 s"}
      - id: E4
        text: 工作区有自己的无障碍总线，不会抢走用户会话的。工作区重启后，用户手机上读控件和文字输入照常。
        evidence:
          - {doc: docs/research/91-agent-workspaces.md, date: 2026-09-30, note: "两条总线分开，冒烟 9/9"}
      - id: E5
        text: 工作区的环境按 Plasma 桌面会话设置（文件对话框在进程内），把命令交还用户会话时恢复用户原来的值。工作区的变量不泄漏进用户的 systemd 环境。
        evidence:
          - {doc: docs/research/91-agent-workspaces.md, date: 2026-09-29, note: "工作区重启、Xwayland 启动后用户环境不变"}
      - id: E6
        text: 工作区里的声音进它自己的 null sink，没人看时用户听不到。显示时接到默认输出。停止后 sink 和回环都清理掉。
        evidence:
          - {doc: docs/research/91-agent-workspaces.md, date: 2026-10-01, note: "paplay 进 rungic_ws4；listen/quiet 接上和断开"}
      - id: E7
        text: 用户界面重启（装 Rungic 应用、Plasma 崩溃）不会停掉 Agent 的工作区。
      - id: E8
        text: 工作区重启后，Agent 的桌面工具自动换用新的会话，不会一直报 “The connection is closed”。
    pitfalls:
      - text: KWin 只有一个座席（一个指针、一个键盘焦点、一个活动窗口），要隔离输入只能每个工作区一个合成器。
        docs: [docs/research/91-agent-workspaces.md]
      - text: 工作区与用户共用缓存目录时 ksycoca 被两边轮流重建，主屏幕每秒重载应用列表。工作区要有自己的 XDG_CACHE_HOME。
        docs: [docs/research/91-agent-workspaces.md]
      - text: 私有总线上没有 systemd：busctl --user、systemctl 冻结等要显式走用户会话总线。工作区里 KIO 直接 fork，应用会落进语音服务的 cgroup，要用 systemd-run 的 scope。
        docs: [docs/research/91-agent-workspaces.md]
      - text: 容器的 cgroup2 没有控制器，MemoryMax、CPUWeight 静默失效。整个容器只有 4 GiB 的 Android memcg，现实上同时只能跑 1 个重型 GUI 应用、2 个工作区。
        docs: [docs/research/91-agent-workspaces.md]
      - text: Motorola 中国版 ROM 的 SmartFreezer 在息屏后会冻结 Rungic 应用（前台服务也不例外），冻结后 Unix socket 的连接只排队、不唤醒。不带超时的 connect 会永久阻塞。
        docs: [docs/research/97-headless-agent-work.md]
      - text: KWin 的 virtual 后端只枚举 /dev/dri，容器里只有 /dev/kgsl-3d0，需要补丁指定渲染节点。后端只能启动时选定，不能热切换。
        docs: [docs/research/97-headless-agent-work.md]
      - text: 测试时在测试工作区里用 rungic-cua launch 会把用户手机上的助理屏切过去。测试用 systemd-run 直接启动应用。
        docs: [docs/research/91-agent-workspaces.md]
    code:
      - agent/workspace/rungic-workspace
      - agent/workspace/rungic-workspace@.service
      - agent/workspace/rungic-workspace-env
      - agent/workspace/rungic-user
      - agent/workspace/rungic-workspace-sound
      - agent/workspace/rungic-workspace-a11y
      - agent/workspace/dbus/session.conf
      - agent/workspace/dbus/org.a11y.Bus.service
      - agent/workspace/defaults/kwinrc
      - agent/workspace/CMakeLists.txt
      - agent/workspace/input.cpp
      - agent/workspace/desktop.cpp
      - agent/workspace/com.rungic.WorkspaceInput.desktop
      - agent/computer-use/rungic_cua/workspace.py
      - agent/computer-use/rungic_cua/router.py
      - agent/computer-use/rungic_cua/fakeinput.py
      - tools/tests/test_workspace_env.py
      - tools/system/tests/workspace_headless.py
      - tools/tests/test_workspace_unit.py
    docs: [docs/research/91-agent-workspaces.md, docs/research/97-headless-agent-work.md, docs/agent-ready-interfaces.md]

  - id: agent.workspace-lifecycle
    title: 工作区空闲冻结与关闭
    scenario: agent.desktop-work
    status: live
    platform: linux
    summary: 工作区无人使用时，系统冻结其中的应用。长期不用时，系统关闭工作区。关闭前先请求应用退出，并向用户报告未保存的内容。
    experience:
      - id: E1
        text: 工作区安静（没有输入、没在显示、没有 Agent 在这里干活）60 秒后冻结其中的应用，安静 30 分钟后自动关闭。Agent 再用时先解冻，已关闭的自动重新启动。
        evidence:
          - {doc: docs/research/91-agent-workspaces.md, date: 2026-10-01, note: "测试 drop-in 10 秒冻结、45 秒关闭"}
      - id: E2
        text: 关闭分两段：先把借来的应用还给用户，再请每个窗口关闭。有未保存内容、拒绝关闭的应用被报告出来、不替用户回答，工作区保留，除非强制关闭。
        evidence:
          - {doc: docs/research/91-agent-workspaces.md, date: 2026-10-01, note: "拒绝关闭的 GTK 程序出现在 remaining"}
      - id: E3
        text: 应用随工作区结束：工作区停止时其中的应用一起停止，单元以成功结束而不是 failed。
        evidence:
          - {doc: docs/research/91-agent-workspaces.md, date: 2026-10-01, note: "stop 后 Kalk 退出，Result=success"}
      - id: E4
        text: 不支持 WM_DELETE_WINDOW 的 X11 程序不会被“请求关闭”误杀，而是报告出来。没有 PID 的 X11 窗口按 WM_CLASS 识别。
      - id: E5
        text: 关闭期间不冻结应用，关闭开始和停止单元前各解冻一次，强制关闭后不会留下活着的应用。
      - id: E6
        text: 浮窗上的 ✕：Agent 正在这里干活时只隐藏，这一轮不再自动弹出。否则关闭工作区，有应用没关掉时发通知，提供“查看”和“不保存，直接关闭”。
    pitfalls:
      - text: keeper 的 systemctl 和 systemd-run 曾走了工作区自己的总线，冻结和自动关闭都失败。
        docs: [docs/research/91-agent-workspaces.md]
      - text: 工作区脚本收到 TERM 时 trap 里的 kill 失败，在 set -e 下以 1 退出，被建议卡误报为启动失败。
        docs: [docs/research/91-agent-workspaces.md]
      - text: Wayland 没有“已修改”标志，“请窗口关闭、由应用自己决定提示”是唯一通用的做法。KWin 自带的 closeWaylandWindows 2 分钟后强制继续且不管 X11，所以不直接用。
        docs: [docs/research/91-agent-workspaces.md]
    code:
      - agent/workspace/keeper.cpp
      - agent/computer-use/rungic_cua/workspace.py
      - tools/test_workspace_lifecycle.py
      - tools/tests/test_workspace_dismiss.py
    docs: [docs/research/91-agent-workspaces.md]

  - id: agent.where
    title: Agent 在哪块屏上工作
    scenario: agent.desktop-work
    status: live
    platform: linux
    interfaces: [platform-bridge]
    summary: 用户启用桌面模式或在电视上显示桌面时，Agent 在用户的桌面上工作。其他情况下，Agent 使用自己的工作区。用户也可以指定工作位置。
    experience:
      - id: E1
        text: 桌面模式开着或电视在显示桌面时，Agent 在用户的桌面（0 号工作区）上工作。否则在自己的工作区。
        evidence:
          - {doc: docs/research/91-agent-workspaces.md, date: 2026-09-29, note: "where: desktop, why: desktop mode is on"}
      - id: E2
        text: 用户说“在我的桌面上”或“在你自己那里”时听用户的，本次对话内有效。需要时打开桌面模式。
        evidence:
          - {doc: docs/research/91-agent-workspaces.md, date: 2026-09-29, note: "desktop_where desktop，Kalk 算 9×9"}
      - id: E3
        text: 工作位置变化时，结果里附一行 where/why。没变化时不重复。
      - id: E4
        text: 平台桥连不上时默认在 Agent 自己的工作区。
    code:
      - agent/computer-use/rungic_cua/router.py
      - tools/test_router.py
    docs: [docs/research/91-agent-workspaces.md, docs/agent-ready-interfaces.md]

  - id: agent.app-switching
    title: 只能开一份的应用按需借用
    scenario: agent.desktop-work
    status: live
    platform: linux
    summary: 支持多实例的应用在工作区内启动新实例。微信、浏览器等单实例应用需要借用用户的实例。Agent 先征得用户同意，使用结束后自动归还。
    experience:
      - id: E1
        text: 关闭用户正在运行的那一份之前必须先征得同意：工具返回 needs_confirmation 和要问的话，只有带上 switch 才关闭。
        evidence:
          - {doc: docs/research/91-agent-workspaces.md, date: 2026-09-29, note: "替身 Firefox：先提问、未被关闭"}
      - id: E2
        text: 应用正在用麦克风（通话、会议）时既不借走，也不在通话中归还。
      - id: E3
        text: Agent 最后一轮结束约两分钟后，借来的应用自动还给用户会话（带用户原来的环境），并发一条通知。只归还本工作区借的。
        evidence:
          - {doc: docs/research/91-agent-workspaces.md, date: 2026-09-29, note: "约 2.5 分钟后 restored to the phone"}
      - id: E4
        text: 按程序名认出应用（包括 firefox-bin 这样的可执行文件名），只处理主进程，用 SIGTERM 正常结束。
    pitfalls:
      - text: 征求同意的问题要原样、中立地转述。语音曾加上“建议你选择可以”，还在用户答过后请他再说一遍。
        docs: [docs/research/91-agent-workspaces.md]
      - text: 微信重启后是否需要在主力手机上确认登录尚未测试。
        docs: [docs/research/91-agent-workspaces.md]
    code:
      - agent/computer-use/rungic_cua/switch.py
      - tools/test_switch.py
    docs: [docs/research/91-agent-workspaces.md]

  - id: agent.watch-work
    title: Agent 操作时的字幕
    scenario: agent.desktop-work
    status: live
    platform: linux
    summary: Agent 操作屏幕时，对应屏幕的浮窗底部用一句话说明当前操作。语音也会转述。浮窗、导播台和电视画面的要求见桌面模式领域。
    experience:
      - id: E1
        text: Agent 操作时浮窗底部显示一句中文字幕（打开某应用、点击、输入…），结束时显示“完成 / 需要你回答 / 没做成 / 已停止”4 秒。写入方 120 秒没更新就视为已不在。
        evidence:
          - {doc: docs/88-agent-visible-work.md, date: 2026-09-29, note: "goal 依次写出打开 Dolphin……完成"}
      - id: E2
        text: 每个工作区的字幕各自独立，浮窗读自己工作区的那一份。语音服务取较新的那条转述。
      - id: E3
        text: Luna 每批动作附一句不超过 15 个字的中文说明。模型没写时按动作类型生成（点击、输入“…”、按回车）。
        evidence:
          - {doc: docs/88-agent-visible-work.md, date: 2026-09-29, note: "前两条之后都是 Luna 自己写的中文说明"}
    code:
      - agent/computer-use/rungic_cua/activity.py
      - tools/tests/test_cua_caption_qml.py
      - tools/system/tests/cua_captions.py
    docs: [docs/88-agent-visible-work.md, docs/research/91-agent-workspaces.md]

  - id: agent.keep-awake
    title: Agent 忙时手机不睡
    scenario: agent.desktop-work
    status: live
    platform: android
    summary: Agent 执行任务或工作区被占用时，系统持有内核 wakelock，使手机息屏后也不挂起。空闲时释放 wakelock。
    experience:
      - id: E1
        text: Agent 在跑任务或工作区被认领时，系统持有 rungic_agent 唤醒锁。空闲后约 5 秒内释放。只认持有者进程还活着的标记。
        evidence:
          - {doc: docs/research/97-headless-agent-work.md, date: 2026-10-02, note: "§12 写入标记后出现 rungic_agent，删掉约 5 s 后释放"}
      - id: E2
        text: 唤醒服务自己挂掉时，锁最多 60 秒后自动失效，不会让手机一直醒着。
    pitfalls:
      - text: 此前息屏时 Agent 还能继续只是碰巧：audioserver 一直持有 AudioMix 唤醒锁。
        docs: [docs/research/97-headless-agent-work.md]
      - text: 容器的 /sys 是只读的，服务在自己的挂载命名空间里把 /sys 重新挂成可写。ReadWritePaths= 做不到。
        docs: [docs/research/97-headless-agent-work.md]
      - text: 内核唤醒锁没有 uid 归属，挡不住 Moto 冻结 Rungic 应用。Doze 会阻断容器里 uid ≥ 10000 的网络。
        docs: [docs/research/97-headless-agent-work.md]
    code:
      - agent/workspace/rungic-agent-wakelock
      - agent/workspace/rungic-agent-wakelock.service
      - tools/tests/test_agent_wakelock.py
      - tools/tests/test_agent_wakelock_expiry.py
    docs: [docs/research/97-headless-agent-work.md]

  # ---- 组队 ---------------------------------------------------------------------------------------
  - id: agent.team
    title: 组队：组长派成员各用一个工作区
    scenario: agent.team
    status: experimental
    platform: linux
    summary: 助理按 rungic-agent-team 技能担任组长，通过 Codex 子 Agent 分工。每个成员首次需要桌面时，系统分配独立工作区。成员在共享项目中按约定交付。
    experience:
      - id: E1
        text: 子 Agent 第一次要桌面时各自领到一个空闲工作区，组长保留自己的。桌面模式开着也不去用户桌面。全部被占用时明确报错。
        evidence:
          - {doc: docs/research/91-agent-workspaces.md, date: 2026-10-01, note: "A 领 2 号、B 领 3 号，父 Agent 在 1 号"}
      - id: E2
        text: 成员交付或关闭工作区时释放领取。进程结束或 20 分钟没有调用就视为失效，别人可以再领。
        evidence:
          - {doc: docs/research/91-agent-workspaces.md, date: 2026-10-01, note: "领取记录随关闭释放，工作区单元没有失败"}
      - id: E3
        text: 组长按简报 → 一轮评审（每人一条、最多 8 点）→ 组长定稿 → 并行制作 → 汇总审查 → 交给用户的流程推进，成员之间不直接讨论。
        evidence:
          - {doc: docs/research/91-agent-workspaces.md, date: 2026-10-02, note: "野餐邀请卡约 15 分钟完成，没有受阻"}
        device: 流程由真实模型按 rungic-agent-team 技能推进，替身模型只会重放脚本。是否按简报、评审、定稿、制作、汇总的顺序走、成员是否不直接讨论，只有用真实 Codex 在手机上跑一轮团队才看得出（看板阶段的代码由 team-board/E1 的测试检查）
      - id: E4
        text: 成员的每次工具调用翻成一句短话（“写 BRIEF.md”“运行 check.py”）显示在它的格子上，命令链按实际做的那一步描述，最多每 1.5 秒一句。
      - id: E5
        text: 发言写进项目的 .team/journal.jsonl。成员结束时没说结果，自动补一条 ended。
      - id: E6
        text: 手机息屏、Rungic 应用被冻结时，团队照常继续。
    pitfalls:
      - text: Codex 子 Agent 强制继承父 Agent 的环境和 MCP 配置，shell 里启动的图形程序会开到父 Agent 的桌面。要用 desktop_launch 或工具给的命令前缀。
        docs: [docs/research/91-agent-workspaces.md]
      - text: 工作区不能等进程退出才释放（子 Agent 汇报后服务进程一直留着），要在交付或关闭时主动释放。
        docs: [docs/research/91-agent-workspaces.md]
      - text: 组长只核对尺寸和透明通道时美术风格会跑偏。简报要有“方向”一节，汇总时要看图、听声音。组长不要为了确认而把游戏挪到桌面模式上。
        docs: [docs/research/91-agent-workspaces.md]
      - text: 多 Agent 的 token 是单 Agent 的 3–15 倍。手机上最多 3 个用桌面的成员。Agent 之间的消息在会话记录里是加密的，只有工具调用是明文。
        docs: [docs/research/91-agent-workspaces.md]
      - text: 第一次团队验收时手机息屏后工作区起不来（当时还是 Android 后端），之后才改为默认无头。息屏下的团队运行尚未实测。
        docs: [docs/research/91-agent-workspaces.md, docs/research/97-headless-agent-work.md]
    code:
      - agent/computer-use/rungic_cua/team.py
      - agent/assistant/skills/rungic-agent-team/SKILL.md
      - tools/team/run-lead.sh
      - tools/team/request.txt
      - tools/tests/test_team_frozen_host.py
      - tools/test_router.py
      - docs/images/readme/team*
    docs: [docs/research/91-agent-workspaces.md]

  - id: agent.team-board
    title: 团队看板：导播台和对话里的团队卡
    scenario: agent.team
    status: experimental
    platform: linux
    summary: 团队看板记录阶段、简报、成员状态、评审、决定和结果。导播台的看板格显示这些数据，组长对话以团队卡显示。重要进展触发播报或通知。看板格见桌面模式领域。
    experience:
      - id: E1
        text: 看板跟着团队从简报、评审、制作到完成。组长定稿后所有成员显示“制作中”。新组长发新简报时开一块新看板。
      - id: E2
        text: 由助理会话当组长时，对话里有一张实时更新的团队卡：阶段、简报、每人一行，评审后折叠成“查看 N 份评审”，以及决定和结果。
        evidence:
          - {doc: docs/research/91-agent-workspaces.md, date: 2026-10-02, note: "两次实机验收，团队卡从评审到完成实时更新"}
      - id: E3
        text: 只在重要时打扰：开工和成员完成只播报。提问、受阻、失败播报并发紧急通知。全队完成只通知。评审和进展只在卡片上。
      - id: E4
        text: 通知只在没人看对话时发，点“打开”进入组长的对话。平台桥不答时按“没人在看”处理，通知不被压住。
        gap: 通知路径还没在实机上走到
      - id: E5
        text: 助理重启后第一次看到一块超过 60 秒没更新的看板时，不重播里面的旧发言。
    pitfalls:
      - text: 只用命令行干活的成员不会触发“评审后开工”的推断，定稿时要一起改为“制作中”。
        docs: [docs/research/91-agent-workspaces.md]
    code:
      - agent/assistant/team_feed.py
      - agent/computer-use/rungic_cua/team.py
      - tools/test_team_feed.py
    docs: [docs/research/91-agent-workspaces.md]

  - id: agent.team-script-run
    title: 开发端脚本当组长的团队运行
    scenario: agent.team
    status: retired
    keep: README 的团队演示和 research/91 的端到端记录引用这些脚本与请求原文，作为那次演示的可复现记录保留。不再作为启动团队的入口。
    platform: linux
    summary: 2026-10-01 的首次团队验收由开发机 Agent 担任组长，通过脚本在手机上启动三个 codex exec 成员。该记录还包括子 Agent 工具进程的探针实验。现由助理会话按 rungic-agent-team 技能担任组长的流程取代。
