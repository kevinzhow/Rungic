  - id: agent.dev-diagnostics
    title: 开发用 Agent 的诊断接口
    scenario: agent.setup
    status: live
    platform: android
    summary: 开发机上的 rungic MCP 服务为开发 Agent 提供手机诊断接口。接口包括状态、合并日志、崩溃、完整性、截图、证据包、控件、追踪和构建状态。
    experience:
      - id: E1
        text: rungic MCP 提供 21 个工具。只读工具不改变设备状态，会改变设备的（符号化、控件操作、追踪采集）在说明里标明。
      - id: E2
        text: 多个 ADB 服务器、多台手机同时在线时，按配置的端口和序列号操作那一台，不沿用工具的历史默认设备。
      - id: E3
        text: 按无障碍名称在启动器里打开和关闭应用（ui_launch_check），每一步对照进程表和 AT-SPI 核对，点错就失败，不悄悄测错对象。
      - id: E4
        text: 合并日志把 Android、容器和内核日志按同一时钟排成一条时间线。
    pitfalls:
      - text: 在手机上做重活（例如 gdb 符号化）会被 LMK 连带杀掉 VPN 和桌面。符号化走构建机。
        docs: [docs/55-agent-native-debugging.md, docs/research/proactive-system-care.md]
      - text: 通用 ui_tap 对 Qt 弹出层使用未计入弹出层偏移的 AT-SPI 坐标，会点到按钮上方。不能把工具点错当成按钮失效。
        docs: [docs/research/proactive-system-care.md]
      - text: 每次经 adb 的 AT-SPI 查询约 3 秒，等待位置稳定的超时要够长。
        docs: [docs/agent-ready-interfaces.md]
    code:
      - tools/rungic_agent.py
      - tools/rungic_agent_mcp.py
      - tools/ui_launch_check.py
      - .mcp.json
      - tools/tests/test_rungic_agent_mcp.py
    docs: [docs/55-agent-native-debugging.md, docs/agent-ready-interfaces.md]

  # ---- 让 Agent 操作桌面 --------------------------------------------------------------------------
  - id: agent.computer-use
    title: Agent 看画面操作桌面应用
    scenario: agent.desktop-work
    status: live
    platform: linux
    summary: Codex 默认使用当前模型和登录凭据，根据截图操作桌面。用户可以显式选择 Luna API。输入和窗口管理复用 KWin 与标准门户。
    experience:
      - id: E1
        text: Agent 能点击、双击、拖动、滚动、按键和输入任何语言的文字来操作图形应用。应用收到的是普通的键盘鼠标事件，Plasma 在后台时也能输入。
        evidence:
          - {doc: docs/68-luna-computer-use.md, date: 2026-09-25, note: "微信 3 步打开聊天"}
        device: 任何语言的文字靠 KWin 的 commitText 提交，这是 Rungic 的 KWin 补丁（virtualkeyboard-commit-text），系统测试容器里是 Ubuntu 原版 KWin，只测了按键和指针。“Plasma 在后台”指 Android 前台是别的应用，只有手机能造出
      - id: E2
        text: 截图只截任务所在的窗口（连同它的弹出菜单和对话框），范围变化时用一句话告诉模型。点击坐标误差约 1 像素。
        evidence:
          - {doc: docs/68-luna-computer-use.md, date: 2026-09-25, note: "输入 token 减少 67%，坐标误差 1 px"}
        device: 截图的像素由 KWin 的 ScreenShot2 渲染，需要 OpenGL 合成。系统测试容器没有 GPU 渲染节点，KWin 退回 QPainter，截图被取消，真实画面和点击误差只能在手机上看
      - id: E3
        text: 默认 Codex 用 desktop_screenshot 和 desktop_act 逐步操作并核验结果。API 备选保留 desktop_goal 的完成、提问、失败和中止。
        evidence:
          - {doc: docs/63-call-proxy.md, date: 2026-09-25, note: "中止机制：12 s 发信号，13.3 s 停下"}
      - id: E4
        text: 程序被一个看不见的对话框挡住时（门户的“另存为”没有回来），工具结果直接说明，Agent 不会一直点菜单。
        evidence:
          - {doc: docs/103-krita-save-dialog-hang.md, date: 2026-10-01, note: "desktop_act 结果出现 held by a dialog 提示"}
      - id: E5
        text: 窗口的关闭、最小化、最大化和移屏由窗口管理器完成（desktop_window），一次关上。应用要询问保存时返回 still_open。
        evidence:
          - {doc: docs/60-computer-use.md, date: 2026-09-24, note: "window close 一次关闭"}
      - id: E6
        text: desktop_launch 按桌面文件 id 或任何语言的名称启动应用，返回已激活的窗口。已开的不重复启动。应用在自己的 scope 里，语音服务重启不会把它一起结束。
        evidence:
          - {doc: docs/60-computer-use.md, date: 2026-09-24, note: "launch 系统设置 1.15 s"}
          - {doc: docs/88-agent-visible-work.md, date: 2026-09-29, note: "Blender 图形界面在助理屏上运行"}
      - id: E7
        text: 即使 Codex 给 MCP 的环境很精简，工具也从 systemd 取图形会话的环境，Firefox 这类应用照样能启动。
        evidence:
          - {doc: docs/60-computer-use.md, date: 2026-09-24, note: "env -i 下 launch Firefox 3.5 s"}
      - id: E8
        text: 桌面操作默认沿用 Codex 的登录和模型，不隐式调用独立视觉 API。显式 API 备选保留，已有模式选择不被覆盖。
        evidence:
          - {doc: docs/106-codex-desktop-operation.md, date: 2026-10-03, note: "PR 前补充验证：常驻 Codex 实际看图点击 Kalk，147×31=4,557"}
      - id: E9
        text: 当前任务或通话未结束时拒绝切换桌面操作方式，保持原模式和工作状态。
        evidence:
          - {doc: docs/106-codex-desktop-operation.md, date: 2026-10-03, note: "G100：任务中、10000 接通时及空闲静音电话模式均拒绝切换，原 sessionId 保持"}
    pitfalls:
      - text: Codex 的命令沙箱连不上 D-Bus 和 Wayland，桌面操作必须做成沙箱外的 MCP 服务。没有注解的 MCP 工具每次都要审批，只读工具要标 readOnlyHint。
        docs: [docs/60-computer-use.md]
      - text: 弹出菜单和对话框在 Wayland 下是独立窗口，CaptureWindow 不包括它们。CaptureArea 按最高缩放（手机 3 倍）出图，要缩回目标屏的缩放，否则 token 多近三倍。
        docs: [docs/68-luna-computer-use.md]
      - text: 续接对话后接口只接受 computer_call_output 回传的图片。函数调用只回文字，由模型再请求截图。
        docs: [docs/68-luna-computer-use.md]
      - text: computer 工具没有“按住直到外部信号”的动作，按住说话类的录音控件在方案一下不支持。
        docs: [docs/68-luna-computer-use.md]
      - text: RemoteDesktop 门户第一次要用户批准。每次新会话会弹“远程控制会话已开始”通知并挡住窗口顶部，要在 notifyrc 里关掉。
        docs: [docs/60-computer-use.md]
      - text: 标题栏是 KWin 画的装饰，不在应用的无障碍树里。窗口操作要走 desktop_window。
        docs: [docs/60-computer-use.md]
    code:
