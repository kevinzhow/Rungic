area: agent
title: Agent 能力
summary: 内置的语音与任务助理：说话、看它工作、让它操作手机和桌面、替用户打电话、主动照看系统。
scenarios:
  - id: agent.talk
    title: 和 Agent 说话、让它做事
    summary: 按住 Home 或打开 Agent 应用，用语音或文字交代任务，看进度、听结果，图片和文件出现在对话里。
  - id: agent.desktop-work
    title: 让 Agent 操作桌面应用
    summary: Agent 在自己的工作区（或用户指定的桌面）上打开应用、看画面、点击和输入，用户随时能看到它在做什么，手机锁屏时也能继续。
  - id: agent.team
    title: 让几个 Agent 组队完成大任务
    summary: 助理按 rungic-agent-team 技能担任组长，通过 Codex 子 Agent 分工。每个成员首次需要桌面时，系统分配独立工作区。成员在共享项目中按约定交付。
  - id: agent.calls
    title: 让 Agent 替我打电话、发语音
    summary: 用手机卡或微信替用户通话，随时旁听、接过来或挂断。在聊天应用里代发语音消息。
  - id: agent.care
    title: 系统主动照看自己
    summary: 系统发现崩溃、故障和适配问题，Agent 整理成主屏上的少数几张卡，用户择机让它调查和修复。主屏上还能看到 Agent 的用量。
  - id: agent.setup
    title: 安装、设置和接入 Agent
    summary: 安装和更新 Codex、登录、选模型、改指令和技能。开发用的 Agent 也能经诊断接口查看手机。
features:
  # ---- 和 Agent 说话 ------------------------------------------------------------------------------
  - id: agent.voice
    title: 按住说话的语音对话
    scenario: agent.talk
    status: live
    platform: linux
    interfaces: [audio, platform-bridge]
    summary: 常驻语音服务由 GPT Realtime 处理对话，由 Codex 执行任务。用户按住说话，松手发送。助手先回应，再将任务交给 Agent 执行，并朗读结果。
    experience:
      - id: E1
        text: 一次按住只算一句话：中间停顿不会被切成几段，松手后才整句发出。按下时正在播的回答立即停下。
        evidence:
          - {doc: docs/59-voice-agent.md, date: 2026-09-24, note: "合成语音，停顿 1.6 s 仍为一条消息"}
      - id: E2
        text: 按住时滑到 × 取消，什么都不发出，被取消的半句也不会并进下一句。
        evidence:
          - {doc: docs/87-agent-app-redesign.md, date: 2026-09-29, note: "日志 talk: cancelled, nothing sent"}
      - id: E3
        text: 从哪块屏发起，回复就从哪里播放：手机上发起在手机本机（耳机优先，否则扬声器），电视上发起在电视。
        evidence:
          - {doc: docs/59-voice-agent.md, date: 2026-09-24, note: "按 Android 路由核对，尚待人耳确认"}
        device: 手机本机里耳机优先还是扬声器、电视那一路由 Android 的音频路由决定，系统测试只能核对 Linux 选了哪个 sink，声音实际从哪里出来要在手机上听
      - id: E4
        text: 回复连续播放，不快进、不卡顿、不丢句。
        evidence:
          - {doc: docs/59-voice-agent.md, date: 2026-09-24, note: "复测无不连续或重新同步记录"}
        device: 回复是否连续、不快进、不卡顿取决于 PulseAudio 到 Android 音频桥的缓冲与时序，只有手机上实际播出的声音能判断
      - id: E5
        text: 点“停止”立即停播并中止当前任务，任务显示“已停止”，之后不再播出残句。
        evidence:
          - {doc: docs/59-voice-agent.md, date: 2026-09-24, note: "截屏任务 3 s 后停止"}
      - id: E6
        text: 关闭“朗读回答”后不播语音回复。点某条回答的“朗读”只出声，不多出一条消息、不写进记录。
        evidence:
          - {doc: docs/87-agent-app-redesign.md, date: 2026-09-29, note: "朗读 10.6 s，界面无新增气泡"}
      - id: E7
        text: 按住说话、发文字和朗读总是作用在用户正在看的对话上。用浮层说过话再回到 App 说话，不会进到别的对话。
        evidence:
          - {doc: docs/89-agent-progress.md, date: 2026-09-29, note: "只验证了服务端 Use，界面路径待真人验收"}
      - id: E8
        text: 没配 OpenAI API Key 时只有语音不可用并提示去配置，打字照常。没装 Codex 时服务不退出，对话里提示先安装。
      - id: E9
        text: 助理执行由 Linux 用户管理器常驻。手机图形会话停止或尚未打开时，服务与任务不跟随退出。
    pitfalls:
      - text: Codex 的实时会话固定用服务端 VAD（静音 500 ms 即结束一轮），app-server 不提供修改或手动提交的接口。所以按住期间先存本地、松手后整段上传并补 900 ms 静音。
        docs: [docs/59-voice-agent.md, docs/87-agent-app-redesign.md]
      - text: Codex 用 WebSocket 连实时语音时只接受 API Key（ChatGPT 登录也要另配 Key）。WebRTC 走 UDP，用户的 HTTP 代理转发不了。
        docs: [docs/59-voice-agent.md, docs/101-codex-sign-in-and-api-key.md]
      - text: 语音模型的指令要经 thread/realtime/start 的 prompt 传入。realtimeStartInstructions 只进 Agent 上下文。
        docs: [docs/59-voice-agent.md]
      - text: 用手机扬声器外放合成语音再由手机麦克风录入的自测不成立：Android 采集带回声消除，会把本机播放的声音抵消掉。
        docs: [docs/59-voice-agent.md]
      - text: 投屏时音量键调的是电视那一路。手机扬声器的媒体音量要在未投屏时调。输入转写常为繁体，显示时转简体。
        docs: [docs/59-voice-agent.md]
      - text: 实时模型对“情绪不增加话语”这类规则执行得不严格。语气未经人耳评估。
        docs: [docs/59-voice-agent.md]
    code:
      - agent/assistant/rungic-agent-start
      - agent/assistant/rungic-agent-user.service
      - tools/tests/test_device_services.py
      - agent/assistant/rungic_voice_agent.py
      - agent/assistant/voice_i18n.py
      - agent/assistant/po/zh_CN/rungic-voice-agent.po
      - agent/assistant/rungic-voice-agent.service
      - agent/assistant/com.rungic.VoiceAgent.service
      - agent/assistant/prompts/realtime.md
      - agent/assistant/app/qml/Composer.qml
      - packaging/rungic-voice-agent/
      - tools/tests/test_voice_agent_service.py
    docs: [docs/59-voice-agent.md, docs/87-agent-app-redesign.md, docs/89-agent-progress.md, docs/agent-ready-interfaces.md, docs/113-independent-linux-services.md]

  - id: agent.home-hold
    title: 长按 Home 呼出语音助手
    scenario: agent.talk
    status: live
    platform: linux
    summary: 用户按住导航栏 Home 开始说话，松手发送。浮层显示聆听、识别、处理和回答状态。消息始终进入同一个“语音助手”对话。
    experience:
      - id: E1
        text: 在 Home 上按住约 400 ms 呼出浮层并开始听，松手即发送。长按不再触发回主屏，浮层出现在按下 Home 的那块屏上。
        evidence:
          - {doc: docs/67-home-assistant.md, date: 2026-09-25, note: "dbus-monitor 看到 Hold(true, WL-0) 与 Hold(false)"}
      - id: E2
        text: 按住后没说话就松手，转为免提继续听：说完自动发送，8 秒没听到说话就取消，什么都不发送。
        evidence:
          - {doc: docs/67-home-assistant.md, date: 2026-09-25, note: "released before speech; nothing said, cancelled"}
          - {doc: docs/87-agent-app-redesign.md, date: 2026-09-29, note: "D-Bus 模拟 Home，免提 8 秒后取消并收起"}
      - id: E3
        text: 点浮层外、下滑或单击 Home 收起浮层：正在听的这句丢弃、正在播的停下。Agent 的工作继续，完成后浮层自动弹出结果（不开麦克风）。
        evidence:
          - {doc: docs/67-home-assistant.md, date: 2026-09-25, note: "单击 Home 收起；完成后自动弹出结果"}
      - id: E4
        text: 按下后不必等连接：服务和浮层常驻预热，按下约 0.1 s 内开始录音，实时连接在后台建立，期间的录音按顺序补发。
        evidence:
          - {doc: docs/67-home-assistant.md, date: 2026-09-25, note: "Hold 后 89 ms 开始录音"}
        device: 按下到开始录音的时延取决于手机上 Android 麦克风经 PulseAudio 的采集链路和 CPU 调度，无头系统里没有这条采集链路，测不出 0.1 s。浮层常驻不显示由 tools/system/tests/assistant_app.py 检查
      - id: E5
        text: 一次按住超过 60 秒视为松开事件丢失：关闭浮层、取消录音，已说的内容不发送，麦克风不会一直开着。
      - id: E6
        text: 在设置里关闭“长按 Home 呼出”后，长按 Home 不再呼出浮层。浮层跟随应用的主题设置。
      - id: E7
        text: 会话启动时浮层等 plasmashell 在总线上就绪再启动，熄屏时 plasmashell 起得慢也不会启动失败。
        evidence:
          - {doc: docs/87-agent-app-redesign.md, date: 2026-09-29, note: "先停 plasmashell，再启动后 2 秒内 active，重启次数 0"}
      - id: E8
        text: 浮层只在显示期间加载 KWin 的模糊和对比度特效，隐藏后卸载。用户自己加载的不动。
        evidence:
          - {doc: docs/67-home-assistant.md, date: 2026-09-25, note: "收起后已加载特效中不再有两者"}
    pitfalls:
      - text: Plasma Mobile 的导航栏按钮原本没有长按，全局快捷键也只有“按下”没有“松开”。长按与松开经补丁里的 holdable 按钮和明确的 D-Bus Hold 接口传给浮层。
        docs: [docs/67-home-assistant.md]
      - text: 手势导航模式没有 Home 按钮、电视（docked）没有导航栏，这两种情况下目前没有长按入口。
        docs: [docs/67-home-assistant.md]
      - text: 服务先发 listen-cancelled 再发状态变化，浮层曾把后者当成“说完等回复”而误显示“正在处理”。浮层改为按视图（listen、sending、work、answer）显式切换。
        docs: [docs/87-agent-app-redesign.md]
      - text: 光效用 layer 反而让帧数翻倍。聆听时 GPU 约 70%，其中模糊约占一半。
        docs: [docs/67-home-assistant.md]
    code:
      - agent/assistant/app/overlay.cpp
      - agent/assistant/app/overlay.h
      - agent/assistant/app/qml/AssistantOverlay.qml
      - agent/assistant/rungic-voice-overlay.service
      - agent/assistant/com.rungic.VoiceAssistant.service
      - tools/tests/test_assistant_overlay.py
      - tools/system/tests/assistant_app.py
    docs: [docs/67-home-assistant.md, docs/87-agent-app-redesign.md]

  - id: agent.chat-app
    title: Agent 应用：对话与聊天
    scenario: agent.talk
    status: live
    platform: linux
    summary: 聊天式的 Agent 应用：侧边栏按日期分组的对话、新对话的建议、打字和语音输入、折叠的工作卡片、复制和朗读、设置。
    experience:
      - id: E1
        text: 点开一段对话立即显示内容，不等 Codex 恢复线程。超过 150 ms 才显示“正在打开…”，空对话界面只在确实没有内容时出现。
        evidence:
          - {doc: docs/59-voice-agent.md, date: 2026-09-25, note: "Blender 对话 2775 ms 降到 73 ms"}
      - id: E2
        text: 往上翻历史时视图停在拖到的位置，不跳回底部，不拉出空白、不闪动。离开底部后出现“回到最新”。
        evidence:
          - {doc: docs/59-voice-agent.md, date: 2026-09-25, note: "长对话上拖后 4 秒仍停住；慢拖录屏无单帧跳变"}
      - id: E3
        text: 应用静止时不重画（0 帧），看不见的动画不让窗口空转。
        evidence:
          - {doc: docs/59-voice-agent.md, date: 2026-09-25, note: "静止 3 秒 390 帧降到 0 帧"}
      - id: E4
        text: 一轮工作折叠成一张卡：运行中显示“正在处理 · N 秒”和当前步骤，完成后是可展开的“已处理 N 步 · 用时 N 秒”。显示过的条目不会再被移走。回答下有复制和朗读。
        evidence:
          - {doc: docs/87-agent-app-redesign.md, date: 2026-09-29, note: "G100 S 文字一轮约 13 秒，带“已处理 5 步”"}
      - id: E5
        text: 语音服务重启或崩溃后，应用自动重开当前对话，原来卡在“正在处理”的回合标为已结束，不一直计时。
        evidence:
          - {doc: docs/87-agent-app-redesign.md, date: 2026-09-29, note: "重启服务后显示“已处理 6 步 · 用时 34 秒”"}
      - id: E6
        text: 应用是单实例：再次启动（浮层“在应用中查看”、通知、桌面卡片）把要打开的对话交给已运行的窗口并带到前台，不重开实时连接。
        evidence:
          - {doc: docs/67-home-assistant.md, date: 2026-09-25, note: "第二个实例立即退出，已运行的应用打开对话"}
          - {doc: docs/research/proactive-system-care.md, date: 2026-09-30, note: "激活令牌，第二次唤起为同一 PID"}
      - id: E7
        text: 状态栏和导航栏与应用同色。切换浅色、深色或跟随系统时，应用、面板和浮层同时变，重启后保留。
        evidence:
          - {doc: docs/87-agent-app-redesign.md, date: 2026-09-29}
      - id: E8
        text: 应用打开时不会卡死：附件面板的照片网格无论有几张照片都能完成布局，空闲时 CPU 为 0。
        evidence:
          - {doc: docs/87-agent-app-redesign.md, date: 2026-09-29, note: "3 张照片时正常打开"}
      - id: E9
        text: 侧边栏可以搜索对话、新建、按日分组（今天、昨天、M月D日、更早）、长按删除。删除对话同时归档它的 Codex 线程。
    pitfalls:
      - text: 可交互的 ScrollBar 会把 0–1 的位置写回列表，越界时把内容一下拉回边界。触屏上用只显示的 ScrollIndicator。
        docs: [docs/59-voice-agent.md]
      - text: 定位器（Row/Column/Grid/Flow）里子项的尺寸不能依赖定位器自身的宽高，否则布局不收敛、主线程满载。
        docs: [docs/87-agent-app-redesign.md]
      - text: Codex app-server 逐个处理请求，快速连点多个对话时恢复会排队。界面不等它，所以不再被挡住。
        docs: [docs/59-voice-agent.md]
      - text: 部署工具不会自动重启已打开的应用。离屏 software 后端不绘制 MultiEffect，带图的状态只能在真实屏幕上核对。
        docs: [docs/87-agent-app-redesign.md]
      - text: 宽屏分栏、附件缩略图的圆角裁切、长 GIF 的资源占用尚未验收。
        docs: [docs/87-agent-app-redesign.md, docs/88-agent-visible-work.md]
    code:
      - agent/assistant/app/CMakeLists.txt
      - agent/assistant/app/main.cpp
      - agent/assistant/app/agentclient.cpp
      - agent/assistant/app/agentclient.h
      - agent/assistant/app/RungicVoiceAssistant.colors
      - agent/assistant/app/RungicVoiceAssistantLight.colors
      - agent/assistant/app/po/zh_CN/rungic-voice-assistant.po
      - agent/assistant/app/qml/Main.qml
      - agent/assistant/app/qml/ChatPage.qml
      - agent/assistant/app/qml/ChatModel.qml
      - agent/assistant/app/qml/ChatEntry.qml
      - agent/assistant/app/qml/ConversationDrawer.qml
      - agent/assistant/app/qml/SettingsPage.qml
      - agent/assistant/app/qml/SettingsFrame.qml
      - agent/assistant/com.rungic.VoiceAssistant.desktop
      - tools/tests/assistant_qml.py
      - tools/tests/test_assistant_app.py
      - tools/tests/test_assistant_service_side.py
    docs: [docs/59-voice-agent.md, docs/87-agent-app-redesign.md, docs/67-home-assistant.md]

  - id: agent.attachments
    title: 对话里的图片、文件和附件
    scenario: agent.talk
    status: live
    platform: linux
    summary: 对话直接显示 Agent 回答中的图片，以卡片显示文件。用户可以发送照片、文件和视频。界面播放动图，并从视频中抽帧供 Agent 查看。
    experience:
      - id: E1
        text: Agent 回答里的本机图片显示在这一轮下方（语音朗读过的回合也显示），其他本机文件显示为文件卡片。点图片看大图，正文里没有加载失败的空图。
        evidence:
          - {doc: docs/88-agent-visible-work.md, date: 2026-09-29, note: "小火箭、甜甜圈渲染图与 .blend 卡片"}
      - id: E2
        text: GIF 和动态 WebP 在对话、大图和预览里会动。小图不被放大，看不见时暂停。
        evidence:
          - {doc: docs/88-agent-visible-work.md, date: 2026-10-01, note: "手机上 offscreen qmltestrunner 7 项"}
      - id: E3
        text: 用户可以发照片和文件：图片作为图片交给 Agent，其他文件给出路径由 Agent 自己读。带图发送后 Agent 能描述图片内容，气泡上方显示缩略图。
        evidence:
          - {doc: docs/87-agent-app-redesign.md, date: 2026-09-29}
      - id: E4
        text: 视频和动图附件先抽 2–8 帧（约每 2 秒一帧，长边不超过 1024）随消息交给 Agent，并写明时长、尺寸和有无声音。没有 ffmpeg 或读不出时只附路径。用户消息先显示，不等抽帧。
        evidence:
          - {doc: docs/88-agent-visible-work.md, date: 2026-10-01, note: "20 秒 1080p 视频抽 8 帧 4.0 秒，再次命中缓存"}
      - id: E5
        text: 打开附件面板时键盘收起，面板占据键盘原来的位置。最近照片取自“图片”目录，4 列显示。
        evidence:
          - {doc: docs/87-agent-app-redesign.md, date: 2026-09-29}
    pitfalls:
      - text: Markdown 文本控件按应用自己的 qrc 基址解析裸路径。本机图片要改写为 file:// 才加载得出来。
        docs: [docs/88-agent-visible-work.md]
      - text: Codex 只收静态图（GIF 只取第一帧，动态 WebP 原样发出），所以动图和视频由我们抽帧。
        docs: [docs/88-agent-visible-work.md]
      - text: 容器的 Qt 图片插件原本没有 WebP，所有 Qt 应用都打不开 WebP。rungic-design 依赖 qt6-image-formats-plugins。
        docs: [docs/88-agent-visible-work.md]
      - text: AnimatedImage 在界面线程同步打开本地文件、会拉伸 GIF，不能直接替换 Image。视频在对话里还只显示为文件卡片。“拍照”因没有相机入口而隐藏。
        docs: [docs/88-agent-visible-work.md, docs/87-agent-app-redesign.md]
    code:
      - agent/assistant/media_frames.py
      - agent/assistant/app/qml/media.js
      - tools/tests/test_media_frames.py
    docs: [docs/88-agent-visible-work.md, docs/87-agent-app-redesign.md]

  - id: agent.progress
    title: 任务进度：计划、任务卡和语音汇报
    scenario: agent.talk
    status: live
    platform: linux
    interfaces: [platform-bridge]
    summary: Agent 执行任务时，屏幕持续显示详细计划和当前步骤。语音只在里程碑处简短汇报，并根据用户是否正在观看调整频率。
    experience:
      - id: E1
        text: 多步任务一开始列出 2–6 步计划，步骤状态随进度更新。回合结束后计划、改动的文件和步骤保存在记录里，展开“已处理 N 步”可以看到。
        evidence:
          - {doc: docs/89-agent-progress.md, date: 2026-09-29, note: "统计脚本任务三步依次更新"}
      - id: E2
        text: 命令显示为人话（“读取 x.py”“在后台运行 Blender（make_donut.py）”），运行中的命令显示最后一行输出，只认明确的进度（百分比、x/y）。
      - id: E3
        text: 语音按事件汇报：报一次计划、进入下一步说一句、单步很久才报进展。有人在看时间隔更长。超过 90 秒只道歉一次。不再每隔几十秒说“还在处理”。
        evidence:
          - {doc: docs/89-agent-progress.md, date: 2026-09-29, note: "语音只收到一次进度：报计划"}
      - id: E4
        text: 语音不把打算说成已做：交给语音的事实分成已完成、进行中、接下来打算，进度消息注明不是用户说的话。
        evidence:
          - {doc: docs/89-agent-progress.md, date: 2026-09-29, note: "事实的时态都正确"}
      - id: E5
        text: Agent 在屏幕上操作时，字幕作为“在助理屏上：…”交给语音转述。回合结束时仍显示“进行中”的字幕改为完成。
      - id: E6
        text: 任务卡的实时预览图只来自这一轮产生的图片。
      - id: E7
        text: 中文桌面上，任务卡上的步骤和说明是中文。
      - id: E8
        text: 服务端把一轮改派给别的模型时，任务卡注明“改由 X 继续（原为 Y）”。
        gap: 实机上还没发生过改派，无法构造
    pitfalls:
      - text: Codex 的 update_plan 默认关闭，要在线程配置里开 tools.update_plan.enabled。
        docs: [docs/89-agent-progress.md]
      - text: Codex 自己会把 agentMessage 旁白以 [BACKEND] 消息交给实时语音。服务再转述一次，同一句就说两遍。
        docs: [docs/89-agent-progress.md]
      - text: 是否在看要同时看应用窗口是否激活和平台桥 status 的 foreground。熄屏或回到 Android 桌面时为 false。平台桥不答时要按“没人在看”处理。
        docs: [docs/89-agent-progress.md, docs/research/97-headless-agent-work.md]
      - text: 一轮 Blender 任务约 128 秒，约 100 秒花在模型往返和逐字写代码上，Blender 本身约 25 秒。提速靠高层积木库和写进技能的稳定事实（调研，未实施）。
        docs: [docs/research/92-agent-task-speed.md]
    code:
      - agent/assistant/task_state.py
      - tools/test_task_state.py
    docs: [docs/89-agent-progress.md, docs/88-agent-visible-work.md, docs/research/92-agent-task-speed.md]

  - id: agent.phone-mode
    title: Agent 电话模式
    scenario: agent.talk
    status: experimental
    platform: linux
    interfaces: [communication-audio, platform-bridge]
    summary: 像打电话一样和 Agent 连续对话，任务在后台执行，可以随时打断或追加。
    experience:
      - id: E1
        text: Agent 的回合开始、结束不会影响电话会话。协调器意外退出后，下一次使用时自动恢复，不需要用户重开应用。
      - id: E2
        text: 只读任务不能调用任何可能改动外部的 MCP 工具。可写任务独占自己的工具进程。
      - id: E3
        text: 用户开口就停止播报，已有任务继续。只有明确的停止请求或任务卡片的停止按钮才取消任务，取消显示“正在停止”，直到 Codex 真的停下才显示已停止。
        evidence:
          - {doc: docs/101-full-duplex-phone-mode.md, date: 2026-10-02, note: "等待任务从 stopping 到后端确认 stopped"}
      - id: E4
        text: 挂断、Plasma 被遮住、音频或网络断开时关闭话音连接，任务继续执行。返回后不自动恢复，要再点“和 Agent 通话”。
        evidence:
          - {doc: docs/101-full-duplex-phone-mode.md, date: 2026-10-02, note: "Android 设置遮住 Plasma；挂断后 137×29 仍完成"}
      - id: E5
        text: 只按完整的最终转写开始任务：同一句话最多开始一个任务，句中停顿不提前执行，连接就绪前说了一半的话要求重说。执行器拿到的是转写原文，不是模型改写的话。
        evidence:
          - {doc: docs/101-full-duplex-phone-mode.md, date: 2026-10-02, note: "六场景小样本；模型重复调用 start_task 只新增一个任务"}
      - id: E6
        text: 任务需要用户回答时，问题出现在任务卡上，必须由用户回答，不自动选默认。答案只能回到提问的那个任务，已停止的任务不会被迟到的问题复活。
      - id: E7
        text: 任务和它的历史留在发起它的对话里。一句更正只送到一个任务，目标不明确时先问。
      - id: E8
        text: 静音关闭物理麦克风、播放继续。挂断后通话音频和麦克风都释放。
        evidence:
          - {doc: docs/101-full-duplex-phone-mode.md, date: 2026-10-02, note: "microphoneActive=false；关闭会话后模块为零"}
      - id: E9
        text: 有效语音到播报静音 P95 不超过 200 ms，完整话语到首音 P95 不超过 2.5 s（兜底 4 s），意图路由大样本不低于 95%，可连续进行 30 分钟。
        gap: 只有小样本云端探针和传输层测试，未做声学实测、大样本和 30 分钟真人对话
      - id: E10
        text: 停止任务或撤销它的工具租约时，只结束这个任务的工具进程组（包括忽略 SIGTERM 的后代和工具进程意外退出后留下的），用户自己运行的应用不受影响。没有租约的工具调用被拒绝。
      - id: E11
        text: 按用户实际说的语言识别和回答，不强制用桌面界面的语言。
      - id: E12
        text: 服务重启后不重放排队中或做到一半的任务，按后端的实际状态恢复显示（标为已中断）。
      - id: E13
        text: 对话顶栏的电话按钮在当前对话里开始通话，对话列表的“和 Agent 通话”新开一段对话再开始。不能开始时（Agent 正在替你打电话、另一段对话在通话）按钮显示为不可用，点一下说明原因。
      - id: E14
        text: 顶栏下方的通话条显示当前状态和通话时长。状态包括“正在连接、等你回答、正在回答、正在听、正在处理、麦克风已关、通话中”。用户可以静音、挂断或打开通话面板。面板提供打断、通话任务及状态和“去回答”。通话属于其他对话时，通话条显示“前往”。重新打开应用时，界面根据会话快照恢复。
        gap: 只有离线 QML 测试和截图。未在手机上做真人通话下的状态切换验收。
      - id: E15
        text: 通话结束在对话里留下摘要：时长、这次通话发起和完成的任务数，有任务在等回答时可直接去回答，也可以再打给它。
      - id: E16
        text: Agent 说话连贯不卡：回复的声音按 Android 实际播放的进度送出，Android 不因等数据而停顿。停顿之后不会把空档补成一阵突发。
        evidence:
          - {doc: docs/101-full-duplex-phone-mode.md, date: 2026-10-04, note: "G100 S 真人通话不卡；AudioFlinger 14.72 s 欠载为 0（修复前 10%–21%）"}
    pitfalls:
      - text: 发给协调器的每条指令都必须带 id，否则回复不带 id，曾让读取线程退出并杀掉协调器。
        docs: [docs/101-full-duplex-phone-mode.md]
      - text: Codex app-server 的 Realtime 封装把任务入口固定为 background_agent/remain_silent，VAD 也由它内部设置。所以电话模式直接连同一个 Realtime 模型，按住说话仍用原封装。
        docs: [docs/101-full-duplex-phone-mode.md]
      - text: semantic VAD 可能延迟很久，改为等本地静默和完整最终转写，2 秒仍未提交时手动 commit。
        docs: [docs/101-full-duplex-phone-mode.md]
      - text: 播放游标读取不等于“用户听到了什么”，截断位置仍有边界误差，必须声学实测。
        docs: [docs/101-full-duplex-phone-mode.md]
      - text: G100 的 Home 键返回同一个入口，不能用它测试“隐藏”。2026-10-03 的协调器修复尚未部署。
        docs: [docs/101-full-duplex-phone-mode.md]
      - text: 断线直接结束通话（不重连），所以通话条的“正在重新连接”状态目前不会出现。对话列表也还没有通话中的标记。
        docs: [docs/101-full-duplex-phone-mode.md]
    code:
      - agent/assistant/phone_session.py
      - agent/assistant/session/
      - agent/assistant/prompts/phone.md
      - tools/tests/test_phone_session.py
      - tools/tests/native_task_tools_probe.py
      - tools/system/tests/phone_session_units.py
      - agent/assistant/app/qml/call.js
      - agent/assistant/app/qml/CallSheet.qml
      - desktop/design/qml/CallBar.qml
      - desktop/design/qml/CallPanel.qml
      - tools/tests/test_agent_call.py
    docs: [docs/101-full-duplex-phone-mode.md]

  # ---- 安装、设置和接入 ---------------------------------------------------------------------------
  - id: agent.codex-install
    title: Codex 的安装与更新
    scenario: agent.setup
    status: live
    platform: linux
    summary: 系统不自带 Codex。设置里用官方脚本一键安装到用户目录，有新的正式版时提示更新。
    experience:
      - id: E1
        text: 设置里显示 Codex 已安装、未安装或正在安装。未安装时一键用官方脚本装到 ~/.codex，期间语音服务不退出，对话里提示“还差一步：安装 Codex”。
        evidence:
          - {doc: docs/99-codex-standalone.md, date: 2026-10-01, note: "Setup 报告已安装、能运行；一键安装本身未重跑"}
      - id: E2
        text: 只跟正式版：有新版本时设置显示“可更新到 X”，预发布版和带后缀的标签不算。结果缓存 6 小时，离线时保留上次的结果。
        evidence:
          - {doc: docs/99-codex-standalone.md, date: 2026-10-01, note: "CheckCodexUpdate 强制检查 0.159.2 为最新"}
      - id: E3
        text: 安装或更新完成后，等没有任务在跑、也没人在说话（最多 30 分钟）再重启 app-server，模型列表随之重新读取。
      - id: E4
        text: /usr/bin/codex 对所有调用者（助手的 app-server、命令行、实时语音）运行用户的独立安装版本，并带上手机代理。没装时提示去设置安装，退出码 127。
        evidence:
          - {doc: docs/99-codex-standalone.md, date: 2026-10-01, note: "app-server 进程为 standalone 0.159.2"}
    pitfalls:
      - text: OpenAI 按客户端版本下发模型目录：同一账户 0.156.1 看不到 GPT-6.1-Sol。所以 Codex 要跟最新正式版。
        docs: [docs/99-codex-standalone.md, docs/98-agent-model-selection.md]
      - text: Codex 在用户目录里，不随发布锁定、不随快照回滚。验收记录要写上当时 Codex 的实际版本。
        docs: [docs/99-codex-standalone.md]
      - text: 完整包里的 codex-code-mode-host 是执行命令所必需的。单独的 CLI 二进制缺它时 Agent 无法执行命令。
        docs: [docs/59-voice-agent.md]
    code:
      - agent/codex/codex-wrapper
      - packaging/rungic-codex/
      - agent/assistant/codex_install.py
      - agent/assistant/app/qml/CodexPage.qml
      - tools/tests/test_codex_install.py
    docs: [docs/99-codex-standalone.md]

  - id: agent.sign-in
    title: Codex 登录与 OpenAI API Key
    scenario: agent.setup
    status: live
    platform: linux
    summary: Codex 登录与单独的 OpenAI API Key 使用不同凭据。Codex 通过 ChatGPT 套餐或 API Key 登录，用于执行任务。单独的 OpenAI API Key 用于语音、转文字和代打电话。
    experience:
      - id: E1
        text: 设置首页分开显示 Codex 的登录方式（“ChatGPT 套餐（Team）”“API Key”或“未登录”）和 OpenAI API Key，各自说明计费归属。
        evidence:
          - {doc: docs/101-codex-sign-in-and-api-key.md, date: 2026-10-01, note: "用户重新登录后 account/read 为 chatgpt/team；页面只做了离线渲染"}
      - id: E2
        text: ChatGPT 设备码登录：15 分钟内再点显示同一个验证码，不让 Codex 顶替。被顶替或取消的那次结束不在页面上报错。重新打开页面恢复进行中的验证码。
        evidence:
          - {doc: docs/101-codex-sign-in-and-api-key.md, date: 2026-10-01, note: "两次 CodexLogin 返回同一 loginId"}
      - id: E3
        text: 改用 API Key 登录 Codex 前要确认，并写明 Agent 的任务改按 API 用量计费。没设置 Key 时这一项不可选。改用 API Key 时丢掉进行中的设备码登录。
      - id: E4
        text: 切换登录方式时语音服务不退出：被主动替换的 app-server 退出只记日志，只有意外退出才交给 systemd 恢复。
        evidence:
          - {doc: docs/101-codex-sign-in-and-api-key.md, date: 2026-10-01, note: "codex app-server exited (replaced)，NRestarts 为 0"}
      - id: E5
        text: API Key 保存前用 /v1/models 实测，没测过的密钥打开页面时自动测一次。明文保存在权限 600 的文件里，界面写明本用户的程序（包括 Agent）都能读到它。
    pitfalls:
      - text: 容器里 KDE 钥匙串（ksecretd）缺 QCA OpenSSL 插件，第一次写入还会弹英文建钱包向导并卡住调用方。用户决定 Key 明文存文件。
        docs: [docs/87-agent-app-redesign.md]
      - text: 旧 API Key 页上“改用 API Key 登录”点一下就切换、不提示计费变化，用户的 Codex 曾因此被切到 API Key。
        docs: [docs/101-codex-sign-in-and-api-key.md]
      - text: account/read 和 auth.json 分不出是设备码还是浏览器登录，界面按套餐称呼。
        docs: [docs/101-codex-sign-in-and-api-key.md]
      - text: 每次 account/login/start 都会顶替进行中的登录，旧登录以 “Login was not completed” 结束。要按 loginId 核对通知。
        docs: [docs/101-codex-sign-in-and-api-key.md]
    code:
      - agent/assistant/app/qml/AccountPage.qml
      - agent/assistant/app/qml/KeyPage.qml
      - agent/assistant/app/qml/account.js
      - agent/computer-use/rungic_cua/keys.py
      - tools/tests/test_api_key_file.py
      - tools/tests/test_voice_agent_key_page.py
      - tools/tests/test_codex_login.py
      - tools/tests/test_app_server.py
    docs: [docs/101-codex-sign-in-and-api-key.md, docs/87-agent-app-redesign.md]

  - id: agent.model-choice
    title: 选择 Agent 的模型和推理强度
    scenario: agent.setup
    status: live
    platform: linux
    summary: Agent 默认使用账户的默认模型。用户也可以选择账户可用的其他模型及其支持的推理强度。接口预留其他 provider 的接入位置。
    experience:
      - id: E1
        text: 可选的模型和强度来自账户的模型目录（隐藏的不列出）。不在目录里的模型、该模型不支持的强度都被拒绝，不保存。
        evidence:
          - {doc: docs/98-agent-model-selection.md, date: 2026-10-01, note: "gpt-4 与 gpt-6-luna+ultra 被拒"}
      - id: E2
        text: 选的模型不再提供或强度不支持时，退回账户默认或模型默认，设置里的“模型”行首显示红点。
      - id: E3
        text: 改设置后，空闲的对话立即换到新模型并恢复语音。有任务在跑、正在说话或还没有过一轮时，等这一轮结束再换。已经是目标模型时不重载。
        evidence:
          - {doc: docs/98-agent-model-selection.md, date: 2026-10-01, note: "服务日志：Astra/low 重载为 Luna/low 约 3 秒，再恢复"}
      - id: E4
        text: 模型目录读取失败时保留上次的目录，缓存 10 分钟。账户变化后重新读取，选择不再成立时提示。
      - id: E5
        text: 用量面板报告实际使用的模型名称。
        evidence:
          - {doc: docs/98-agent-model-selection.md, date: 2026-10-01, note: "用量面板变为 GPT-6-Luna"}
    pitfalls:
      - text: 已加载的会话再 thread/resume 模型不变，要先 thread/unsubscribe 再 resume。还没有过任何一轮的会话无法 resume。
        docs: [docs/98-agent-model-selection.md]
      - text: 语音触发的任务由实时模型经 background_agent 发起，沿用会话当前模型，不经过我们的 turn/start。
        docs: [docs/98-agent-model-selection.md]
      - text: 实时语音、通话画面判断仍写死模型。建议整理用自己的 CURATE_MODEL，不跟用户的选择。
        docs: [docs/98-agent-model-selection.md]
    code:
      - agent/assistant/model_catalog.py
      - agent/assistant/app/qml/ModelPage.qml
      - agent/assistant/app/qml/efforts.js
      - tools/tests/test_model_catalog.py
      - tools/tests/test_agent_model.py
    docs: [docs/98-agent-model-selection.md]

  - id: agent.instructions
    title: 指令和技能归用户，改了就生效
    scenario: agent.setup
    status: live
    platform: linux
    summary: 用户目录保留可编辑的 Agent 提示词和技能副本。升级不覆盖用户修改。改动也能在进行中的对话里很快生效。
    experience:
      - id: E1
        text: 提示词（agent.md、realtime.md）和每个技能在用户目录有真实的副本。升级时没改过的副本跟随新默认，改过的保留，新默认另存为 NAME.default。
        evidence:
          - {doc: docs/59-voice-agent.md, date: 2026-09-29, note: "用户正在用的对话恢复时收到当前指令"}
      - id: E2
        text: 改了 agent.md 或技能后约 30 秒内（Agent 空闲、没在说话时），进行中的对话也用上新指令。改了 realtime.md 在空闲时重启实时会话。
        evidence:
          - {doc: docs/59-voice-agent.md, date: 2026-09-29, note: "编辑后约 30 秒 rollout 出现带标记的 developer 消息"}
      - id: E3
        text: 包里删掉的默认技能，用户没改过的副本一起删掉，改过的保留。
      - id: E4
        text: 每个桌面用户首次登录时自动配好 rungic-desktop MCP 服务和技能目录（kconf_update，重复执行无副作用）。
    pitfalls:
      - text: Codex 把开发者指令固定在对话加载的那一刻。同一个 app-server 里再次恢复只是重新加入。包升级只 reload systemd、不重启用户服务。所以要注入新指令，而不是等下次打开。
        docs: [docs/59-voice-agent.md, docs/88-agent-visible-work.md]
      - text: Agent 在沙箱里看不到桌面进程（ps/pgrep），不能从 shell 启动图形程序。这些规则写在技能里。
        docs: [docs/60-computer-use.md]
    code:
      - agent/assistant/prompts/agent.md
      - agent/assistant/prompts/realtime.md
      - agent/assistant/skills/rungic-phone-desktop/SKILL.md
